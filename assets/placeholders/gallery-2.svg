<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Backstage static / blackout wash">
  <defs>
    <linearGradient id="g2-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0114"/>
      <stop offset="60%" stop-color="#1f0335"/>
