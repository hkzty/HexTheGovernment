<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Night session / purple terminal room">
  <defs>
    <linearGradient id="g1-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a0546"/>
      <stop offset="100%" stop-color="#0a0114"/>
    </linearGradient>
    <radialGradient id="g1-glow" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8c03fc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8c03fc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="g1-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#8c03fc" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="900" height="900" fill="url(#g1-bg)"/>
  <rect width="900" height="900" fill="url(#g1-grid)"/>
  <rect width="900" height="900" fill="url(#g1-glow)"/>
  <g font-family="'IBM Plex Mono', monospace" fill="#d7c6ea">
    <text x="60" y="100" font-size="18" opacity="0.7" letter-spacing="5">// 01_NIGHT_SESSION</text>
    <text x="60" y="820" font-size="14" opacity="0.5" letter-spacing="4">PURPLE TERMINAL ROOM</text>
  </g>
  <g transform="translate(450 450)" text-anchor="middle" font-family="'IBM Plex Mono', monospace" fill="#f5f5f3">
    <text y="-10" font-size="110" font-weight="700" letter-spacing="14">HTG</text>
    <text y="60" font-size="22" fill="#8c03fc" letter-spacing="10">93 93/93</text>
  </g>
</svg>
