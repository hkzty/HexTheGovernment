<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Cover shoot / corrupted glow">
  <defs>
    <radialGradient id="g3-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3b0866"/>
      <stop offset="70%" stop-color="#1f0335"/>
      <stop offset="100%" stop-color="#0a0114"/>
    </radialGradient>
    <radialGradient id="g3-halo" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#8c03fc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8c03fc" stop-opacity="0"/>
