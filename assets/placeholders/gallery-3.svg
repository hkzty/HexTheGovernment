  </g>
  <g font-family="'IBM Plex Mono', monospace" fill="#d7c6ea">
    <text x="60" y="100" font-size="18" opacity="0.7" letter-spacing="5">// 03_COVER_SHOOT</text>
    <text x="60" y="820" font-size="14" opacity="0.5" letter-spacing="4">CORRUPTED GLOW</text>
