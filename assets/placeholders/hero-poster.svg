<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="HTG — Hex The Government hero poster">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#2f7a52" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#143a27" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#050a07" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="baseFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1a12"/>
      <stop offset="55%" stop-color="#070f0a"/>
      <stop offset="100%" stop-color="#030503"/>
    </linearGradient>
    <linearGradient id="wordFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5fbf86" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#2f7a52" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#5fbf86" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#baseFade)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <g stroke="#5fbf86" stroke-opacity="0.16" stroke-width="1">
    <line x1="0" y1="220" x2="1920" y2="220"/>
    <line x1="0" y1="860" x2="1920" y2="860"/>
    <line x1="220" y1="0" x2="220" y2="1080"/>
    <line x1="1700" y1="0" x2="1700" y2="1080"/>
  </g>

  <g font-family="'IBM Plex Mono', monospace" fill="#9fd6b5" opacity="0.5" font-size="18" letter-spacing="6">
    <text x="220" y="180">// HTG</text>
    <text x="220" y="908">A VESSEL ON CORPORATE WATERS</text>
    <text x="1700" y="180" text-anchor="end">HEX THE GOVERNMENT</text>
    <text x="1700" y="908" text-anchor="end">ABRAXAS · STRETTY · JUSTINN.CLOUT · CIGGYHOLSTER</text>
  </g>

  <!-- Dim two-line wordmark, sized to sit behind the drawn HTG logo the page
       lays over it, echoing the frame of the hero loop it stands in for. -->
  <g transform="translate(960 540)" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-weight="700" letter-spacing="24">
    <text y="-60" fill="url(#wordFade)" font-size="200" filter="url(#soft)">HEX THE</text>
    <text y="-60" fill="#5fbf86" fill-opacity="0.55" font-size="200">HEX THE</text>
    <text y="170" fill="url(#wordFade)" font-size="200" filter="url(#soft)">GOVERNMENT</text>
    <text y="170" fill="#5fbf86" fill-opacity="0.55" font-size="200">GOVERNMENT</text>
  </g>
</svg>
