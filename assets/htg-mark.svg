<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The HTG mark: a hex holding the vessel. The H's crossbar is a hull —
       the ark riding inside the hexagram. One drawn sigil for favicons,
       share cards and merch; keep it geometry-only so it stays legible
       at 16px and scales to print. -->
  <rect width="100" height="100" rx="18" fill="#0a0a0a"/>
  <g fill="none" stroke="#f2f2f2" stroke-linecap="round">
    <!-- the hex -->
    <path d="M50 9 L85.5 29.5 L85.5 70.5 L50 91 L14.5 70.5 L14.5 29.5 Z"
          stroke-width="5.5" stroke-linejoin="miter"/>
    <!-- the vessel: H with a hull for a crossbar -->
    <path d="M36 32 L36 71" stroke-width="7"/>
    <path d="M64 32 L64 71" stroke-width="7"/>
    <path d="M36 47 C42 57 58 57 64 47" stroke-width="7"/>
    <!-- the waterline it stays afloat on -->
    <path d="M30 79 q 5 -4.5 10 0 t 10 0 t 10 0 t 10 0"
          stroke-width="3" opacity="0.55"/>
  </g>
</svg>
