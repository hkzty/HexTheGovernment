span><\/h2>\n    <p><span class=\"tslot\" data-slot=\"legal.html:101\">This site does not set advertising or analytics cookies. It uses only:<\/span><\/p>\n    <ul>\n      <li><strong><span class=\"tslot\" data-slot=\"legal.html:102\">sessionStorage<\/span><\/strong> (<code><span class=\"tslot\" data-slot=\"legal.html:104\">abx-view<\/span><\/code><span class=\"tslot\" data-slot=\"legal.html:105\">) to remember whether you chose the desktop or mobile version of the page during your visit. It is cleared when you close the tab.<\/span><\/li>\n      <li><span class=\"tslot\" data-slot=\"legal.html:106\">Any cookies that third-party embeds (Spotify, YouTube, etc.) or fonts (Google Fonts) may set when they load. Those are governed by the respective operators' policies.<\/span><\/li>\n    <\/ul>\n\n    <h2 id=\"dmca\"><span class=\"tslot\" data-slot=\"legal.html:107\">9. Copyright complaints (DMCA / notice-and-takedown)<\/span><\/h2>\n    <p><span class=\"tslot\" data-slot=\"legal.html:108\">If you believe that content on this site infringes your copyright, please send a written notice to<\/span> <a href=\"mailto:Bookings@htg.productions\"><span class=\"tslot\" data-slot=\"legal.html:109\">Bookings@htg.productions<\/span><\/a> <span class=\"tslot\" data-slot=\"legal.html:110\">containing:<\/span><\/p>\n    <ul>\n      <li><span class=\"tslot\" data-slot=\"legal.html:111\">Your name, address, and contact details;<\/span><\/li>\n      <li><span class=\"tslot\" data-slot=\"legal.html:112\">Identification of the copyrighted work you claim has been infringed;<\/span><\/li>\n      <li><span class=\"tslot\" data-slot=\"legal.html:113\">The URL(s) of the material on this site you claim is infringing;<\/span><\/li>\n      <li><span class=\"tslot\" data-slot=\"legal.html:114\">A statement, made in good faith, that the use is not authorised by the copyright owner, its agent, or the law;<\/span><\/li>\n      <li><span class=\"tslot\" data-slot=\"legal.html:115\">A statement, under penalty of perjury, that the information in the notice is accurate and that you are the copyright owner or authorised to act on the owner's behalf;<\/span><\/li>\n      <li><span class=\"tslot\" data-slot=\"legal.html:116\">Your physical or electronic signature.<\/span><\/li>\n    <\/ul>\n    <p><span class=\"tslot\" data-slot=\"legal.html:117\">We will review valid notices and remove or disable access to material as required by law. False or bad-faith notices may be reported to the sender's ISP or a relevant regulator.<\/span><\/p>\n\n    <h2 id=\"disclaimer\"><span class=\"tslot\" data-slot=\"legal.html:118\">10. Warranty disclaimer<\/span><\/h2>\n    <p><span class=\"tslot\" data-slot=\"legal.html:119\">The site and all content, including<\/span> <em><span class=\"tslot\" data-slot=\"legal.html:120\">Suit Purge<\/span><\/em><span class=\"tslot\" data-slot=\"legal.html:121\">, are provided<\/span> <strong><span class=\"tslot\" data-slot=\"legal.html:122\">\"as is\"<\/span><\/strong> <span class=\"tslot\" data-slot=\"legal.html:123\">and<\/span> <strong><span class=\"tslot\" data-slot=\"legal.html:124\">\"as available\"<\/span><\/strong><span class=\"tslot\" data-slot=\"legal.html:125\">, without warranties of any kind, express or implied, including but not limited to warranties of merchantability, fitness for a particular purpose, non-infringement, or uninterrupted availability. HTG does not warrant that the site will be error-free, secure, or free of harmful components.<\/span><\/p>\n\n    <h2 id=\"liability\"><span class=\"tslot\" data-slot=\"legal.html:126\">11. Limitation of liability<\/span><\/h2>\n    <p><span class=\"tslot\" data-slot=\"legal.html:127\">To the fullest extent permitted by law, HTG, its members, contractors, and agents shall not be liable for any indirect, incidental, special, consequential, or punitive damages, or any loss of profits, revenue, data, or goodwill, arising out of or in connection with your use of, or inability to use, this site or its content, even if HTG has been advised of the possibility of such damages. Nothing in these Terms excludes or limits liability for death or personal injury caused by negligence, fraud, or any other liability that cannot be excluded under applicable law.<\/span><\/p>\n\n    <h2 id=\"law\"><span class=\"tslot\" data-slot=\"legal.html:128\">12. Governing law &amp; jurisdiction<\/span><\/h2>\n    <p><span class=\"tslot\" data-slot=\"legal.html:129\">These Terms are governed by and construed in accordance with the law of England and Wales. Any dispute arising out of or in connection with the site or these Terms shall be subject to the exclusive jurisdiction of the courts of England and Wales, without prejudice to any mandatory consumer-protection rights available to you in your country of residence.<\/span><\/p>\n\n    <h2 id=\"changes\"><span class=\"tslot\" data-slot=\"legal.html:130\">13. Changes to this notice<\/span><\/h2>\n    <p><span class=\"tslot\" data-slot=\"legal.html:131\">HTG may update this notice from time to time. The \"Last updated\" date at the top of this page will change when it does. Continued use of the site after an update constitutes acceptance of the updated Terms.<\/span><\/p>\n\n    <h2 id=\"contact\"><span class=\"tslot\" data-slot=\"legal.html:132\">14. Contact<\/span><\/h2>\n    <p><span class=\"tslot\" data-slot=\"legal.html:133\">For legal, licensing, privacy, or takedown matters:<\/span> <a href=\"mailto:Bookings@htg.productions\"><span class=\"tslot\" data-slot=\"legal.html:134\">Bookings@htg.productions<\/span><\/a>.<\/p>\n\n    <p class=\"legal-meta\" style=\"margin-top:3rem;\"><span class=\"tslot\" data-slot=\"legal.html:136\">© HTG — Hex The Government. All rights reserved. HTG™, HEX THE GOVERNMENT™, ABRAXAS™, HEXCORE™, SUIT PURGE™ are trademarks of HTG.<\/span><\/p>\n  <\/div>\n  \n"}}}};

<script>
(function () {
  "use strict";

  var BATCH = 8;
  var groups = DATA.slots.groups;
  var previews = DATA.preview;

  /* Edits live as { "index.html": { "32": "new text" } } — keyed by the same
     ordinal the extractor writes back with. */
  var edits = {};
  var db = null;
  var remote = {};
  var pendingWrite = {};
  var writeTimer = {};

  var state = { group: groups[1] ? groups[1].id : groups[0].id, batch: 0, slot: null, query: "" };

  var el = {
    pages: document.getElementById("pages"),
    queue: document.getElementById("queue"),
    editor: document.getElementById("editor"),
    preview: document.getElementById("preview"),
    batchLabel: document.getElementById("batchLabel"),
    prevBatch: document.getElementById("prevBatch"),
    nextBatch: document.getElementById("nextBatch"),
    finder: document.getElementById("finder"),
    tally: document.getElementById("tally"),
    sync: document.getElementById("sync"),
    pvNote: document.getElementById("pvNote"),
    sheet: document.getElementById("sheet"),
    sheetText: document.getElementById("sheetText"),
    sheetNote: document.getElementById("sheetNote")
  };

  function group(id) {
    for (var i = 0; i < groups.length; i++) if (groups[i].id === id) return groups[i];
    return groups[0];
  }
  function editOf(slot) {
    var g = edits[slot.file];
    var key = slot.kind === "config" ? String(slot.line) : String(slot.ordinal);
    return g && Object.prototype.hasOwnProperty.call(g, key) ? g[key] : null;
  }
  function keyOf(slot) { return slot.kind === "config" ? String(slot.line) : String(slot.ordinal); }
  function currentText(slot) {
    var e = editOf(slot);
    return e === null ? slot.original : e;
  }
  function isEdited(slot) {
    var e = editOf(slot);
    return e !== null && e !== slot.original;
  }
  function editedCount(g) {
    var n = 0;
    for (var i = 0; i < g.slots.length; i++) if (isEdited(g.slots[i])) n++;
    return n;
  }

  /* Visible slots: the search box narrows the whole page, not just the batch,
     so a line can be found without knowing which batch holds it. */
  function visible() {
    var g = group(state.group);
    if (!state.query) return g.slots;
    var q = state.query.toLowerCase();
    return g.slots.filter(function (s) {
      return s.original.toLowerCase().indexOf(q) > -1 || currentText(s).toLowerCase().indexOf(q) > -1;
    });
  }
  function batchSlots() {
    var v = visible();
    return v.slice(state.batch * BATCH, state.batch * BATCH + BATCH);
  }

  /* ---- render: page tabs ------------------------------------------------ */
  function renderTabs() {
    el.pages.textContent = "";
    groups.forEach(function (g) {
      var b = document.createElement("button");
      b.className = "page-tab";
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", g.id === state.group ? "true" : "false");
      var name = document.createElement("b");
      name.textContent = g.short || g.label;
      b.title = g.label;
      b.appendChild(name);
      var n = editedCount(g);
      if (n) {
        var i = document.createElement("i");
        i.textContent = n;
        b.appendChild(i);
      }
      b.addEventListener("click", function () {
        if (state.group === g.id) return;
        state.group = g.id;
        state.batch = 0;
        state.slot = null;
        renderAll();
        mountPreview();
      });
      el.pages.appendChild(b);
    });
  }

  /* ---- render: queue ---------------------------------------------------- */
  function renderQueue() {
    var v = visible();
    var total = Math.max(1, Math.ceil(v.length / BATCH));
    if (state.batch >= total) state.batch = total - 1;
    el.batchLabel.innerHTML = "";
    el.batchLabel.appendChild(document.createTextNode("Batch "));
    var b1 = document.createElement("b");
    b1.textContent = (state.batch + 1) + " / " + total;
    el.batchLabel.appendChild(b1);
    el.batchLabel.appendChild(document.createTextNode(" · " + v.length + " lines"));
    el.prevBatch.disabled = state.batch === 0;
    el.nextBatch.disabled = state.batch >= total - 1;

    el.queue.textContent = "";
    batchSlots().forEach(function (slot, i) {
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.className = "slot-btn";
      b.type = "button";
      b.dataset.edited = isEdited(slot) ? "1" : "0";
      b.setAttribute("aria-current", slot.id === state.slot ? "true" : "false");

      var n = document.createElement("span");
      n.className = "slot-n";
      n.textContent = isEdited(slot) ? "✔" : String(state.batch * BATCH + i + 1);
      b.appendChild(n);

      var wrap = document.createElement("span");
      var t = document.createElement("span");
      t.className = "slot-text";
      t.textContent = currentText(slot);
      wrap.appendChild(t);
      var w = document.createElement("span");
      w.className = "slot-where";
      w.textContent = label(slot);
      wrap.appendChild(w);
      b.appendChild(wrap);

      b.addEventListener("click", function () { select(slot.id); });
      li.appendChild(b);
      el.queue.appendChild(li);
    });
  }

  var WORDS = {
    p: "paragraph", h1: "headline", h2: "heading", h3: "sub-heading", h4: "sub-heading",
    li: "list item", a: "link", button: "button", span: "label", strong: "bold run",
    b: "bold run", em: "italic run", label: "field label", td: "table cell",
    th: "table heading", title: "browser tab", kbd: "key", summary: "summary"
  };
  function label(slot) {
    if (slot.kind === "config") return "config · " + slot.where;
    if (slot.kind === "attr") return slot.where + " · search / alt text";
    return WORDS[slot.blockTag] || slot.blockTag || "text";
  }

  /* ---- render: editor --------------------------------------------------- */
  function renderEditor() {
    var slot = findSlot(state.slot);
    if (!slot) { el.editor.hidden = true; return; }
    el.editor.hidden = false;
    el.editor.textContent = "";

    var head = document.createElement("div");
    head.className = "editor-head";
    var tag = document.createElement("span");
    tag.className = "tag" + (isEdited(slot) ? " tag--edited" : "");
    tag.textContent = isEdited(slot) ? "edited" : slot.kind === "config" ? "config" : "live";
    head.appendChild(tag);
    if (slot.kind === "attr") {
      var ht = document.createElement("span");
      ht.className = "tag tag--hidden";
      ht.textContent = "search / alt text";
      head.appendChild(ht);
    }
    var where = document.createElement("span");
    where.className = "where";
    where.textContent = label(slot);
    head.appendChild(where);
    el.editor.appendChild(head);

    if (isEdited(slot)) {
      var was = document.createElement("p");
      was.className = "was";
      was.appendChild(document.createTextNode("was: "));
      var em = document.createElement("em");
      em.textContent = slot.original;
      was.appendChild(em);
      el.editor.appendChild(was);
    }

    var ta = document.createElement("textarea");
    ta.className = "draft";
    ta.value = currentText(slot);
    ta.spellcheck = true;
    ta.setAttribute("aria-label", "Copy for this line");
    el.editor.appendChild(ta);

    var foot = document.createElement("div");
    foot.className = "editor-foot";

    var reset = document.createElement("button");
    reset.className = "btn";
    reset.type = "button";
    reset.textContent = "Revert";
    reset.disabled = !isEdited(slot);
    reset.addEventListener("click", function () {
      setEdit(slot, slot.original);
      queueSave(slot.file);   /* push the revert to the shared store too, or a peer's snapshot restores it */
      renderAll();
      paintPreview();
    });
    foot.appendChild(reset);

    var next = document.createElement("button");
    next.className = "btn";
    next.type = "button";
    next.textContent = "Next line";
    next.addEventListener("click", function () { step(1); });
    foot.appendChild(next);

    var hint = document.createElement("span");
    hint.className = "hint";
    hint.innerHTML = "<kbd>Ctrl</kbd>+<kbd>Enter</kbd> next";
    foot.appendChild(hint);

    var count = document.createElement("span");
    count.className = "count";
    foot.appendChild(count);
    el.editor.appendChild(foot);

    function tick() {
      var len = ta.value.length;
      count.textContent = len + " / was " + slot.original.length;
      count.className = "count" + (len > slot.original.length * 1.6 + 20 ? " over" : "");
    }
    tick();

    ta.addEventListener("input", function () {
      setEdit(slot, ta.value);
      tick();
      paintPreview();
      queueSave(slot.file);
      var btn = el.queue.querySelector('[aria-current="true"] .slot-text');
      if (btn) btn.textContent = ta.value;
    });
    ta.addEventListener("keydown", function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); step(1); }
    });
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
  }

  function findSlot(id) {
    if (!id) return null;
    var g = group(state.group);
    for (var i = 0; i < g.slots.length; i++) if (g.slots[i].id === id) return g.slots[i];
    return null;
  }

  function setEdit(slot, text) {
    if (!edits[slot.file]) edits[slot.file] = {};
    if (text === slot.original) delete edits[slot.file][keyOf(slot)];
    else edits[slot.file][keyOf(slot)] = text;
    renderTabs();
    renderTally();
    saveLocal();
  }

  function select(id) {
    state.slot = id;
    var v = visible();
    for (var i = 0; i < v.length; i++) {
      if (v[i].id === id) { state.batch = Math.floor(i / BATCH); break; }
    }
    renderQueue();
    renderEditor();
    paintPreview(true);
  }

  function step(dir) {
    var v = visible();
    var at = -1;
    for (var i = 0; i < v.length; i++) if (v[i].id === state.slot) { at = i; break; }
    var nxt = v[at + dir];
    if (nxt) select(nxt.id);
  }

  function renderTally() {
    var done = 0, all = 0;
    groups.forEach(function (g) { done += editedCount(g); all += g.slots.length; });
    el.tally.textContent = "";
    var b = document.createElement("b");
    b.textContent = done;
    el.tally.appendChild(b);
    el.tally.appendChild(document.createTextNode(" of " + all + " changed"));
  }

  function renderAll() {
    renderTabs();
    renderQueue();
    renderEditor();
    renderTally();
  }

  /* ---- preview ---------------------------------------------------------- */
  var shadow = null;
  var mounted = null;

  function mountPreview() {
    var page = previews.pages[state.group];
    el.pvNote.textContent = page ? "live page" : "shared strings — no page of its own";
    if (!page) { el.preview.textContent = ""; shadow = null; mounted = null; return; }
    if (mounted === state.group) { paintPreview(true); return; }

    el.preview.textContent = "";
    var host = document.createElement("div");
    el.preview.appendChild(host);
    shadow = host.attachShadow({ mode: "open" });
    shadow.innerHTML =
      "<style>" + previews.css + "</style>" +
      "<style>" + page.css + "</style>" +
      "<style>" + OVERRIDES + "</style>" +
      '<div class="pv-html js"><div class="pv-body">' + page.html + "</div></div>";
    mounted = state.group;

    shadow.addEventListener("click", function (e) {
      var hit = e.target.closest ? e.target.closest(".tslot") : null;
      if (!hit) return;
      e.preventDefault();
      select(hit.dataset.slot);
    });
    /* Nothing in the preview navigates — it is a proof sheet, not the site. */
    shadow.addEventListener("submit", function (e) { e.preventDefault(); });
    paintPreview(true);
  }

  function paintPreview(scroll) {
    if (!shadow) return;
    var g = group(state.group);
    g.slots.forEach(function (slot) {
      if (slot.kind !== "text") return;
      var node = shadow.querySelector('[data-slot="' + cssEscape(slot.id) + '"]');
      if (!node) return;
      var text = currentText(slot);
      if (node.dataset.painted !== text) {
        node.textContent = text;
        node.dataset.painted = text;
      }
      node.classList.toggle("is-edited", isEdited(slot));
      var active = slot.id === state.slot;
      node.classList.toggle("is-active", active);
      if (active && scroll) scrollPaneTo(node);
    });
  }

  function cssEscape(v) { return v.replace(/["\\]/g, "\\$&"); }

  /* scrollIntoView would walk every scrollable ancestor, taking the desk with
     it. The preview pane is the only thing that should move. */
  function scrollPaneTo(node) {
    var box = node.getBoundingClientRect();
    var pane = el.preview.getBoundingClientRect();
    if (!box.height && !box.width) return;
    var delta = (box.top + box.height / 2) - (pane.top + pane.height / 2);
    el.preview.scrollTo({ top: el.preview.scrollTop + delta, behavior: "smooth" });
  }

  var OVERRIDES = [
    ".tslot { display: contents; }",
    ".tslot.is-edited { color: #7ef0a6; }",
    ".tslot.is-active { display: inline; background: rgba(180,120,255,0.22); box-shadow: 0 0 0 2px #b478ff; border-radius: 2px; }",
    /* The page's fixed chrome and its scroll-triggered reveals both assume a
       real viewport; inside the preview pane they would float over the desk
       or never fire at all. */
    ".pv-body .topbar { position: static; }",
    ".pv-body .sticky-cta, .pv-body .to-top, .pv-body .skip-link, .pv-body .cursor, .pv-body .cursor-dot { display: none; }",
    ".pv-body .fade-in { opacity: 1; transform: none; }",
    ".pv-body .hero { min-height: auto; padding-top: 3rem; padding-bottom: 3rem; }",
    ".pv-body section[hidden] { display: block; }",
    ".pv-body main { padding-top: 0; }",
    ":host { --nav-height: 0px; }",
    ".pv-body a { cursor: default; }"
  ].join("\n");

  /* ---- persistence ------------------------------------------------------ */
  var LOCAL = "htg-copy-desk";

  function saveLocal() {
    try { localStorage.setItem(LOCAL, JSON.stringify(edits)); } catch (e) { /* private window */ }
  }
  function loadLocal() {
    try {
      var raw = localStorage.getItem(LOCAL);
      if (raw) edits = JSON.parse(raw) || {};
    } catch (e) { edits = {}; }
  }

  var seeded = {};

  function mergeRemote(file, slots) {
    remote[file] = slots || {};
    var local = edits[file] || {};
    var merged = {};
    var k;
    for (k in remote[file]) if (Object.prototype.hasOwnProperty.call(remote[file], k)) merged[k] = remote[file][k];
    /* A line being typed right now stays the typist's — everything else takes
       the shared value, so both desks converge without one erasing the other. */
    var activeKey = null, activeFile = null;
    var s = findSlot(state.slot);
    if (s) { activeKey = keyOf(s); activeFile = s.file; }
    /* First snapshot after connecting: work done offline is real work, so it
       joins the shared copy rather than being overwritten by it. */
    var carry = !seeded[file] || pendingWrite[file];
    var extras = false;
    for (k in local) {
      if (!Object.prototype.hasOwnProperty.call(local, k)) continue;
      if (file === activeFile && k === activeKey) merged[k] = local[k];
      else if (carry && !Object.prototype.hasOwnProperty.call(merged, k)) { merged[k] = local[k]; extras = true; }
    }
    edits[file] = merged;
    saveLocal();
    if (!seeded[file]) {
      seeded[file] = true;
      if (extras) queueSave(file);
    }
  }

  function queueSave(file) {
    if (!db) return;
    pendingWrite[file] = true;
    el.sync.dataset.state = "saving";
    el.sync.textContent = "saving";
    clearTimeout(writeTimer[file]);
    writeTimer[file] = setTimeout(function () {
      var body = { slots: edits[file] || {}, at: new Date().toISOString() };
      db.doc("edits/" + file).set(body).then(function () {
        pendingWrite[file] = false;
        el.sync.dataset.state = "live";
        el.sync.textContent = "shared";
      }, function () {
        el.sync.dataset.state = "local";
        el.sync.textContent = "local only";
      });
    }, 500);
  }

  function connect() {
    if (!window.claude || !claude.use) return;
    claude.use("db").then(function (d) {
      if (!d) return;
      db = d;
      el.sync.dataset.state = "live";
      el.sync.textContent = "shared";
      groups.forEach(function (g) {
        db.doc("edits/" + g.id).onSnapshot(function (snap) {
          var data = snap.exists ? snap.data() : null;
          mergeRemote(g.id, data && data.slots ? data.slots : {});
          if (!snap.metadata.hasPendingWrites) {
            renderTabs();
            renderQueue();
            renderTally();
            paintPreview();
            var open = document.activeElement;
            if (!open || open.className !== "draft") renderEditor();
          }
        }, function () {
          el.sync.dataset.state = "local";
          el.sync.textContent = "local only";
        });
      });
    });
  }

  /* ---- export ----------------------------------------------------------- */
  function changedList() {
    var out = [];
    groups.forEach(function (g) {
      g.slots.forEach(function (s) {
        if (isEdited(s)) out.push({ id: s.id, file: s.file, was: s.original, text: currentText(s) });
      });
    });
    return out;
  }

  document.getElementById("export").addEventListener("click", function () {
    var list = changedList();
    el.sheetText.value = list.length
      ? JSON.stringify(list, null, 2)
      : "Nothing changed yet.";
    el.sheetNote.textContent = list.length + " line" + (list.length === 1 ? "" : "s");
    el.sheet.showModal();
    el.sheetText.select();
  });
  document.getElementById("sheetCopy").addEventListener("click", function () {
    el.sheetText.select();
    var done = false;
    try { done = document.execCommand("copy"); } catch (e) { done = false; }
    if (!done && navigator.clipboard) {
      navigator.clipboard.writeText(el.sheetText.value).then(function () {
        el.sheetNote.textContent = "copied";
      }, function () {
        el.sheetNote.textContent = "select the text and copy by hand";
      });
      return;
    }
    el.sheetNote.textContent = done ? "copied" : "select the text and copy by hand";
  });
  document.getElementById("sheetClose").addEventListener("click", function () { el.sheet.close(); });

  /* ---- wiring ----------------------------------------------------------- */
  el.prevBatch.addEventListener("click", function () {
    if (state.batch > 0) { state.batch--; renderQueue(); }
  });
  el.nextBatch.addEventListener("click", function () {
    state.batch++; renderQueue();
  });
  el.finder.addEventListener("input", function () {
    state.query = el.finder.value.trim();
    state.batch = 0;
    renderQueue();
  });

  loadLocal();
  renderAll();
  mountPreview();
  connect();

  var slots = group(state.group).slots;
  var first = null;
  for (var i = 0; i < slots.length && !first; i++) if (slots[i].kind === "text") first = slots[i];
  if (!first) first = slots[0];
  if (first) select(first.id);
})();
</script>

</body>
</html>
