<title>HTG Copy Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* The desk borrows the site's own palette so the copy is judged against the
   ground it will actually sit on. Committed dark, single theme — the site
   has no light mode and a light desk would lie about the contrast. */
:root {
  --ink:        #f2f2f0;
  --ink-soft:   #b9b9c0;
  --ink-faint:  #75757f;
  --ground:     #0b0b0c;
  --panel:      #131317;
  --panel-2:    #1a1a20;
  --line:       rgba(255, 255, 255, 0.10);
  --line-hot:   rgba(255, 255, 255, 0.22);
  --accent:     #b478ff;
  --accent-dim: rgba(180, 120, 255, 0.16);
  --done:       #16c85a;
  --done-dim:   rgba(22, 200, 90, 0.14);
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --display: "New Rocker", "IBM Plex Mono", serif;
  --rail-h: 3.75rem;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- top rail ---------------------------------------------------------- */
.rail {
  position: sticky;
  top: 0;
  z-index: 20;
  height: var(--rail-h);
  display: flex;
  align-items: center;
  gap: 1.25rem;
  padding: 0 1rem;
  background: rgba(11, 11, 12, 0.94);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.wordmark {
  font-family: var(--display);
  font-size: 1.5rem;
  line-height: 1;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.wordmark span { color: var(--accent); }

.pages { display: flex; gap: 1px; overflow-x: auto; flex: 1; min-width: 0; }
.pages::-webkit-scrollbar { height: 0; }
.page-tab {
  flex: 0 0 auto;
  background: none;
  border: 1px solid transparent;
  border-radius: 2px;
  padding: 0.35rem 0.7rem;
  color: var(--ink-faint);
  cursor: pointer;
  white-space: nowrap;
  letter-spacing: 0.04em;
}
.page-tab:hover { color: var(--ink); }
.page-tab[aria-selected="true"] {
  color: var(--ink);
  border-color: var(--line-hot);
  background: var(--panel-2);
}
.page-tab b { font-weight: 500; }
.page-tab i {
  font-style: normal;
  color: var(--done);
  margin-left: 0.45rem;
}

.rail-right { display: flex; align-items: center; gap: 0.75rem; white-space: nowrap; }
.tally { color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.tally b { color: var(--done); font-weight: 600; }

.btn {
  background: var(--panel-2);
  border: 1px solid var(--line-hot);
  border-radius: 2px;
  padding: 0.4rem 0.9rem;
  cursor: pointer;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-size: 0.72rem;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn--go { background: var(--accent); border-color: var(--accent); color: #17071f; font-weight: 600; }
.btn--go:hover { color: #17071f; filter: brightness(1.1); }
.btn:disabled { opacity: 0.35; cursor: default; border-color: var(--line); color: var(--ink-faint); }

.sync {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  color: var(--ink-faint);
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.sync::before {
  content: "";
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--ink-faint);
}
.sync[data-state="live"]::before { background: var(--done); box-shadow: 0 0 8px var(--done); }
.sync[data-state="saving"]::before { background: var(--accent); }
.sync[data-state="local"]::before { background: #e0a33c; }

/* ---- stage ------------------------------------------------------------- */
.stage {
  display: grid;
  grid-template-columns: minmax(24rem, 34rem) 1fr;
  height: calc(100vh - var(--rail-h));
}
.desk {
  border-right: 1px solid var(--line);
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  min-height: 0;
  background: var(--panel);
}

/* ---- batch strip ------------------------------------------------------- */
.batchbar {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.7rem 0.9rem;
  border-bottom: 1px solid var(--line);
}
.batchbar h2 {
  margin: 0;
  font-size: 0.72rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-weight: 500;
  flex: 1;
}
.batchbar h2 b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.step {
  background: none;
  border: 1px solid var(--line-hot);
  border-radius: 2px;
  width: 1.9rem; height: 1.7rem;
  cursor: pointer;
  line-height: 1;
}
.step:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.step:disabled { opacity: 0.3; cursor: default; }

.finder {
  width: 100%;
  background: var(--ground);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 0.45rem 0.6rem;
  color: var(--ink);
}
.finder::placeholder { color: var(--ink-faint); }
.finder-wrap { padding: 0.7rem 0.9rem; border-bottom: 1px solid var(--line); }

/* ---- queue ------------------------------------------------------------- */
.queue-scroll { overflow-y: auto; min-height: 0; }
.queue { list-style: none; margin: 0; padding: 0; }
.queue li { border-bottom: 1px solid var(--line); }
.slot-btn {
  display: grid;
  grid-template-columns: 1.6rem 1fr;
  gap: 0.6rem;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  border-left: 2px solid transparent;
  padding: 0.6rem 0.9rem;
  cursor: pointer;
  color: var(--ink-soft);
}
.slot-btn:hover { background: var(--panel-2); }
.slot-btn[aria-current="true"] {
  background: var(--accent-dim);
  border-left-color: var(--accent);
  color: var(--ink);
}
.slot-n {
  color: var(--ink-faint);
  font-size: 0.7rem;
  font-variant-numeric: tabular-nums;
  padding-top: 0.15rem;
}
.slot-btn[data-edited="1"] .slot-n { color: var(--done); }
.slot-text {
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  line-height: 1.45;
}
.slot-where {
  display: block;
  font-size: 0.66rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-top: 0.2rem;
}

/* ---- editor ------------------------------------------------------------ */
.editor {
  border-top: 1px solid var(--line-hot);
  background: var(--panel-2);
  padding: 0.9rem;
  display: grid;
  gap: 0.7rem;
  align-content: start;
}
.editor-head { display: flex; align-items: baseline; gap: 0.6rem; }
.tag {
  font-size: 0.64rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  border: 1px solid var(--line-hot);
  border-radius: 2px;
  padding: 0.1rem 0.4rem;
  color: var(--ink-faint);
}
.tag--edited { color: var(--done); border-color: var(--done); }
.tag--hidden { color: #e0a33c; border-color: #e0a33c; }
.editor-head .where {
  color: var(--ink-faint);
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.was {
  margin: 0;
  color: var(--ink-faint);
  border-left: 2px solid var(--line);
  padding-left: 0.7rem;
  font-size: 0.78rem;
  max-height: 5.5rem;
  overflow-y: auto;
}
.was em { font-style: normal; color: var(--ink-soft); }
textarea.draft {
  width: 100%;
  min-height: 7.5rem;
  resize: vertical;
  background: var(--ground);
  border: 1px solid var(--line-hot);
  border-radius: 2px;
  padding: 0.7rem;
  line-height: 1.65;
}
textarea.draft:focus { border-color: var(--accent); outline: none; }
.editor-foot { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
.count { color: var(--ink-faint); font-variant-numeric: tabular-nums; font-size: 0.72rem; margin-left: auto; }
.count.over { color: #e0a33c; }
.hint { color: var(--ink-faint); font-size: 0.7rem; }
kbd {
  border: 1px solid var(--line-hot);
  border-radius: 2px;
  padding: 0 0.28rem;
  font-size: 0.9em;
}

/* ---- preview ----------------------------------------------------------- */
.stagepane { position: relative; overflow: hidden; background: #000; }
.pv-note {
  position: absolute;
  z-index: 5;
  top: 0.6rem; right: 0.8rem;
  background: rgba(11, 11, 12, 0.85);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 0.25rem 0.55rem;
  font-size: 0.66rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-faint);
  pointer-events: none;
}
#preview { height: 100%; overflow-y: auto; overflow-x: hidden; }

/* ---- export sheet ------------------------------------------------------ */
dialog.sheet {
  background: var(--panel);
  color: var(--ink);
  border: 1px solid var(--line-hot);
  border-radius: 3px;
  padding: 1rem;
  width: min(46rem, 92vw);
}
dialog.sheet::backdrop { background: rgba(0, 0, 0, 0.72); }
dialog.sheet h2 { margin: 0 0 0.3rem; font-size: 0.95rem; letter-spacing: 0.02em; }
dialog.sheet p { margin: 0 0 0.7rem; color: var(--ink-soft); }
dialog.sheet textarea {
  width: 100%;
  height: 16rem;
  background: var(--ground);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 0.6rem;
  font-size: 0.74rem;
  resize: vertical;
}
.sheet-foot { display: flex; gap: 0.6rem; align-items: center; margin-top: 0.7rem; }

@media (max-width: 900px) {
  .stage { grid-template-columns: 1fr; height: auto; }
  .desk { border-right: 0; border-bottom: 1px solid var(--line-hot); }
  .queue-scroll { max-height: 40vh; }
  #preview { height: 70vh; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

<div class="rail">
  <div class="wordmark">HTG <span>copy desk</span></div>
  <div class="pages" id="pages" role="tablist" aria-label="Pages"></div>
  <div class="rail-right">
    <span class="sync" id="sync" data-state="local">local only</span>
    <span class="tally" id="tally"></span>
    <button class="btn btn--go" id="export" type="button">Send to Claude</button>
  </div>
</div>

<div class="stage">
  <section class="desk" aria-label="Copy queue">
    <div class="finder-wrap">
      <input class="finder" id="finder" type="search" placeholder="Find a line…" aria-label="Find a line" />
    </div>
    <div class="batchbar">
      <h2 id="batchLabel">Batch</h2>
      <button class="step" id="prevBatch" type="button" aria-label="Previous batch">←</button>
      <button class="step" id="nextBatch" type="button" aria-label="Next batch">→</button>
    </div>
    <div class="queue-scroll">
      <ol class="queue" id="queue"></ol>
    </div>
    <div class="editor" id="editor" hidden></div>
  </section>

  <section class="stagepane" aria-label="Live page">
    <span class="pv-note" id="pvNote">live page</span>
    <div id="preview"></div>
  </section>
</div>

<dialog class="sheet" id="sheet">
  <h2>Changed lines</h2>
  <p>Paste this back into the chat and Claude writes it into the site.</p>
  <textarea id="sheetText" readonly spellcheck="false"></textarea>
  <div class="sheet-foot">
    <button class="btn btn--go" id="sheetCopy" type="button">Copy</button>
    <button class="btn" id="sheetClose" type="button">Close</button>
    <span class="hint" id="sheetNote"></span>
  </div>
</dialog>

border-radius: 0;\n      border: 0;\n      background: none;\n      color: var(--accent);\n      text-transform: uppercase;\n      letter-spacing: 0.16rem;\n      font-size: 0.78rem;\n      text-decoration: none;\n      text-underline-offset: 6px;\n      transition: color var(--transition), text-shadow var(--transition);\n      cursor: pointer;\n    }\n\n    .btn::before,\n    .inline-link::before {\n      content: \"[\";\n    }\n\n    .btn::after,\n    .inline-link::after {\n      content: \"]\";\n    }\n\n    .btn:hover,\n    .btn:focus-visible,\n    .inline-link:hover,\n    .inline-link:focus-visible {\n      text-decoration: underline;\n      text-shadow: 0 0 18px rgba(255, 255, 255, 0.45);\n    }\n\n    .btn-primary {\n      font-weight: 700;\n    }\n\n    .gallery-item,\n    .contact-card {\n      background: var(--panel);\n      border: 1px solid var(--line);\n      border-radius: var(--radius);\n      box-shadow: var(--shadow);\n      position: relative;\n      overflow: hidden;\n    }\n\n    .gallery-item::before,\n    .contact-card::before {\n      content: \"\";\n      position: absolute;\n      inset: 0;\n      border: 1px solid rgba(255, 255, 255, 0.03);\n      border-radius: inherit;\n      pointer-events: none;\n    }\n\n    .section {\n      padding: var(--section-space) 0;\n      position: relative;\n    }\n\n    /* Suit Purge easter egg: the #game section ships hidden and is unlocked\n       at runtime by script.js (Konami code / type \"purge\" / tap wordmark). */\n    #game[hidden] {\n      display: none !important;\n    }\n\n    #game.egg-reveal {\n      animation: eggReveal 0.9s ease both;\n    }\n\n    @keyframes eggReveal {\n      from { opacity: 0; transform: translateY(24px); }\n      to { opacity: 1; transform: none; }\n    }\n\n    .section-head {\n      display: grid;\n      gap: 0.85rem;\n      margin-bottom: 2rem;\n      max-width: 760px;\n    }\n\n    .section-kicker {\n      color: var(--accent);\n      text-transform: uppercase;\n      letter-spacing: 0.26rem;\n      font-size: 0.75rem;\n    }\n\n    /* Section heads are the kicker alone, as the h2. */\n    h2.section-kicker {\n      font-family: inherit;\n      font-weight: 500;\n      margin: 0;\n    }\n\n    .game-disclaimer {\n      font-size: 0.8rem;\n      color: var(--muted);\n    }\n\n    .game-disclaimer a {\n      color: var(--accent);\n      text-decoration: underline;\n      text-underline-offset: 3px;\n    }\n\n    .section-copy {\n      color: var(--muted);\n      max-width: 62ch;\n    }\n\n    .gallery-grid,\n    .player-grid,\n    .footer-grid {\n      display: grid;\n      gap: 1rem;\n    }\n\n    .player-grid {\n      grid-template-columns: repeat(3, minmax(0, 1fr));\n    }\n\n    /* Embedded players injected from config.outNowEmbeds */\n    .embed-grid {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      gap: 1rem;\n      margin-top: 1rem;\n    }\n\n    .embed-card {\n      background: var(--panel);\n      border: 1px solid var(--line);\n      border-radius: var(--radius);\n      box-shadow: var(--shadow);\n      overflow: hidden;\n      padding: 0.6rem;\n    }\n\n    .embed-card iframe {\n      display: block;\n      width: 100%;\n      border: 0;\n      border-radius: var(--radius-sm);\n    }\n\n    .contact-card h3 {\n      font-size: 1rem;\n      text-transform: uppercase;\n      letter-spacing: 0.12rem;\n      margin-bottom: 0.75rem;\n    }\n\n\n    .gallery-thumb {\n      aspect-ratio: 1 / 1;\n      object-fit: cover;\n      width: 100%;\n    }\n\n    .gallery-grid {\n      grid-template-columns: repeat(3, minmax(0, 1fr));\n    }\n\n    .gallery-item {\n      overflow: hidden;\n      cursor: pointer;\n      min-height: 100%;\n    }\n\n    .gallery-item img {\n      transition: transform 400ms ease, filter 400ms ease;\n      filter: grayscale(0.35) contrast(1.08);\n    }\n\n    .gallery-item:hover img,\n    .gallery-item:focus-visible img {\n      transform: scale(1.04);\n      filter: grayscale(0.05) contrast(1.12);\n    }\n\n\n    .contact-wrap {\n      display: grid;\n      grid-template-columns: 0.9fr 1.1fr;\n      gap: 1rem;\n    }\n\n    .contact-card {\n      padding: 1.3rem;\n    }\n\n    .contact-list {\n      list-style: none;\n      display: grid;\n      gap: 0.85rem;\n      margin-top: 1rem;\n    }\n\n    .contact-list li {\n      display: grid;\n      gap: 0.25rem;\n      padding: 0.8rem 0.9rem;\n      border-radius: var(--radius-sm);\n      border: 1px solid var(--line);\n      background: rgba(255, 255, 255, 0.04);\n    }\n\n    .contact-list strong {\n      color: var(--accent);\n      text-transform: uppercase;\n      font-size: 0.75rem;\n      letter-spacing: 0.16rem;\n    }\n\n    .contact-list a {\n      color: var(--text);\n      text-decoration: underline;\n      text-decoration-color: rgba(255, 255, 255, 0.5);\n      text-underline-offset: 3px;\n      overflow-wrap: anywhere;\n    }\n\n    .contact-list a:hover,\n    .contact-list a:focus-visible {\n      color: var(--accent);\n    }\n\n    .contact-form {\n      display: grid;\n      gap: 1rem;\n    }\n\n    .form-grid {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      gap: 1rem;\n    }\n\n    .field {\n      display: grid;\n      gap: 0.45rem;\n    }\n\n    .field label {\n      font-size: 0.75rem;\n      text-transform: uppercase;\n      letter-spacing: 0.16rem;\n      color: var(--muted);\n    }\n\n    .field input,\n    .field textarea {\n      width: 100%;\n      padding: 0.95rem 1rem;\n      border-radius: var(--radius-sm);\n      border: 1px solid rgba(255, 255, 255, 0.2);\n      background: rgba(255, 255, 255, 0.02);\n      color: var(--text);\n      outline: none;\n      transition: border-color var(--transition), background var(--transition), box-shadow var(--transition);\n    }\n\n    .field input:focus,\n    .field textarea:focus {\n      border-color: rgba(255, 255, 255, 0.65);\n      background: rgba(255, 255, 255, 0.04);\n      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.08);\n    }\n\n    .field textarea {\n      min-height: 180px;\n      resize: vertical;\n    }\n\n    /* Honeypot — out of flow and invisible, but still in the form for bots\n       to fill. display:none is avoided: some bots skip hidden inputs. */\n    .hp-field {\n      position: absolute;\n      width: 1px;\n      height: 1px;\n      padding: 0;\n      border: 0;\n      overflow: hidden;\n      clip-path: inset(50%);\n      white-space: nowrap;\n    }\n\n    .error-message {\n      min-height: 1rem;\n      color: var(--danger);\n      font-size: 0.8rem;\n    }\n\n    .form-status {\n      min-height: 1.2rem;\n      font-size: 0.86rem;\n      color: var(--accent);\n    }\n\n    .footer {\n      padding: 0 0 3rem;\n    }\n\n    .footer-grid {\n      grid-template-columns: 1.2fr 0.8fr;\n      align-items: center;\n      padding: 1.4rem;\n      border: 1px solid var(--line);\n      border-radius: var(--radius);\n      background: rgba(17, 17, 17, 0.92);\n      box-shadow: var(--shadow);\n    }\n\n\n    .social-links {\n      display: flex;\n      flex-wrap: wrap;\n      justify-content: flex-end;\n      gap: 0.75rem;\n    }\n\n    .social-link {\n      width: 48px;\n      height: 48px;\n      border-radius: 50%;\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      border: 1px solid var(--line);\n      background: rgba(255, 255, 255, 0.04);\n      color: var(--text);\n      transition: transform var(--transition), border-color var(--transition), background var(--transition);\n    }\n\n    .social-link svg {\n      width: 20px;\n      height: 20px;\n      fill: currentColor;\n    }\n\n    .social-link:hover,\n    .social-link:focus-visible {\n      transform: translateY(-2px);\n      border-color: rgba(255, 255, 255, 0.6);\n      background: rgba(255, 255, 255, 0.12);\n      color: var(--accent);\n    }\n\n    .lightbox {\n      position: fixed;\n      inset: 0;\n      z-index: 1200;\n      display: grid;\n      place-items: center;\n      padding: 1rem;\n      background: rgba(0, 0, 0, 0.92);\n      opacity: 0;\n      visibility: hidden;\n      /* visibility flips instantly on open (so the dialog can take focus)\n         and only after the fade on close */\n      transition: opacity var(--transition), visibility 0s linear var(--transition);\n    }\n\n    .lightbox.open {\n      opacity: 1;\n      visibility: visible;\n      transition: opacity var(--transition), visibility 0s;\n    }\n\n    .lightbox-dialog {\n      width: min(1080px, 100%);\n      position: relative;\n      display: grid;\n      gap: 0.8rem;\n    }\n\n    .lightbox-figure {\n      border-radius: var(--radius);\n      overflow: hidden;\n      border: 1px solid var(--line);\n      background: #000;\n      box-shadow: var(--shadow);\n    }\n\n    .lightbox-figure img {\n      width: 100%;\n      max-height: 76vh;\n      object-fit: contain;\n      background: #000;\n    }\n\n    .lightbox-bar {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 1rem;\n      color: var(--muted);\n      font-size: 0.85rem;\n    }\n\n    .lightbox-actions {\n      display: flex;\n      gap: 0.65rem;\n    }\n\n    .icon-btn {\n      width: 46px;\n      height: 46px;\n      border-radius: 50%;\n      border: 1px solid var(--line-strong);\n      background: rgba(255, 255, 255, 0.04);\n      color: var(--text);\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      cursor: pointer;\n      transition: transform var(--transition), background var(--transition), border-color var(--transition);\n    }\n\n    .icon-btn:hover,\n    .icon-btn:focus-visible {\n      transform: translateY(-2px);\n      background: rgba(255, 255, 255, 0.12);\n      border-color: rgba(255, 255, 255, 0.75);\n    }\n\n    /* Reveal animation only arms itself when JS is running, so content is\n       never stuck invisible if the script fails to load. */\n    .fade-in {\n      transition: opacity 650ms ease, transform 650ms ease;\n    }\n\n    .js .fade-in {\n      opacity: 0;\n      transform: translateY(24px);\n    }\n\n    .js .fade-in.visible {\n      opacity: 1;\n      transform: translateY(0);\n    }\n\n\n    .skip-link {\n      position: fixed;\n      top: 0.5rem;\n      left: 0.5rem;\n      z-index: 2000;\n      padding: 0.6rem 0.9rem;\n      background: var(--accent);\n      color: #000;\n      border-radius: 4px;\n      text-decoration: none;\n      font-weight: 600;\n      transform: translateY(-200%);\n      transition: transform var(--transition);\n    }\n    .skip-link:focus {\n      transform: translateY(0);\n      outline: 2px solid #000;\n      outline-offset: 2px;\n    }\n\n    @media (max-width: 1080px) {\n      .hero-content,\n      .contact-wrap,\n      .footer-grid {\n        grid-template-columns: 1fr;\n      }\n\n      .player-grid,\n      .gallery-grid {\n        grid-template-columns: repeat(2, minmax(0, 1fr));\n      }\n    }\n\n    @media (max-width: 820px) {\n      :host {\n        --nav-height: 92px;\n      }\n\n      .topbar-inner {\n        justify-items: stretch;\n        padding: 0.85rem 1rem 0.9rem;\n      }\n\n      .menu-toggle {\n        display: inline-flex;\n      }\n\n      .nav {\n        display: none;\n        padding-top: 0.85rem;\n      }\n\n      .nav.open {\n        display: block;\n      }\n\n      .nav-list {\n        flex-direction: column;\n        align-items: stretch;\n      }\n\n      .nav-list a {\n        justify-content: flex-start;\n        padding-inline: 1rem;\n        border-radius: var(--radius-sm);\n      }\n\n      .hero {\n        min-height: auto;\n      }\n\n      .hero h1 {\n        font-size: clamp(2.7rem, 14vw, 4.5rem);\n      }\n\n      .pill-links,\n      .social-links {\n        justify-content: flex-start;\n      }\n\n      .embed-grid {\n        grid-template-columns: 1fr;\n      }\n    }\n\n    @media (max-width: 640px) {\n      main {\n        padding-top: 0;\n      }\n\n      .container {\n        width: min(var(--max), calc(100% - 1rem));\n      }\n\n      .section {\n        padding: clamp(3.5rem, 10vw, 5rem) 0;\n      }\n\n      .player-grid,\n      .gallery-grid,\n      .form-grid {\n        grid-template-columns: 1fr;\n      }\n\n      .section-head {\n        max-width: 100%;\n      }\n    }\n\n    @media (prefers-reduced-motion: reduce) {\n      .pv-html {\n        scroll-behavior: auto;\n      }\n\n      *, *::before, *::after {\n        animation: none !important;\n        transition: none !important;\n      }\n\n      .fade-in {\n        opacity: 1;\n        transform: none;\n      }\n    }\n  \n\n    /* THE SEQUENCE — playthrough players, highlights, badges */\n    .sequence-block {\n      margin-top: 1rem;\n    }\n\n    .sequence-artist .embed-card {\n      max-width: 760px;\n    }\n\n    .embed-card.highlight {\n      border-color: rgba(255, 255, 255, 0.75);\n      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35), 0 0 34px rgba(255, 255, 255, 0.25), var(--shadow);\n    }\n\n    .embed-head {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 0.5rem;\n      padding: 0.15rem 0.35rem 0.55rem;\n    }\n\n    .embed-num {\n      color: var(--accent);\n      font-size: 0.8rem;\n      letter-spacing: 0.2rem;\n    }\n\n\n    /* Covers-first sequence: the grid shows art, the player loads on tap. */\n    .cover-grid {\n      display: grid;\n      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));\n      gap: 1rem;\n      margin-top: 1rem;\n    }\n\n    .cover-card {\n      display: flex;\n      flex-direction: column;\n      padding: 0;\n      text-align: left;\n      font: inherit;\n      color: var(--text);\n      background: var(--panel);\n      border: 1px solid var(--line);\n      border-radius: var(--radius);\n      box-shadow: var(--shadow);\n      overflow: hidden;\n      cursor: pointer;\n      transition: transform var(--transition), border-color var(--transition);\n    }\n\n    .cover-card:hover,\n    .cover-card:focus-visible {\n      transform: translateY(-3px);\n      border-color: var(--line-strong);\n    }\n\n    .cover-card.highlight {\n      border-color: rgba(255, 255, 255, 0.75);\n      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35), 0 0 34px rgba(255, 255, 255, 0.25), var(--shadow);\n    }\n\n    /* ABRAXAS deck purple as the placeholder art; a real cover from\n       Spotify's oEmbed covers it entirely once it arrives. */\n    .cover-art {\n      position: relative;\n      display: block;\n      aspect-ratio: 1 / 1;\n      min-height: 3rem;\n      background:\n        radial-gradient(120% 120% at 85% 15%, rgba(180, 120, 255, 0.42), transparent 55%),\n        linear-gradient(145deg, rgba(180, 120, 255, 0.16), rgba(10, 10, 10, 0.92) 60%),\n        var(--surface);\n    }\n\n    .cover-img {\n      position: absolute;\n      inset: 0;\n      width: 100%;\n      height: 100%;\n      object-fit: cover;\n    }\n\n    .cover-num {\n      position: absolute;\n      left: 0.75rem;\n      bottom: 0.4rem;\n      z-index: 1;\n      font-size: 2.1rem;\n      font-weight: 700;\n      letter-spacing: 0.08em;\n      color: rgba(245, 245, 243, 0.92);\n      text-shadow: 0 0 14px rgba(0, 0, 0, 0.85);\n    }\n\n    .cover-play {\n      position: absolute;\n      right: 0.65rem;\n      bottom: 0.65rem;\n      z-index: 1;\n      display: grid;\n      place-items: center;\n      width: 2.2rem;\n      height: 2.2rem;\n      border-radius: 50%;\n      border: 1px solid var(--line-strong);\n      background: rgba(10, 10, 10, 0.72);\n      color: var(--accent);\n      font-size: 0.72rem;\n      transition: background var(--transition), color var(--transition);\n    }\n\n    .cover-card:hover .cover-play,\n    .cover-card:focus-visible .cover-play {\n      background: var(--accent);\n      color: #0a0a0a;\n    }\n\n\n    .cover-meta {\n      display: grid;\n      gap: 0.2rem;\n      padding: 0.7rem 0.85rem 0.85rem;\n    }\n\n    /* No title until Spotify's oEmbed supplies the real one. */\n    .cover-meta:has(> .cover-title:empty) { display: none; }\n\n    .cover-title {\n      font-size: 0.82rem;\n      font-weight: 700;\n      line-height: 1.35;\n    }\n\n    /* The artist strip above the grids — the same card, laid on its side. */\n    .cover-card--artist {\n      flex-direction: row;\n      align-items: stretch;\n      max-width: 760px;\n    }\n\n    .cover-card--artist .cover-art {\n      flex: 0 0 7rem;\n      aspect-ratio: auto;\n      min-height: 7rem;\n    }\n\n    .cover-card--artist .cover-meta {\n      align-content: center;\n    }\n\n    /* A tapped card swaps to the live player and takes the full row. */\n    .cover-grid .now-playing {\n      grid-column: 1 / -1;\n    }\n\n    .insta-grid iframe {\n      background: #fff;\n    }\n\n    /* =====================================================================\n       Suit Purge (game.js)\n       ===================================================================== */\n\n    [hidden] {\n      display: none !important;\n    }\n\n    .game-stage {\n      position: relative;\n      width: min(var(--max), calc(100% - 2rem));\n      margin: 1.5rem auto 0;\n      aspect-ratio: 16 / 9;\n      border: 1px solid var(--line-strong);\n      border-radius: var(--radius);\n      overflow: hidden;\n      background: #0a0a0a;\n      box-shadow: var(--shadow);\n    }\n\n    .game-canvas {\n      display: block;\n      width: 100%;\n      height: 100%;\n      image-rendering: pixelated;\n      touch-action: manipulation;\n    }\n\n    .game-canvas.is-playing {\n      cursor: crosshair;\n      touch-action: none;\n    }\n\n    .game-hud {\n      position: absolute;\n      top: 0.6rem;\n      left: 0.6rem;\n      display: flex;\n      flex-wrap: wrap;\n      gap: 0.4rem;\n      pointer-events: none;\n    }\n\n    .hud-cell {\n      display: inline-flex;\n      align-items: baseline;\n      gap: 0.4rem;\n      padding: 0.3rem 0.6rem;\n      border-radius: 999px;\n      border: 1px solid var(--line);\n      background: rgba(14, 14, 14, 0.72);\n      font-size: 0.6rem;\n      text-transform: uppercase;\n      letter-spacing: 0.14rem;\n      color: var(--muted);\n    }\n\n    .hud-cell b {\n      font-size: 0.85rem;\n      font-weight: 700;\n      color: var(--accent);\n    }\n\n    .game-overlay {\n      position: absolute;\n      inset: 0;\n      display: grid;\n      align-content: center;\n      justify-items: center;\n      gap: 0.85rem;\n      padding: 1.25rem;\n      text-align: center;\n      background: radial-gradient(circle at center, rgba(24, 24, 24, 0.84), rgba(6, 6, 6, 0.96));\n    }\n\n    .game-kicker {\n      color: var(--accent);\n      font-size: 0.64rem;\n      text-transform: uppercase;\n      letter-spacing: 0.3rem;\n    }\n\n    .game-overlay h2 {\n      font-family: \"New Rocker\", system-ui;\n      font-size: clamp(2rem, 7vw, 4rem);\n      line-height: 1;\n      text-transform: uppercase;\n    }\n\n    .game-lead {\n      max-width: 46ch;\n      color: var(--muted);\n      font-size: 0.9rem;\n    }\n\n    .game-keys {\n      max-width: 54ch;\n      color: var(--muted);\n      font-size: 0.68rem;\n    }\n\n    .game-keys b {\n      color: var(--accent);\n      font-weight: 500;\n    }\n\n    /* Game-over score block — built by game.js, shown only on FLATLINED. */\n    .game-score {\n      display: grid;\n      justify-items: center;\n      gap: 0.55rem;\n      margin-top: 0.2rem;\n    }\n\n    .game-best {\n      color: var(--accent);\n      font-size: 0.7rem;\n      text-transform: uppercase;\n      letter-spacing: 0.22rem;\n    }\n\n\n    .game-touch {\n      position: absolute;\n      inset: 0;\n      pointer-events: none;\n    }\n\n    .game-fire {\n      position: absolute;\n      right: 1rem;\n      bottom: 1rem;\n      width: 78px;\n      height: 78px;\n      border-radius: 50%;\n      border: 1px solid rgba(255, 255, 255, 0.6);\n      background: rgba(255, 255, 255, 0.2);\n      color: var(--text);\n      font-family: inherit;\n      font-size: 0.66rem;\n      letter-spacing: 0.16rem;\n      pointer-events: auto;\n      cursor: pointer;\n    }\n\n    .game-bar {\n      position: absolute;\n      top: 0.6rem;\n      right: 0.6rem;\n      display: flex;\n      gap: 0.4rem;\n    }\n\n    .game-chip {\n      padding: 0.35rem 0.7rem;\n      border-radius: 999px;\n      border: 1px solid var(--line-strong);\n      background: rgba(14, 14, 14, 0.82);\n      color: var(--text);\n      font-family: inherit;\n      font-size: 0.6rem;\n      text-transform: uppercase;\n      letter-spacing: 0.14rem;\n      cursor: pointer;\n    }\n\n    @media (pointer: fine) {\n      .game-fire {\n        display: none;\n      }\n    }\n\n    /*\n      Both .pv-body overlays are fixed, full-viewport and masked/blended, so the\n      compositor re-blends them on every canvas repaint - measured at a 23fps\n      cost while the game runs. Drop them for the duration.\n    */\n    .pv-body.game-active::before,\n    .pv-body.game-active::after {\n      display: none;\n    }\n\n    @media (max-width: 820px) {\n      .game-stage {\n        width: 100%;\n        aspect-ratio: auto;\n        height: 68vh;\n        height: 68dvh;\n        border-radius: 0;\n        border-left: 0;\n        border-right: 0;\n      }\n\n      /* Top-right collides with the HUD on a phone. */\n      .game-bar {\n        top: auto;\n        right: auto;\n        bottom: 0.6rem;\n        left: 0.6rem;\n      }\n    }\n\n    /* ---- Support / crypto donations block ------------------------------- */\n    .support-block {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 1.5rem 2rem;\n      flex-wrap: wrap;\n      margin-top: 2.5rem;\n      padding: 1.5rem;\n      border: 1px solid rgba(255, 255, 255, 0.18);\n      background: rgba(0, 0, 0, 0.75);\n    }\n    .support-copy { flex: 1 1 280px; max-width: 46ch; }\n    .support-title {\n      font-size: clamp(1.3rem, 2.5vw, 1.9rem);\n      margin: 0.25rem 0 0.6rem;\n    }\n    .support-qr {\n      flex: 0 0 auto;\n      display: block;\n      padding: 0.5rem;\n      background: #fff;\n      line-height: 0;\n      border: 2px solid var(--accent);\n      transition: transform 0.2s ease;\n    }\n    .support-qr:hover,\n    .support-qr:focus-visible { transform: scale(1.03); }\n    .support-qr img { width: 160px; height: 160px; display: block; }\n    @media (max-width: 640px) {\n      .support-block { justify-content: center; text-align: center; }\n      .support-copy { max-width: none; }\n    }\n    /* ---- Legal footer block --------------------------------------------- */\n    .legal-footer {\n      margin-top: 2.5rem;\n      padding-top: 1.5rem;\n      border-top: 1px solid rgba(255, 255, 255, 0.25);\n      font-family: \"IBM Plex Mono\", monospace;\n    }\n    .legal-footer-links {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 0.4rem 1.25rem;\n      margin-bottom: 1rem;\n      font-size: 0.78rem;\n      letter-spacing: 0.08em;\n      text-transform: uppercase;\n    }\n    .legal-footer-links a {\n      color: var(--accent);\n      text-decoration: underline;\n      text-underline-offset: 3px;\n    }\n    .legal-footer-links a:hover,\n    .legal-footer-links a:focus-visible {\n      color: #ffffff;\n    }\n    .legal-footer-copy {\n      font-size: 0.78rem;\n      line-height: 1.65;\n      color: var(--muted);\n      margin: 0 0 0.7rem;\n    }\n    .legal-footer-copy:last-child { margin-bottom: 0; }\n","pages":{"index.html":{"label":"Landing (HTG)","css":"\n    /* HTG-only chrome: the masthead wordmark and the artist doors.\n       Everything else on this page comes from style.css. */\n    :host { --abx: #b478ff; --str: #16c85a; --jus: #ff9b3d; --cig: #2fd4e0; }\n\n    a.brand-title { color: inherit; text-decoration: none; }\n\n    /* No hero aside on HTG — collapse style.css's two-column hero to one. */\n    .hero-content { grid-template-columns: 1fr; }\n    .mast { text-align: center; max-width: 52rem; margin: 0 auto; }\n    .mast .curse {\n      font-size: clamp(0.62rem, 1.6vw, 0.8rem);\n      letter-spacing: 0.42em;\n      text-transform: uppercase;\n      color: var(--muted);\n      margin-bottom: 1.4rem;\n    }\n    .mast .wordmark {\n      font-family: \"New Rocker\", \"IBM Plex Mono\", serif;\n      font-weight: 400;\n      line-height: 0.9;\n      font-size: clamp(3.4rem, 15vw, 9rem);\n      letter-spacing: 0.02em;\n    }\n    /* Drawn logos — alpha-keyed webp cut from the supplied artwork\n       (assets/logos/). The name stays in the DOM as alt / visually-hidden\n       text for screen readers and search. */\n    .wordmark-logo {\n      display: block;\n      width: min(100%, 44rem);\n      height: auto;\n      margin: -1.2rem auto -1.6rem;\n      filter: drop-shadow(0 0 28px rgba(255, 255, 255, 0.18));\n    }\n    .door-logo {\n      display: block;\n      position: relative;\n      z-index: 1;\n      width: min(92%, 24rem);\n      height: auto;\n      margin: 0 auto 0.4rem;\n      transition: transform 0.4s ease, filter 0.4s ease;\n    }\n    .door:hover .door-logo, .door:focus-visible .door-logo { transform: scale(1.04); }\n    .door-name--logo { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }\n    .mast .expand {\n      margin-top: 0.85rem;\n      font-size: clamp(0.72rem, 2.2vw, 1rem);\n      letter-spacing: 0.5em;\n      text-transform: uppercase;\n      padding-left: 0.5em; /* optical: absorb the trailing letter-spacing */\n    }\n\n    /* ---- The artist doors ------------------------------------------------ */\n    .doors {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 1px;\n      background: var(--line);\n      border: 1px solid var(--line);\n      border-radius: var(--radius);\n      overflow: hidden;\n    }\n    .door {\n      position: relative;\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      justify-content: center;\n      /* Basis >1/3 forces exactly two per row; the row height lives here rather\n         than on .doors so both rows stay full-height once the list wraps. */\n      flex: 1 1 40%;\n      min-height: clamp(15rem, 28vh, 21rem);\n      padding: 2rem 1.25rem;\n      overflow: hidden;\n      text-align: center;\n      text-decoration: none;\n      color: var(--text);\n      background: rgba(10, 10, 10, 0.62);\n      transition: flex-grow 0.5s ease, background 0.4s ease, filter 0.4s ease;\n    }\n    /* ABRAXAS is the lit, dominant door; the rest sit recessed and dimmer. */\n    .door--abx { flex-grow: 1.35; --door-c: rgba(180, 120, 255, 0.5); }\n    .door--str, .door--jus, .door--cig { filter: brightness(0.72) saturate(0.6); }\n    .door--str { --door-c: rgba(22, 200, 90, 0.45); }\n    .door--jus { --door-c: rgba(255, 155, 61, 0.45); }\n    .door--cig { --door-c: rgba(47, 212, 224, 0.45); }\n    .door:hover, .door:focus-visible { flex-grow: 2; filter: none; background: rgba(10, 10, 10, 0.25); }\n\n    /* The wall of work behind each name: a collage of that artist's real\n       cover art (resolved at runtime from Spotify's oEmbed — see the loader\n       script by the doors) or video stills. Sits dim and desaturated under\n       the typography, snaps to full colour with the deck glow on hover.\n       If the art never resolves the imgs stay src-less and invisible, and\n       the door is exactly the typography-only door it was before. */\n    .door-art {\n      position: absolute; inset: 0; z-index: 0;\n      display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr;\n      pointer-events: none;\n    }\n    .door-art img {\n      width: 100%; height: 100%; object-fit: cover;\n      opacity: 0;\n      filter: grayscale(1) brightness(0.34) contrast(1.05);\n      transition: opacity 0.6s ease, filter 0.45s ease;\n    }\n    .door-art img.ok { opacity: 0.85; }\n    /* Three tiles: let the odd one out take the whole bottom row. */\n    .door-art img.ok:last-child:nth-child(odd) { grid-column: 1 / -1; }\n    .door-art::after {\n      content: \"\"; position: absolute; inset: 0;\n      background: radial-gradient(120% 100% at 50% 100%, var(--door-c, transparent), transparent 72%);\n      opacity: 0; transition: opacity 0.45s ease;\n    }\n    .door:hover .door-art img, .door:focus-visible .door-art img {\n      filter: grayscale(0) brightness(0.6) saturate(1.15);\n    }\n    .door:hover .door-art::after, .door:focus-visible .door-art::after { opacity: 0.5; }\n    .door-name, .door-role { position: relative; z-index: 1; }\n    .door--abx:hover, .door--abx:focus-visible { box-shadow: inset 0 0 140px rgba(180, 120, 255, 0.28); }\n    .door--str:hover, .door--str:focus-visible { box-shadow: inset 0 0 140px rgba(22, 200, 90, 0.24); }\n    .door--jus:hover, .door--jus:focus-visible { box-shadow: inset 0 0 140px rgba(255, 155, 61, 0.24); }\n    .door--cig:hover, .door--cig:focus-visible { box-shadow: inset 0 0 140px rgba(47, 212, 224, 0.24); }\n\n    .door-name {\n      font-family: \"New Rocker\", serif;\n      font-size: clamp(2rem, 6vw, 4rem);\n      line-height: 1;\n      max-width: 100%;\n      overflow-wrap: anywhere;\n      transition: color 0.4s ease, text-shadow 0.4s ease;\n    }\n    .door--abx:hover .door-name, .door--abx:focus-visible .door-name {\n      color: var(--abx); text-shadow: 0 0 30px rgba(180, 120, 255, 0.55);\n    }\n    .door--str:hover .door-name, .door--str:focus-visible .door-name {\n      color: var(--str); text-shadow: 0 0 30px rgba(22, 200, 90, 0.5);\n    }\n    .door--jus:hover .door-name, .door--jus:focus-visible .door-name {\n      color: var(--jus); text-shadow: 0 0 30px rgba(255, 155, 61, 0.5);\n    }\n    .door--cig:hover .door-name, .door--cig:focus-visible .door-name {\n      color: var(--cig); text-shadow: 0 0 30px rgba(47, 212, 224, 0.5);\n    }\n    .door-role {\n      margin-top: 0.7rem;\n      font-size: 0.72rem;\n      letter-spacing: 0.32em;\n      text-transform: uppercase;\n      color: var(--muted);\n    }\n\n    @media (max-width: 760px) {\n      .doors { flex-direction: column; flex-wrap: nowrap; }\n      /* Stacked, four deep — drop the row height so the list stays scannable. */\n      .door { flex: 1 1 auto; min-height: 0; }\n      .door--str, .door--jus, .door--cig { filter: brightness(0.8) saturate(0.7); }\n    }\n    @media (prefers-reduced-motion: reduce) {\n      .door, .door-name, .door-art img, .door-art::after { transition: none; }\n    }\n  ","html":"\n  \n  <a class=\"skip-link\" href=\"#home\"><span class=\"tslot\" data-slot=\"index.html:5\">Skip to content<\/span><\/a>\n\n  <div class=\"site-shell\">\n    <header class=\"topbar\" id=\"topbar\">\n      <div class=\"topbar-inner\">\n        <div class=\"brand\">\n          <div class=\"brand-mark\">\n            <a class=\"brand-title\" href=\"#home\"><span class=\"tslot\" data-slot=\"index.html:6\">HTG<\/span><\/a>\n          <\/div>\n          <p class=\"brand-subtitle\"><span class=\"tslot\" data-slot=\"index.html:7\">Hex The Government<\/span><\/p>\n        <\/div>\n\n        <div class=\"nav-wrap\">\n          <button class=\"menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"site-nav\" id=\"menuToggle\">\n            <span aria-hidden=\"true\">☰<\/span>\n            <span><span class=\"tslot\" data-slot=\"index.html:9\">Menu<\/span><\/span>\n          <\/button>\n\n          <nav class=\"nav\" id=\"site-nav\" aria-label=\"Primary navigation\">\n            <ul class=\"nav-list\">\n              <li><a href=\"#roster\"><span class=\"tslot\" data-slot=\"index.html:10\">Roster<\/span><\/a><\/li>\n              <li><a href=\"#out-now\"><span class=\"tslot\" data-slot=\"index.html:11\">Music<\/span><\/a><\/li>\n              <li><a href=\"sequence.html\"><span class=\"tslot\" data-slot=\"index.html:12\">The Sequence<\/span><\/a><\/li>\n              <li><a data-shop-link href=\"https://  or country.<\/span><\/p>\n    <p><span class=\"tslot\" data-slot=\"legal.html:124\">Song titles, lyrics, cover art, and page copy may contain political, satirical, or provocative expression. Such content is presented as artistic expression and social commentary, and should not be read as a statement of fact about any identifiable person or entity, nor as incitement to harm any person. Any references to real-world topics are made under principles of fair comment and satire.<\/span><\/p>\n    <p><em><span class=\"tslot\" data-slot=\"legal.html:125\">Suit Purge<\/span><\/em> <span class=\"tslot\" data-slot=\"legal.html:126\">is provided free of charge as part of this site. It contains cartoon-style violence against fictional enemies. The game runs entirely in your browser: no downloads, no third-party assets, and no personal data is transmitted by playing it.<\/span><\/p>\n\n    <h2 id=\"thirdparty\"><span class=\"tslot\" data-slot=\"legal.html:127\">6. Third-party links, embeds &amp; services<\/span><\/h2>\n    <p><span class=\"tslot\" data-slot=\"legal.html:128\">This site links to and embeds media from third-party platforms including, without limitation: Spotify, SoundCloud, YouTube, Apple Music, TikTok, Instagram, Shopify, GitHub Pages, Linktree, and Google Fonts. HTG does not control and is not responsible for the content, privacy practices, or availability of those services. The names, logos, and marks of those services are the property of their respective owners.<\/span><\/p>\n    <p><span class=\"tslot\" data-slot=\"legal.html:129\">Where you interact with an embedded player or an outbound link, the operator of that service may collect data about you under its own privacy policy. Please read those policies before use.<\/span><\/p>\n\n    <h2 id=\"privacy\"><span class=\"tslot\" data-slot=\"legal.html:130\">7. Privacy Policy<\/span><\/h2>\n    <p><span class=\"tslot\" data-slot=\"legal.html:131\">HTG respects your privacy and aims to collect as little personal data as possible.<\/span><\/p>\n    <h3><span class=\"tslot\" data-slot=\"legal.html:132\">What we collect directly<\/span><\/h3>\n    <ul>\n      <li><strong><span class=\"tslot\" data-slot=\"legal.html:133\">Contact form:<\/span><\/strong> <span class=\"tslot\" data-slot=\"legal.html:134\">the contact form on this site delivers your message to HTG's inbox, addressed to<\/span> <a href=\"mailto:Abraxas@htg.productions\"><span class=\"tslot\" data-slot=\"legal.html:135\">Abraxas@htg.productions<\/span><\/a><span class=\"tslot\" data-slot=\"legal.html:136\">. Where a form-delivery service is configured, your submission is transmitted through that provider to reach us; otherwise the form opens your own email client with a pre-filled message to the same address. Either way we receive the information you include (your email address, name, and message) and use it only to reply to your enquiry.<\/span><\/li>\n      <li><strong><span class=\"tslot\" data-slot=\"legal.html:137\">Server logs:<\/span><\/strong> <span class=\"tslot\" data-slot=\"legal.html:138\">this site is served as static files by GitHub Pages. GitHub may record standard request logs (IP address, user-agent, requested URL, timestamp) for security and abuse prevention under GitHub's own privacy policy.<\/span><\/li>\n    <\/ul>\n    <h3><span class=\"tslot\" data-slot=\"legal.html:139\">What we do NOT collect<\/span><\/h3>\n    <ul>\n      <li><span class=\"tslot\" data-slot=\"legal.html:140\">We do not run our own analytics, advertising, or tracking scripts on this site.<\/span><\/li>\n      <li><span class=\"tslot\" data-slot=\"legal.html:141\">We do not sell, rent, or share any personal data with third parties for marketing.<\/span><\/li>\n      <li><span class=\"tslot\" data-slot=\"legal.html:142\">We do not use behavioural tracking cookies.<\/span><\/li>\n    <\/ul>\n    <h3><span class=\"tslot\" data-slot=\"legal.html:143\">Third-party embeds<\/span><\/h3>\n    <p><span class=\"tslot\" data-slot=\"lega <script>
(function () {
  "use strict";

  var BATCH = 8;
  var groups = DATA.slots.groups;
  var previews = DATA.preview;

  /* Edits live as { "index.html": { "32": "new text" } } — keyed by the same
     ordinal the extractor writes back with. */
  var edits = {};
  var db = null;
  var remote = {};
  var pendingWrite = {};
  var writeTimer = {};

  var state = { group: groups[1] ? groups[1].id : groups[0].id, batch: 0, slot: null, query: "" };

  var el = {
    pages: document.getElementById("pages"),
    queue: document.getElementById("queue"),
    editor: document.getElementById("editor"),
    preview: document.getElementById("preview"),
    batchLabel: document.getElementById("batchLabel"),
    prevBatch: document.getElementById("prevBatch"),
    nextBatch: document.getElementById("nextBatch"),
    finder: document.getElementById("finder"),
    tally: document.getElementById("tally"),
    sync: document.getElementById("sync"),
    pvNote: document.getElementById("pvNote"),
    sheet: document.getElementById("sheet"),
    sheetText: document.getElementById("sheetText"),
    sheetNote: document.getElementById("sheetNote")
  };

  function group(id) {
    for (var i = 0; i < groups.length; i++) if (groups[i].id === id) return groups[i];
    return groups[0];
  }
  function editOf(slot) {
    var g = edits[slot.file];
    var key = slot.kind === "config" ? String(slot.line) : String(slot.ordinal);
    return g && Object.prototype.hasOwnProperty.call(g, key) ? g[key] : null;
  }
  function keyOf(slot) { return slot.kind === "config" ? String(slot.line) : String(slot.ordinal); }
  function currentText(slot) {
    var e = editOf(slot);
    return e === null ? slot.original : e;
  }
  function isEdited(slot) {
    var e = editOf(slot);
    return e !== null && e !== slot.original;
  }
  function editedCount(g) {
    var n = 0;
    for (var i = 0; i < g.slots.length; i++) if (isEdited(g.slots[i])) n++;
    return n;
  }

  /* Visible slots: the search box narrows the whole page, not just the batch,
     so a line can be found without knowing which batch holds it. */
  function visible() {
    var g = group(state.group);
    if (!state.query) return g.slots;
    var q = state.query.toLowerCase();
    return g.slots.filter(function (s) {
      return s.original.toLowerCase().indexOf(q) > -1 || currentText(s).toLowerCase().indexOf(q) > -1;
    });
  }
  function batchSlots() {
    var v = visible();
    return v.slice(state.batch * BATCH, state.batch * BATCH + BATCH);
  }

  /* ---- render: page tabs ------------------------------------------------ */
  function renderTabs() {
    el.pages.textContent = "";
    groups.forEach(function (g) {
      var b = document.createElement("button");
      b.className = "page-tab";
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", g.id === state.group ? "true" : "false");
      var name = document.createElement("b");
      name.textContent = g.short || g.label;
      b.title = g.label;
      b.appendChild(name);
      var n = editedCount(g);
      if (n) {
        var i = document.createElement("i");
        i.textContent = n;
        b.appendChild(i);
      }
      b.addEventListener("click", function () {
        if (state.group === g.id) return;
        state.group = g.id;
        state.batch = 0;
        state.slot = null;
        renderAll();
        mountPreview();
      });
      el.pages.appendChild(b);
    });
  }

  /* ---- render: queue ---------------------------------------------------- */
  function renderQueue() {
    var v = visible();
    var total = Math.max(1, Math.ceil(v.length / BATCH));
    if (state.batch >= total) state.batch = total - 1;
    el.batchLabel.innerHTML = "";
    el.batchLabel.appendChild(document.createTextNode("Batch "));
    var b1 = document.createElement("b");
    b1.textContent = (state.batch + 1) + " / " + total;
    el.batchLabel.appendChild(b1);
    el.batchLabel.appendChild(document.createTextNode(" · " + v.length + " lines"));
    el.prevBatch.disabled = state.batch === 0;
    el.nextBatch.disabled = state.batch >= total - 1;

    el.queue.textContent = "";
    batchSlots().forEach(function (slot, i) {
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.className = "slot-btn";
      b.type = "button";
      b.dataset.edited = isEdited(slot) ? "1" : "0";
      b.setAttribute("aria-current", slot.id === state.slot ? "true" : "false");

      var n = document.createElement("span");
      n.className = "slot-n";
      n.textContent = isEdited(slot) ? "✔" : String(state.batch * BATCH + i + 1);
      b.appendChild(n);

      var wrap = document.createElement("span");
      var t = document.createElement("span");
      t.className = "slot-text";
      t.textContent = currentText(slot);
      wrap.appendChild(t);
      var w = document.createElement("span");
      w.className = "slot-where";
      w.textContent = label(slot);
      wrap.appendChild(w);
      b.appendChild(wrap);

      b.addEventListener("click", function () { select(slot.id); });
      li.appendChild(b);
      el.queue.appendChild(li);
    });
  }

  var WORDS = {
    p: "paragraph", h1: "headline", h2: "heading", h3: "sub-heading", h4: "sub-heading",
    li: "list item", a: "link", button: "button", span: "label", strong: "bold run",
    b: "bold run", em: "italic run", label: "field label", td: "table cell",
    th: "table heading", title: "browser tab", kbd: "key", summary: "summary"
  };
  function label(slot) {
    if (slot.kind === "config") return "config · " + slot.where;
    if (slot.kind === "attr") return slot.where + " · search / alt text";
    return WORDS[slot.blockTag] || slot.blockTag || "text";
  }

  /* ---- render: editor --------------------------------------------------- */
  function renderEditor() {
    var slot = findSlot(state.slot);
    if (!slot) { el.editor.hidden = true; return; }
    el.editor.hidden = false;
    el.editor.textContent = "";

    var head = document.createElement("div");
    head.className = "editor-head";
    var tag = document.createElement("span");
    tag.className = "tag" + (isEdited(slot) ? " tag--edited" : "");
    tag.textContent = isEdited(slot) ? "edited" : slot.kind === "config" ? "config" : "live";
    head.appendChild(tag);
    if (slot.kind === "attr") {
      var ht = document.createElement("span");
      ht.className = "tag tag--hidden";
      ht.textContent = "search / alt text";
      head.appendChild(ht);
    }
    var where = document.createElement("span");
    where.className = "where";
    where.textContent = label(slot);
    head.appendChild(where);
    el.editor.appendChild(head);

    if (isEdited(slot)) {
      var was = document.createElement("p");
      was.className = "was";
      was.appendChild(document.createTextNode("was: "));
      var em = document.createElement("em");
      em.textContent = slot.original;
      was.appendChild(em);
      el.editor.appendChild(was);
    }

    var ta = document.createElement("textarea");
    ta.className = "draft";
    ta.value = currentText(slot);
    ta.spellcheck = true;
    ta.setAttribute("aria-label", "Copy for this line");
    el.editor.appendChild(ta);

    var foot = document.createElement("div");
    foot.className = "editor-foot";

    var reset = document.createElement("button");
    reset.className = "btn";
    reset.type = "button";
    reset.textContent = "Revert";
    reset.disabled = !isEdited(slot);
    reset.addEventListener("click", function () {
      setEdit(slot, slot.original);
      queueSave(slot.file);   /* push the revert to the shared store too, or a peer's snapshot restores it */
      renderAll();
      paintPreview();
    });
    foot.appendChild(reset);

    var next = document.createElement("button");
    next.className = "btn";
    next.type = "button";
    next.textContent = "Next line";
    next.addEventListener("click", function () { step(1); });
    foot.appendChild(next);

    var hint = document.createElement("span");
    hint.className = "hint";
    hint.innerHTML = "<kbd>Ctrl</kbd>+<kbd>Enter</kbd> next";
    foot.appendChild(hint);

    var count = document.createElement("span");
    count.className = "count";
    foot.appendChild(count);
    el.editor.appendChild(foot);

    function tick() {
      var len = ta.value.length;
      count.textContent = len + " / was " + slot.original.length;
      count.className = "count" + (len > slot.original.length * 1.6 + 20 ? " over" : "");
    }
    tick();

    ta.addEventListener("input", function () {
      setEdit(slot, ta.value);
      tick();
      paintPreview();
      queueSave(slot.file);
      var btn = el.queue.querySelector('[aria-current="true"] .slot-text');
      if (btn) btn.textContent = ta.value;
    });
    ta.addEventListener("keydown", function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); step(1); }
    });
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
  }

  function findSlot(id) {
    if (!id) return null;
    var g = group(state.group);
    for (var i = 0; i < g.slots.length; i++) if (g.slots[i].id === id) return g.slots[i];
    return null;
  }

  function setEdit(slot, text) {
    if (!edits[slot.file]) edits[slot.file] = {};
    if (text === slot.original) delete edits[slot.file][keyOf(slot)];
    else edits[slot.file][keyOf(slot)] = text;
    renderTabs();
    renderTally();
    saveLocal();
  }

  function select(id) {
    state.slot = id;
    var v = visible();
    for (var i = 0; i < v.length; i++) {
      if (v[i].id === id) { state.batch = Math.floor(i / BATCH); break; }
    }
    renderQueue();
    renderEditor();
    paintPreview(true);
  }

  function step(dir) {
    var v = visible();
    var at = -1;
    for (var i = 0; i < v.length; i++) if (v[i].id === state.slot) { at = i; break; }
    var nxt = v[at + dir];
    if (nxt) select(nxt.id);
  }

  function renderTally() {
    var done = 0, all = 0;
    groups.forEach(function (g) { done += editedCount(g); all += g.slots.length; });
    el.tally.textContent = "";
    var b = document.createElement("b");
    b.textContent = done;
    el.tally.appendChild(b);
    el.tally.appendChild(document.createTextNode(" of " + all + " changed"));
  }

  function renderAll() {
    renderTabs();
    renderQueue();
    renderEditor();
    renderTally();
  }

  /* ---- preview ---------------------------------------------------------- */
  var shadow = null;
  var mounted = null;

  function mountPreview() {
    var page = previews.pages[state.group];
    el.pvNote.textContent = page ? "live page" : "shared strings — no page of its own";
    if (!page) { el.preview.textContent = ""; shadow = null; mounted = null; return; }
    if (mounted === state.group) { paintPreview(true); return; }

    el.preview.textContent = "";
    var host = document.createElement("div");
    el.preview.appendChild(host);
    shadow = host.attachShadow({ mode: "open" });
    shadow.innerHTML =
      "<style>" + previews.css + "</style>" +
      "<style>" + page.css + "</style>" +
      "<style>" + OVERRIDES + "</style>" +
      '<div class="pv-html js"><div class="pv-body">' + page.html + "</div></div>";
    mounted = state.group;

    shadow.addEventListener("click", function (e) {
      var hit = e.target.closest ? e.target.closest(".tslot") : null;
      if (!hit) return;
      e.preventDefault();
      select(hit.dataset.slot);
    });
    /* Nothing in the preview navigates — it is a proof sheet, not the site. */
    shadow.addEventListener("submit", function (e) { e.preventDefault(); });
    paintPreview(true);
  }

  function paintPreview(scroll) {
    if (!shadow) return;
    var g = group(state.group);
    g.slots.forEach(function (slot) {
      if (slot.kind !== "text") return;
      var node = shadow.querySelector('[data-slot="' + cssEscape(slot.id) + '"]');
      if (!node) return;
      var text = currentText(slot);
      if (node.dataset.painted !== text) {
        node.textContent = text;
        node.dataset.painted = text;
      }
      node.classList.toggle("is-edited", isEdited(slot));
      var active = slot.id === state.slot;
      node.classList.toggle("is-active", active);
      if (active && scroll) scrollPaneTo(node);
    });
  }

  function cssEscape(v) { return v.replace(/["\\]/g, "\\$&"); }

  /* scrollIntoView would walk every scrollable ancestor, taking the desk with
     it. The preview pane is the only thing that should move. */
  function scrollPaneTo(node) {
    var box = node.getBoundingClientRect();
    var pane = el.preview.getBoundingClientRect();
    if (!box.height && !box.width) return;
    var delta = (box.top + box.height / 2) - (pane.top + pane.height / 2);
    el.preview.scrollTo({ top: el.preview.scrollTop + delta, behavior: "smooth" });
  }

  var OVERRIDES = [
    ".tslot { display: contents; }",
    ".tslot.is-edited { color: #7ef0a6; }",
    ".tslot.is-active { display: inline; background: rgba(180,120,255,0.22); box-shadow: 0 0 0 2px #b478ff; border-radius: 2px; }",
    /* The page's fixed chrome and its scroll-triggered reveals both assume a
       real viewport; inside the preview pane they would float over the desk
       or never fire at all. */
    ".pv-body .topbar { position: static; }",
    ".pv-body .sticky-cta, .pv-body .to-top, .pv-body .skip-link, .pv-body .cursor, .pv-body .cursor-dot { display: none; }",
    ".pv-body .fade-in { opacity: 1; transform: none; }",
    ".pv-body .hero { min-height: auto; padding-top: 3rem; padding-bottom: 3rem; }",
    ".pv-body section[hidden] { display: block; }",
    ".pv-body main { padding-top: 0; }",
    ":host { --nav-height: 0px; }",
    ".pv-body a { cursor: default; }"
  ].join("\n");

  /* ---- persistence ------------------------------------------------------ */
  var LOCAL = "htg-copy-desk";

  function saveLocal() {
    try { localStorage.setItem(LOCAL, JSON.stringify(edits)); } catch (e) { /* private window */ }
  }
  function loadLocal() {
    try {
      var raw = localStorage.getItem(LOCAL);
      if (raw) edits = JSON.parse(raw) || {};
    } catch (e) { edits = {}; }
  }

  var seeded = {};

  function mergeRemote(file, slots) {
    remote[file] = slots || {};
    var local = edits[file] || {};
    var merged = {};
    var k;
    for (k in remote[file]) if (Object.prototype.hasOwnProperty.call(remote[file], k)) merged[k] = remote[file][k];
    /* A line being typed right now stays the typist's — everything else takes
       the shared value, so both desks converge without one erasing the other. */
    var activeKey = null, activeFile = null;
    var s = findSlot(state.slot);
    if (s) { activeKey = keyOf(s); activeFile = s.file; }
    /* First snapshot after connecting: work done offline is real work, so it
       joins the shared copy rather than being overwritten by it. */
    var carry = !seeded[file] || pendingWrite[file];
    var extras = false;
    for (k in local) {
      if (!Object.prototype.hasOwnProperty.call(local, k)) continue;
      if (file === activeFile && k === activeKey) merged[k] = local[k];
      else if (carry && !Object.prototype.hasOwnProperty.call(merged, k)) { merged[k] = local[k]; extras = true; }
    }
    edits[file] = merged;
    saveLocal();
    if (!seeded[file]) {
      seeded[file] = true;
      if (extras) queueSave(file);
    }
  }

  function queueSave(file) {
    if (!db) return;
    pendingWrite[file] = true;
    el.sync.dataset.state = "saving";
    el.sync.textContent = "saving";
    clearTimeout(writeTimer[file]);
    writeTimer[file] = setTimeout(function () {
      var body = { slots: edits[file] || {}, at: new Date().toISOString() };
      db.doc("edits/" + file).set(body).then(function () {
        pendingWrite[file] = false;
        el.sync.dataset.state = "live";
        el.sync.textContent = "shared";
      }, function () {
        el.sync.dataset.state = "local";
        el.sync.textContent = "local only";
      });
    }, 500);
  }

  function connect() {
    if (!window.claude || !claude.use) return;
    claude.use("db").then(function (d) {
      if (!d) return;
      db = d;
      el.sync.dataset.state = "live";
      el.sync.textContent = "shared";
      groups.forEach(function (g) {
        db.doc("edits/" + g.id).onSnapshot(function (snap) {
          var data = snap.exists ? snap.data() : null;
          mergeRemote(g.id, data && data.slots ? data.slots : {});
          if (!snap.metadata.hasPendingWrites) {
            renderTabs();
            renderQueue();
            renderTally();
            paintPreview();
            var open = document.activeElement;
            if (!open || open.className !== "draft") renderEditor();
          }
        }, function () {
          el.sync.dataset.state = "local";
          el.sync.textContent = "local only";
        });
      });
    });
  }

  /* ---- export ----------------------------------------------------------- */
  function changedList() {
    var out = [];
    groups.forEach(function (g) {
      g.slots.forEach(function (s) {
        if (isEdited(s)) out.push({ id: s.id, file: s.file, was: s.original, text: currentText(s) });
      });
    });
    return out;
  }

  document.getElementById("export").addEventListener("click", function () {
    var list = changedList();
    el.sheetText.value = list.length
      ? JSON.stringify(list, null, 2)
      : "Nothing changed yet.";
    el.sheetNote.textContent = list.length + " line" + (list.length === 1 ? "" : "s");
    el.sheet.showModal();
    el.sheetText.select();
  });
  document.getElementById("sheetCopy").addEventListener("click", function () {
    el.sheetText.select();
    var done = false;
    try { done = document.execCommand("copy"); } catch (e) { done = false; }
    if (!done && navigator.clipboard) {
      navigator.clipboard.writeText(el.sheetText.value).then(function () {
        el.sheetNote.textContent = "copied";
      }, function () {
        el.sheetNote.textContent = "select the text and copy by hand";
      });
      return;
    }
    el.sheetNote.textContent = done ? "copied" : "select the text and copy by hand";
  });
  document.getElementById("sheetClose").addEventListener("click", function () { el.sheet.close(); });

  /* ---- wiring ----------------------------------------------------------- */
  el.prevBatch.addEventListener("click", function () {
    if (state.batch > 0) { state.batch--; renderQueue(); }
  });
  el.nextBatch.addEventListener("click", function () {
    state.batch++; renderQueue();
  });
  el.finder.addEventListener("input", function () {
    state.query = el.finder.value.trim();
    state.batch = 0;
    renderQueue();
  });

  loadLocal();
  renderAll();
  mountPreview();
  connect();

  var slots = group(state.group).slots;
  var first = null;
  for (var i = 0; i < slots.length && !first; i++) if (slots[i].kind === "text") first = slots[i];
  if (!first) first = slots[0];
  if (first) select(first.id);
})();
</script>

</body>
</html>
