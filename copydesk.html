<title>HTG Copy Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* The desk borrows the site's own palette so the copy is judged against the
   ground it will actually sit on. Committed dark, single theme — the site
   has no light mode and a light desk would lie about the contrast. */
:root {
  --ink:        #f2f2f0;
  --ink-soft:   #b9b9c0;
  --ink-faint:  #75757f;
  --ground:     #0b0b0c;
  --panel:      #131317;
  --panel-2:    #1a1a20;
  --line:       rgba(255, 255, 255, 0.10);
  --line-hot:   rgba(255, 255, 255, 0.22);
  --accent:     #b478ff;
  --accent-dim: rgba(180, 120, 255, 0.16);
  --done:       #16c85a;
  --done-dim:   rgba(22, 200, 90, 0.14);
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --display: "New Rocker", "IBM Plex Mono", serif;
  --rail-h: 3.75rem;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- top rail ---------------------------------------------------------- */
.rail {
  position: sticky;
  top: 0;
  z-index: 20;
  height: var(--rail-h);
  display: flex;
  align-items: center;
  gap: 1.25rem;
  padding: 0 1rem;
  background: rgba(11, 11, 12, 0.94);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.wordmark {
  font-family: var(--display);
  font-size: 1.5rem;
  line-height: 1;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.wordmark span { color: var(--accent); }

.pages { display: flex; gap: 1px; overflow-x: auto; flex: 1; min-width: 0; }
.pages::-webkit-scrollbar { height: 0; }
.page-tab {
  flex: 0 0 auto;
  background: none;
  border: 1px solid transparent;
  border-radius: 2px;
  padding: 0.35rem 0.7rem;
  color: var(--ink-faint);
  cursor: pointer;
  white-space: nowrap;
  letter-spacing: 0.04em;
}
.page-tab:hover { color: var(--ink); }
.page-tab[aria-selected="true"] {
  color: var(--ink);
  border-color: var(--line-hot);
  background: var(--panel-2);
}
.page-tab b { font-weight: 500; }
.page-tab i {
  font-style: normal;
  color: var(--done);
  margin-left: 0.45rem;
}

.rail-right { display: flex; align-items: center; gap: 0.75rem; white-space: nowrap; }
.tally { color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.tally b { color: var(--done); font-weight: 600; }

.btn {
  background: var(--panel-2);
  border: 1px solid var(--line-hot);
  border-radius: 2px;
  padding: 0.4rem 0.9rem;
  cursor: pointer;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-size: 0.72rem;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn--go { background: var(--accent); border-color: var(--accent); color: #17071f; font-weight: 600; }
.btn--go:hover { color: #17071f; filter: brightness(1.1); }
.btn:disabled { opacity: 0.35; cursor: default; border-color: var(--line); color: var(--ink-faint); }

.sync {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  color: var(--ink-faint);
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.sync::before {
  content: "";
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--ink-faint);
}
.sync[data-state="live"]::before { background: var(--done); box-shadow: 0 0 8px var(--done); }
.sync[data-state="saving"]::before { background: var(--accent); }
.sync[data-state="local"]::before { background: #e0a33c; }

/* ---- stage ------------------------------------------------------------- */
.stage {
  display: grid;
  grid-template-columns: minmax(24rem, 34rem) 1fr;
  height: calc(100vh - var(--rail-h));
}
.desk {
  border-right: 1px solid var(--line);
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  min-height: 0;
  background: var(--panel);
}

/* ---- batch strip ------------------------------------------------------- */
.batchbar {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.7rem 0.9rem;
  border-bottom: 1px solid var(--line);
}
.batchbar h2 {
  margin: 0;
  font-size: 0.72rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-weight: 500;
  flex: 1;
}
.batchbar h2 b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.step {
  background: none;
  border: 1px solid var(--line-hot);
  border-radius: 2px;
  width: 1.9rem; height: 1.7rem;
  cursor: pointer;
  line-height: 1;
}
.step:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.step:disabled { opacity: 0.3; cursor: default; }

.finder {
  width: 100%;
  background: var(--ground);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 0.45rem 0.6rem;
  color: var(--ink);
}
.finder::placeholder { color: var(--ink-faint); }
.finder-wrap { padding: 0.7rem 0.9rem; border-bottom: 1px solid var(--line); }

/* ---- queue ------------------------------------------------------------- */
.queue-scroll { overflow-y: auto; min-height: 0; }
.queue { list-style: none; margin: 0; padding: 0; }
.queue li { border-bottom: 1px solid var(--line); }
.slot-btn {
  display: grid;
  grid-template-columns: 1.6rem 1fr;
  gap: 0.6rem;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  border-left: 2px solid transparent;
  padding: 0.6rem 0.9rem;
  cursor: pointer;
  color: var(--ink-soft);
}
.slot-btn:hover { background: var(--panel-2); }
.slot-btn[aria-current="true"] {
  background: var(--accent-dim);
  border-left-color: var(--accent);
  color: var(--ink);
}
.slot-n {
  color: var(--ink-faint);
  font-size: 0.7rem;
  font-variant-numeric: tabular-nums;
  padding-top: 0.15rem;
}
.slot-btn[data-edited="1"] .slot-n { color: var(--done); }
.slot-text {
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  line-height: 1.45;
}
.slot-where {
  display: block;
  font-size: 0.66rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-top: 0.2rem;
}

/* ---- editor ------------------------------------------------------------ */
.editor {
  border-top: 1px solid var(--line-hot);
  background: var(--panel-2);
  padding: 0.9rem;
  display: grid;
  gap: 0.7rem;
  align-content: start;
}
.editor-head { display: flex; align-items: baseline; gap: 0.6rem; }
.tag {
  font-size: 0.64rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  border: 1px solid var(--line-hot);
  border-radius: 2px;
  padding: 0.1rem 0.4rem;
  color: var(--ink-faint);
}
.tag--edited { color: var(--done); border-color: var(--done); }
.tag--hidden { color: #e0a33c; border-color: #e0a33c; }
.editor-head .where {
  color: var(--ink-faint);
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.was {
  margin: 0;
  color: var(--ink-faint);
  border-left: 2px solid var(--line);
  padding-left: 0.7rem;
  font-size: 0.78rem;
  max-height: 5.5rem;
  overflow-y: auto;
}
.was em { font-style: normal; color: var(--ink-soft); }
textarea.draft {
  width: 100%;
  min-height: 7.5rem;
  resize: vertical;
  background: var(--ground);
  border: 1px solid var(--line-hot);
  border-radius: 2px;
  padding: 0.7rem;
  line-height: 1.65;
}
textarea.draft:focus { border-color: var(--accent); outline: none; }
.editor-foot { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
.count { color: var(--ink-faint); font-variant-numeric: tabular-nums; font-size: 0.72rem; margin-left: auto; }
.count.over { color: #e0a33c; }
.hint { color: var(--ink-faint); font-size: 0.7rem; }
kbd {
  border: 1px solid var(--line-hot);
  border-radius: 2px;
  padding: 0 0.28rem;
  font-size: 0.9em;
}

/* ---- preview ----------------------------------------------------------- */
.stagepane { position: relative; overflow: hidden; background: #000; }
.pv-note {
  position: absolute;
  z-index: 5;
  top: 0.6rem; right: 0.8rem;
  background: rgba(11, 11, 12, 0.85);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 0.25rem 0.55rem;
  font-size: 0.66rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-faint);
  pointer-events: none;
}
#preview { height: 100%; overflow-y: auto; overflow-x: hidden; }

/* ---- export sheet ------------------------------------------------------ */
dialog.sheet {
  background: var(--panel);
  color: var(--ink);
  border: 1px solid var(--line-hot);
  border-radius: 3px;
  padding: 1rem;
  width: min(46rem, 92vw);
}
dialog.sheet::backdrop { background: rgba(0, 0, 0, 0.72); }
dialog.sheet h2 { margin: 0 0 0.3rem; font-size: 0.95rem; letter-spacing: 0.02em; }
dialog.sheet p { margin: 0 0 0.7rem; color: var(--ink-soft); }
dialog.sheet textarea {
  width: 100%;
  height: 16rem;
  background: var(--ground);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 0.6rem;
  font-size: 0.74rem;
  resize: vertical;
}
.sheet-foot { display: flex; gap: 0.6rem; align-items: center; margin-top: 0.7rem; }

@media (max-width: 900px) {
  .stage { grid-template-columns: 1fr; height: auto; }
  .desk { border-right: 0; border-bottom: 1px solid var(--line-hot); }
  .queue-scroll { max-height: 40vh; }
  #preview { height: 70vh; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

</head>

<div class="rail">
  <div class="wordmark">HTG <span>copy desk</span></div>
  <div class="pages" id="pages" role="tablist" aria-label="Pages"></div>
  <div class="rail-right">
    <span class="sync" id="sync" data-state="local">local only</span>
    <span class="tally" id="tally"></span>
    <button class="btn btn--go" id="export" type="button">Send to Claude</button>
  </div>
</div>

<div class="stage">
  <section class="desk" aria-label="Copy queue">
    <div class="finder-wrap">
      <input class="finder" id="finder" type="search" placeholder="Find a line…" aria-label="Find a line" />
    </div>
    <div class="batchbar">
      <h2 id="batchLabel">Batch</h2>
      <button class="step" id="prevBatch" type="button" aria-label="Previous batch">←</button>
      <button class="step" id="nextBatch" type="button" aria-label="Next batch">→</button>
    </div>
    <div class="queue-scroll">
      <ol class="queue" id="queue"></ol>
    </div>
    <div class="editor" id="editor" hidden></div>
  </section>

  <section class="stagepane" aria-label="Live page">
    <span class="pv-note" id="pvNote">live page</span>
    <div id="preview"></div>
  </section>
</div>

<dialog class="sheet" id="sheet">
  <h2>Changed lines</h2>
  <p>Paste this back into the chat and Claude writes it into the site.</p>
  <textarea id="sheetText" readonly spellcheck="false"></textarea>
  <div class="sheet-foot">
    <button class="btn btn--go" id="sheetCopy" type="button">Copy</button>
    <button class="btn" id="sheetClose" type="button">Close</button>
    <span class="hint" id="sheetNote"></span>
  </div>
</dialog>

ground-size: 160px 160px;\n      opacity: 0.28;\n      z-index: 1;\n    }\n\n    .hero-content {\n      position: relative;\n      z-index: 2;\n      width: min(var(--max), calc(100% - 2rem));\n      margin: 0 auto;\n      display: grid;\n      grid-template-columns: 1.15fr 0.85fr;\n      gap: 2rem;\n      align-items: end;\n    }\n\n    .hero-copy {\n      max-width: 760px;\n    }\n\n    .eyebrow {\n      display: inline-flex;\n      align-items: center;\n      gap: 0.75rem;\n      margin-bottom: 1rem;\n      color: var(--accent);\n      text-transform: uppercase;\n      letter-spacing: 0.28rem;\n      font-size: 0.78rem;\n    }\n\n    .eyebrow::before {\n      content: \"\";\n      width: 60px;\n      height: 1px;\n      background: linear-gradient(90deg, transparent, var(--accent));\n    }\n\n    .hero h1 {\n      font-family: \"New Rocker\", system-ui;\n      font-size: clamp(3.4rem, 11vw, 7.2rem);\n      line-height: 0.95;\n      margin-bottom: 1rem;\n      text-transform: uppercase;\n      animation: wordmark-flicker-in 1.4s ease-out 1 both;\n    }\n\n    @keyframes wordmark-flicker-in {\n      0% { opacity: 0; }\n      6% { opacity: 1; transform: translateX(-3px) skewX(-2deg); }\n      10% { opacity: 0.2; transform: translateX(2px); }\n      16% { opacity: 1; transform: skewX(1.5deg); }\n      22% { opacity: 0.35; }\n      30%, 100% { opacity: 1; transform: none; }\n    }\n\n    .hero h1 span {\n      display: block;\n      color: var(--accent);\n    }\n\n    .hero-lead {\n      max-width: 62ch;\n      font-size: clamp(1rem, 1.4vw, 1.1rem);\n      color: var(--muted);\n      margin-bottom: 1.6rem;\n    }\n\n    .hero-cta,\n    .pill-links {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 0.9rem;\n    }\n\n    .btn,\n    .inline-link {\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      gap: 0.55rem;\n      min-height: 48px;\n      padding: 0.85rem 0.35rem;\n      border-radius: 0;\n      border: 0;\n      background: none;\n      color: var(--accent);\n      text-transform: uppercase;\n      letter-spacing: 0.16rem;\n      font-size: 0.78rem;\n      text-decoration: none;\n      text-underline-offset: 6px;\n      transition: color var(--transition), text-shadow var(--transition);\n      cursor: pointer;\n    }\n\n    .btn::before,\n    .inline-link::before {\n      content: \"[\";\n    }\n\n    .btn::after,\n    .inline-link::after {\n      content: \"]\";\n    }\n\n    .btn:hover,\n    .btn:focus-visible,\n    .inline-link:hover,\n    .inline-link:focus-visible {\n      text-decoration: underline;\n      text-shadow: 0 0 18px rgba(255, 255, 255, 0.45);\n    }\n\n    .btn-primary {\n      font-weight: 700;\n    }\n\n    .hero-side {\n      display: grid;\n      gap: 1rem;\n    }\n\n    .terminal-card,\n    .info-card,\n    .release-card,\n    .tour-card,\n    .gallery-item,\n    .contact-card,\n    .coming-card {\n      background: var(--panel);\n      border: 1px solid var(--line);\n      border-radius: var(--radius);\n      box-shadow: var(--shadow);\n      position: relative;\n      overflow: hidden;\n    }\n\n    .terminal-card::before,\n    .info-card::before,\n    .release-card::before,\n    .tour-card::before,\n    .gallery-item::before,\n    .contact-card::before,\n    .coming-card::before {\n      content: \"\";\n      position: absolute;\n      inset: 0;\n      border: 1px solid rgba(255, 255, 255, 0.03);\n      border-radius: inherit;\n      pointer-events: none;\n    }\n\n    .terminal-card {\n      padding: 1.2rem;\n    }\n\n    .terminal-head {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 1rem;\n      padding-bottom: 0.95rem;\n      margin-bottom: 1rem;\n      border-bottom: 1px solid var(--line-neutral);\n    }\n\n    .terminal-dots {\n      display: inline-flex;\n      gap: 0.45rem;\n    }\n\n    .terminal-dots span {\n      width: 10px;\n      height: 10px;\n      border-radius: 50%;\n      background: rgba(255, 255, 255, 0.45);\n      box-shadow: 0 0 12px rgba(255, 255, 255, 0.28);\n    }\n\n    .terminal-label {\n      font-size: 0.72rem;\n      color: var(--muted);\n      text-transform: uppercase;\n      letter-spacing: 0.18rem;\n    }\n\n    .terminal-line {\n      display: grid;\n      grid-template-columns: auto 1fr;\n      gap: 0.85rem;\n      font-size: 0.9rem;\n      padding: 0.45rem 0;\n    }\n\n    .terminal-line span:first-child {\n      color: var(--accent);\n    }\n\n    .floating-code {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 0.55rem;\n    }\n\n    .floating-code span {\n      display: inline-flex;\n      align-items: center;\n      min-height: 34px;\n      padding: 0.35rem 0.65rem;\n      border-radius: 999px;\n      border: 1px solid var(--line);\n      background: rgba(255, 255, 255, 0.04);\n      font-size: 0.72rem;\n      color: var(--muted);\n      text-transform: uppercase;\n      letter-spacing: 0.12rem;\n    }\n\n    .section {\n      padding: var(--section-space) 0;\n      position: relative;\n    }\n\n    /* Suit Purge easter egg: the #game section ships hidden and is unlocked\n       at runtime by script.js (Konami code / type \"purge\" / tap wordmark). */\n    #game[hidden] {\n      display: none !important;\n    }\n\n    #game.egg-reveal {\n      animation: eggReveal 0.9s ease both;\n    }\n\n    /* A quiet on-page nod that the hidden maze exists. */\n    .egg-hint {\n      margin-top: 1rem;\n      font-size: 0.72rem;\n      letter-spacing: 0.04em;\n      color: var(--muted);\n      opacity: 0.7;\n      transition: opacity var(--transition);\n    }\n\n    .egg-hint:hover {\n      opacity: 1;\n    }\n\n    .egg-hint kbd {\n      font-family: \"IBM Plex Mono\", ui-monospace, monospace;\n      font-size: 0.72em;\n      text-transform: uppercase;\n      letter-spacing: 0.12em;\n      padding: 0.15em 0.45em;\n      border: 1px solid var(--line-strong);\n      border-radius: 3px;\n      color: var(--accent);\n    }\n\n    .egg-hint a {\n      color: var(--accent);\n      text-decoration: none;\n      border-bottom: 1px solid var(--line-strong);\n    }\n\n    .egg-hint a:hover {\n      border-bottom-color: var(--accent);\n    }\n\n    @keyframes eggReveal {\n      from { opacity: 0; transform: translateY(24px); }\n      to { opacity: 1; transform: none; }\n    }\n\n    .section-head {\n      display: grid;\n      gap: 0.85rem;\n      margin-bottom: 2rem;\n      max-width: 760px;\n    }\n\n    /* A second head inside a section that already has one — it needs the gap\n       above that the section's own padding gives the first. */\n    .subsection-head {\n      margin-top: 3rem;\n    }\n\n    .section-kicker {\n      color: var(--accent);\n      text-transform: uppercase;\n      letter-spacing: 0.26rem;\n      font-size: 0.75rem;\n    }\n\n    .section-title {\n      font-family: \"New Rocker\", system-ui;\n      font-size: clamp(2rem, 4vw, 3.5rem);\n      line-height: 1;\n    }\n\n    .section-copy {\n      color: var(--muted);\n      max-width: 62ch;\n    }\n\n    .story-layout {\n      display: grid;\n      grid-template-columns: 0.92fr 1.08fr;\n      gap: 2rem;\n      align-items: start;\n    }\n\n    .story-panel {\n      padding: 1.4rem;\n      position: sticky;\n      top: calc(var(--nav-height) + 2rem);\n    }\n\n    .story-panel h3 {\n      font-size: 1rem;\n      text-transform: uppercase;\n      letter-spacing: 0.18rem;\n      color: var(--accent);\n      margin-bottom: 1rem;\n    }\n\n    .story-panel p + p {\n      margin-top: 1rem;\n    }\n\n    .story-timeline {\n      position: relative;\n      display: grid;\n      gap: 1.1rem;\n      padding-left: 1.2rem;\n    }\n\n    .story-timeline::before {\n      content: \"\";\n      position: absolute;\n      top: 0;\n      bottom: 0;\n      left: 0.2rem;\n      width: 1px;\n      background: linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.08));\n    }\n\n    .timeline-card {\n      position: relative;\n      padding: 1.2rem 1.2rem 1.2rem 1.35rem;\n      background: var(--panel);\n      border: 1px solid var(--line);\n      border-radius: var(--radius);\n      box-shadow: var(--shadow);\n    }\n\n    .timeline-card::before {\n      content: \"\";\n      position: absolute;\n      left: -1.56rem;\n      top: 1.25rem;\n      width: 12px;\n      height: 12px;\n      border-radius: 50%;\n      background: var(--accent);\n      box-shadow: 0 0 18px rgba(255, 255, 255, 0.45);\n    }\n\n    .timeline-step {\n      color: var(--accent);\n      text-transform: uppercase;\n      letter-spacing: 0.18rem;\n      font-size: 0.74rem;\n      margin-bottom: 0.65rem;\n    }\n\n    .timeline-card h3 {\n      font-size: 1rem;\n      text-transform: uppercase;\n      letter-spacing: 0.12rem;\n      margin-bottom: 0.55rem;\n    }\n\n    .timeline-card p {\n      color: var(--muted);\n      font-size: 0.95rem;\n    }\n\n    .stats-grid,\n    .release-grid,\n    .tour-grid,\n    .gallery-grid,\n    .coming-grid,\n    .player-grid,\n    .footer-grid {\n      display: grid;\n      gap: 1rem;\n    }\n\n    .stats-grid {\n      grid-template-columns: repeat(4, minmax(0, 1fr));\n    }\n\n    .stat-card {\n      padding: 1.2rem;\n      background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(26, 26, 26, 0.92));\n      border: 1px solid var(--line);\n      border-radius: var(--radius);\n      box-shadow: var(--shadow);\n    }\n\n    .stat-value {\n      font-family: \"New Rocker\", system-ui;\n      font-size: clamp(2rem, 4vw, 3rem);\n      color: var(--accent);\n      line-height: 1;\n      margin-bottom: 0.6rem;\n    }\n\n    .stat-label {\n      font-size: 0.82rem;\n      text-transform: uppercase;\n      letter-spacing: 0.16rem;\n      color: var(--muted);\n    }\n\n    .player-grid {\n      grid-template-columns: repeat(4, minmax(0, 1fr));\n    }\n\n    /* Embedded players injected from config.outNowEmbeds */\n    .embed-grid {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      gap: 1rem;\n      margin-top: 1rem;\n    }\n\n    .embed-card {\n      background: var(--panel);\n      border: 1px solid var(--line);\n      border-radius: var(--radius);\n      box-shadow: var(--shadow);\n      overflow: hidden;\n      padding: 0.6rem;\n    }\n\n    /* A single embed standing on its own outside .embed-grid — the landing\n       page's ciggyholster player. Capped so one card does not run the full\n       container width the way a two-up grid row does. */\n    .solo-embed {\n      max-width: 760px;\n      margin-top: 1rem;\n    }\n\n    .embed-card iframe {\n      display: block;\n      width: 100%;\n      border: 0;\n      border-radius: var(--radius-sm);\n    }\n\n    .info-card {\n      padding: 1.25rem;\n    }\n\n    .info-card h3,\n    .release-card h3,\n    .coming-card h3,\n    .tour-card h3,\n    .contact-card h3 {\n      font-size: 1rem;\n      text-transform: uppercase;\n      letter-spacing: 0.12rem;\n      margin-bottom: 0.75rem;\n    }\n\n    .info-card p,\n    .release-card p,\n    .coming-card p,\n    .tour-card p,\n    .contact-card p {\n      color: var(--muted);\n      font-size: 0.95rem;\n    }\n\n    .label-badge {\n      display: inline-flex;\n      align-items: center;\n      gap: 0.45rem;\n      margin-top: 1rem;\n      padding: 0.45rem 0.75rem;\n      border-radius: 999px;\n      background: rgba(255, 255, 255, 0.06);\n      border: 1px solid var(--line);\n      color: var(--accent);\n      font-size: 0.72rem;\n      text-transform: uppercase;\n      letter-spacing: 0.16rem;\n    }\n\n    .release-grid {\n      grid-template-columns: repeat(3, minmax(0, 1fr));\n    }\n\n    .release-card {\n      display: grid;\n    }\n\n    .release-cover,\n    .gallery-thumb,\n    .coming-image {\n      aspect-ratio: 1 / 1;\n      object-fit: cover;\n      width: 100%;\n    }\n\n    .release-body,\n    .coming-body,\n    .tour-body {\n      padding: 1.15rem;\n      display: grid;\n      gap: 0.9rem;\n    }\n\n    .meta-row {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 0.5rem;\n    }\n\n    .meta-row span,\n    .price-tag {\n      display: inline-flex;\n      align-items: center;\n      min-height: 30px;\n      padding: 0.3rem 0.65rem;\n      border-radius: 999px;\n      background: rgba(255, 255, 255, 0.05);\n      border: 1px solid var(--line);\n      font-size: 0.72rem;\n      text-transform: uppercase;\n      letter-spacing: 0.12rem;\n      color: var(--muted);\n    }\n\n    .tour-grid {\n      grid-template-columns: repeat(3, minmax(0, 1fr));\n    }\n\n    .tour-card {\n      display: grid;\n      grid-template-rows: auto 1fr;\n    }\n\n    .tour-head {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 1rem;\n      padding: 1rem 1.15rem 0;\n    }\n\n    .tour-date {\n      font-family: \"New Rocker\", system-ui;\n      color: var(--accent);\n      font-size: 1.3rem;\n      letter-spacing: 0.06rem;\n    }\n\n    .tour-status {\n      padding: 0.35rem 0.65rem;\n      border-radius: 999px;\n      border: 1px solid var(--line);\n      background: rgba(255, 255, 255, 0.06);\n      font-size: 0.68rem;\n      text-transform: uppercase;\n      letter-spacing: 0.16rem;\n      color: var(--muted);\n    }\n\n    .gallery-grid {\n      grid-template-columns: repeat(3, minmax(0, 1fr));\n    }\n\n    .gallery-item {\n      overflow: hidden;\n      cursor: pointer;\n      min-height: 100%;\n    }\n\n    .gallery-item img {\n      transition: transform 400ms ease, filter 400ms ease;\n      filter: grayscale(0.35) contrast(1.08);\n    }\n\n    .gallery-item:hover img,\n    .gallery-item:focus-visible img {\n      transform: scale(1.04);\n      filter: grayscale(0.05) contrast(1.12);\n    }\n\n    .gallery-caption {\n      position: absolute;\n      left: 0;\n      right: 0;\n      bottom: 0;\n      padding: 0.95rem 1rem;\n      background: linear-gradient(180deg, transparent, rgba(10, 10, 10, 0.92));\n      font-size: 0.82rem;\n      text-transform: uppercase;\n      letter-spacing: 0.14rem;\n    }\n\n    .coming-grid {\n      grid-template-columns: repeat(3, minmax(0, 1fr));\n    }\n\n    .contact-wrap {\n      display: grid;\n      grid-template-columns: 0.9fr 1.1fr;\n      gap: 1rem;\n    }\n\n    .contact-card {\n      padding: 1.3rem;\n    }\n\n    .contact-list {\n      list-style: none;\n      display: grid;\n      gap: 0.85rem;\n      margin-top: 1rem;\n    }\n\n    .contact-list li {\n      display: grid;\n      gap: 0.25rem;\n      padding: 0.8rem 0.9rem;\n      border-radius: var(--radius-sm);\n      border: 1px solid var(--line);\n      background: rgba(255, 255, 255, 0.04);\n    }\n\n    .contact-list strong {\n      color: var(--accent);\n      text-transform: uppercase;\n      font-size: 0.75rem;\n      letter-spacing: 0.16rem;\n    }\n\n    .contact-list a {\n      color: var(--text);\n      text-decoration: underline;\n      text-decoration-color: rgba(255, 255, 255, 0.5);\n      text-underline-offset: 3px;\n      overflow-wrap: anywhere;\n    }\n\n    .contact-list a:hover,\n    .contact-list a:focus-visible {\n      color: var(--accent);\n    }\n\n    .contact-form {\n      display: grid;\n      gap: 1rem;\n    }\n\n    .form-grid {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      gap: 1rem;\n    }\n\n    .field {\n      display: grid;\n      gap: 0.45rem;\n    }\n\n    .field label {\n      font-size: 0.75rem;\n      text-transform: uppercase;\n      letter-spacing: 0.16rem;\n      color: var(--muted);\n    }\n\n    .field input,\n    .field textarea {\n      width: 100%;\n      padding: 0.95rem 1rem;\n      border-radius: var(--radius-sm);\n      border: 1px solid rgba(255, 255, 255, 0.2);\n      background: rgba(255, 255, 255, 0.02);\n      color: var(--text);\n      outline: none;\n      transition: border-color var(--transition), background var(--transition), box-shadow var(--transition);\n    }\n\n    .field input:focus,\n    .field textarea:focus {\n      border-color: rgba(255, 255, 255, 0.65);\n      background: rgba(255, 255, 255, 0.04);\n      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.08);\n    }\n\n    .field textarea {\n      min-height: 180px;\n      resize: vertical;\n    }\n\n    /* Honeypot — out of flow and invisible, but still in the form for bots\n       to fill. display:none is avoided: some bots skip hidden inputs. */\n    .hp-field {\n      position: absolute;\n      width: 1px;\n      height: 1px;\n      overflow: hidden;\n      clip-path: inset(50%);\n      white-space: nowrap;\n    }\n\n    .error-message {\n      min-height: 1rem;\n      color: var(--danger);\n      font-size: 0.8rem;\n    }\n\n    .form-status {\n      min-height: 1.2rem;\n      font-size: 0.86rem;\n      color: var(--accent);\n    }\n\n    .footer {\n      padding: 0 0 7rem;\n    }\n\n    .footer-grid {\n      grid-template-columns: 1.2fr 0.8fr;\n      align-items: center;\n      padding: 1.4rem;\n      border: 1px solid var(--line);\n      border-radius: var(--radius);\n      background: rgba(17, 17, 17, 0.92);\n      box-shadow: var(--shadow);\n    }\n\n    .footer-copy p {\n      color: var(--muted);\n      max-width: 60ch;\n      margin-top: 0.55rem;\n    }\n\n    .social-links {\n      display: flex;\n      flex-wrap: wrap;\n      justify-content: flex-end;\n      gap: 0.75rem;\n    }\n\n    .social-link {\n      width: 48px;\n      height: 48px;\n      border-radius: 50%;\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      border: 1px solid var(--line);\n      background: rgba(255, 255, 255, 0.04);\n      color: var(--text);\n      transition: transform var(--transition), border-color var(--transition), background var(--transition);\n    }\n\n    .social-link svg {\n      width: 20px;\n      height: 20px;\n      fill: currentColor;\n    }\n\n    .social-link:hover,\n    .social-link:focus-visible {\n      transform: translateY(-2px);\n      border-color: rgba(255, 255, 255, 0.6);\n      background: rgba(255, 255, 255, 0.12);\n      color: var(--accent);\n    }\n\n    .lightbox {\n      position: fixed;\n      inset: 0;\n      z-index: 1200;\n      display: grid;\n      place-items: center;\n      padding: 1rem;\n      background: rgba(0, 0, 0, 0.92);\n      opacity: 0;\n      visibility: hidden;\n      /* visibility flips instantly on open (so the dialog can take focus)\n         and only after the fade on close */\n      transition: opacity var(--transition), visibility 0s linear var(--transition);\n    }\n\n    .lightbox.open {\n      opacity: 1;\n      visibility: visible;\n      transition: opacity var(--transition), visibility 0s;\n    }\n\n    .lightbox-dialog {\n      width: min(1080px, 100%);\n      position: relative;\n      display: grid;\n      gap: 0.8rem;\n    }\n\n    .lightbox-figure {\n      border-radius: var(--radius);\n      overflow: hidden;\n      border: 1px solid var(--line);\n      background: #000;\n      box-shadow: var(--shadow);\n    }\n\n    .lightbox-figure img {\n      width: 100%;\n      max-height: 76vh;\n      object-fit: contain;\n      background: #000;\n    }\n\n    .lightbox-bar {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 1rem;\n      color: var(--muted);\n      font-size: 0.85rem;\n    }\n\n    .lightbox-actions {\n      display: flex;\n      gap: 0.65rem;\n    }\n\n    .icon-btn {\n      width: 46px;\n      height: 46px;\n      border-radius: 50%;\n      border: 1px solid var(--line-strong);\n      background: rgba(255, 255, 255, 0.04);\n      color: var(--text);\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      cursor: pointer;\n      transition: transform var(--transition), background var(--transition), border-color var(--transition);\n    }\n\n    .icon-btn:hover,\n    .icon-btn:focus-visible {\n      transform: translateY(-2px);\n      background: rgba(255, 255, 255, 0.12);\n      border-color: rgba(255, 255, 255, 0.75);\n    }\n\n    .to-top {\n      position: fixed;\n      right: 1rem;\n      bottom: calc(var(--cta-space) + max(1rem, env(safe-area-inset-bottom)));\n      z-index: 990;\n      width: 50px;\n      height: 50px;\n      border-radius: 50%;\n      border: 1px solid var(--line-strong);\n      background: rgba(10, 10, 10, 0.85);\n      color: var(--accent);\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      box-shadow: var(--shadow);\n      opacity: 0;\n      visibility: hidden;\n      transform: translateY(12px);\n      transition: opacity var(--transition), visibility var(--transition), transform var(--transition);\n      cursor: pointer;\n    }\n\n    .to-top.show {\n      opacity: 1;\n      visibility: visible;\n      transform: translateY(0);\n    }\n\n    /* Without this the end of the page sits underneath the bar unreachable. */\n    .pv-body:has(.sticky-cta) {\n      padding-bottom: var(--cta-space);\n    }\n\n    .sticky-cta {\n      position: fixed;\n      left: 0;\n      right: 0;\n      bottom: 0;\n      z-index: 980;\n      padding: 0.75rem 1rem max(0.75rem, env(safe-area-inset-bottom));\n      background: rgba(10, 10, 10, 0.92);\n      backdrop-filter: blur(16px);\n      border-top: 1px solid var(--line-neutral);\n    }\n\n    .sticky-cta-inner {\n      width: min(var(--max), 100%);\n      margin: 0 auto;\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 1rem;\n    }\n\n    .sticky-copy {\n      display: grid;\n      gap: 0.15rem;\n    }\n\n    .sticky-copy strong {\n      font-size: 0.88rem;\n      text-transform: uppercase;\n      letter-spacing: 0.18rem;\n      color: var(--accent);\n    }\n\n    .sticky-copy span {\n      font-size: 0.8rem;\n      color: var(--muted);\n    }\n\n    .sticky-actions {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 0.7rem;\n    }\n\n    /* Reveal animation only arms itself when JS is running, so content is\n       never stuck invisible if the script fails to load. */\n    .fade-in {\n      transition: opacity 650ms ease, transform 650ms ease;\n    }\n\n    .js .fade-in {\n      opacity: 0;\n      transform: translateY(24px);\n    }\n\n    .js .fade-in.visible {\n      opacity: 1;\n      transform: translateY(0);\n    }\n\n    .parallax-layer {\n      will-change: transform;\n    }\n\n    .sr-only {\n      position: absolute;\n      width: 1px;\n      height: 1px;\n      padding: 0;\n      margin: -1px;\n      overflow: hidden;\n      clip: rect(0, 0, 0, 0);\n      white-space: nowrap;\n      border: 0;\n    }\n\n    .skip-link {\n      position: fixed;\n      top: 0.5rem;\n      left: 0.5rem;\n      z-index: 2000;\n      padding: 0.6rem 0.9rem;\n      background: var(--accent);\n      color: #000;\n      border-radius: 4px;\n      text-decoration: none;\n      font-weight: 600;\n      transform: translateY(-200%);\n      transition: transform var(--transition);\n    }\n    .skip-link:focus {\n      transform: translateY(0);\n      outline: 2px solid #000;\n      outline-offset: 2px;\n    }\n\n    @media (max-width: 1080px) {\n      :host {\n        /* The bar wraps to two rows at this width. */\n        --cta-space: 9.5rem;\n      }\n\n      .hero-content,\n      .story-layout,\n      .contact-wrap,\n      .footer-grid {\n        grid-template-columns: 1fr;\n      }\n\n      .stats-grid,\n      .player-grid,\n      .release-grid,\n      .tour-grid,\n      .gallery-grid,\n      .coming-grid {\n        grid-template-columns: repeat(2, minmax(0, 1fr));\n      }\n\n      .story-panel {\n        position: relative;\n        top: 0;\n      }\n    }\n\n    @media (max-width: 820px) {\n      :host {\n        --nav-height: 92px;\n        --cta-space: 0rem;\n      }\n\n      .pv-body {\n        cursor: auto;\n      }\n\n      .cursor,\n      .cursor-dot {\n        display: none;\n      }\n\n      .topbar-inner {\n        justify-items: stretch;\n        padding: 0.85rem 1rem 0.9rem;\n      }\n\n      .menu-toggle {\n        display: inline-flex;\n      }\n\n      .nav {\n        display: none;\n        padding-top: 0.85rem;\n      }\n\n      .nav.open {\n        display: block;\n      }\n\n      .nav-list {\n        flex-direction: column;\n        align-items: stretch;\n      }\n\n      .nav-list a {\n        justify-content: flex-start;\n        padding-inline: 1rem;\n        border-radius: var(--radius-sm);\n      }\n\n      .hero {\n        min-height: auto;\n      }\n\n      .hero h1 {\n        font-size: clamp(2.7rem, 14vw, 4.5rem);\n      }\n\n      /* The bottom CTA bar is desktop-only. Stacked on a phone it grew to\n         two full-width buttons plus two lines of copy, permanently covering\n         a third of the viewport and sitting over the footer. */\n      .sticky-cta {\n        display: none;\n      }\n\n      .hero-cta,\n      .pill-links,\n      .social-links {\n        justify-content: flex-start;\n      }\n\n      .embed-grid {\n        grid-template-columns: 1fr;\n      }\n    }\n\n    @media (max-width: 640px) {\n      main {\n        padding-top: 0;\n      }\n\n      .container {\n        width: min(var(--max), calc(100% - 1rem));\n      }\n\n      .section {\n        padding: clamp(3.5rem, 10vw, 5rem) 0;\n      }\n\n      .stats-grid,\n      .player-grid,\n      .release-grid,\n      .tour-grid,\n      .gallery-grid,\n      .coming-grid,\n      .form-grid {\n        grid-template-columns: 1fr;\n      }\n\n      .hero-copy,\n      .section-head,\n      .footer-copy p {\n        max-width: 100%;\n      }\n\n      .timeline-card::before {\n        left: -1.46rem;\n      }\n\n      .story-timeline {\n        padding-left: 1rem;\n      }\n\n      .section-title {\n        font-size: clamp(1.8rem, 9vw, 2.4rem);\n      }\n\n      .hero-cta .btn,\n      .hero-cta .inline-link {\n        width: 100%;\n      }\n\n      .to-top {\n        right: 0.8rem;\n      }\n    }\n\n    @media (prefers-reduced-motion: reduce) {\n      .pv-html {\n        scroll-behavior: auto;\n      }\n\n      *, *::before, *::after {\n        animation: none !important;\n        transition: none !important;\n      }\n\n      .fade-in {\n        opacity: 1;\n        transform: none;\n      }\n    }\n  \n\n    /* THE SEQUENCE — playthrough players, highlights, badges */\n    .sequence-block {\n      margin-top: 1rem;\n    }\n\n    .sequence-artist .embed-card {\n      max-width: 760px;\n    }\n\n    .embed-card.highlight {\n      border-color: rgba(255, 255, 255, 0.75);\n      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35), 0 0 34px rgba(255, 255, 255, 0.25), var(--shadow);\n    }\n\n    .embed-head {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 0.5rem;\n      padding: 0.15rem 0.35rem 0.55rem;\n    }\n\n    .embed-num {\n      color: var(--accent);\n      font-size: 0.8rem;\n      letter-spacing: 0.2rem;\n    }\n\n    .embed-tag {\n      margin-left: auto;\n      padding: 0.2rem 0.65rem;\n      border-radius: 999px;\n      border: 1px solid var(--line-strong);\n      background: rgba(255, 255, 255, 0.14);\n      color: var(--accent);\n      font-size: 0.66rem;\n      font-weight: 700;\n      letter-spacing: 0.2rem;\n      text-transform: uppercase;\n    }\n\n    .insta-grid iframe {\n      background: #fff;\n    }\n\n    /* =====================================================================\n       Empty states + Suit Purge (game.js)\n       ===================================================================== */\n\n    [hidden] {\n      display: none !important;\n    }\n\n    .empty-state {\n      padding: 1.5rem;\n      border: 1px dashed var(--line);\n      border-radius: var(--radius);\n      background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(26, 26, 26, 0.9));\n      display: grid;\n      gap: 1.1rem;\n      justify-items: start;\n    }\n\n    .empty-state p {\n      color: var(--muted);\n      max-width: 62ch;\n    }\n\n    .game-stage {\n      position: relative;\n      width: min(var(--max), calc(100% - 2rem));\n      margin: 1.5rem auto 0;\n      aspect-ratio: 16 / 9;\n      border: 1px solid var(--line-strong);\n      border-radius: var(--radius);\n      overflow: hidden;\n      background: #0a0a0a;\n      box-shadow: var(--shadow);\n    }\n\n    .game-canvas {\n      display: block;\n      width: 100%;\n      height: 100%;\n      image-rendering: pixelated;\n      touch-action: manipulation;\n    }\n\n    .game-canvas.is-playing {\n      cursor: crosshair;\n      touch-action: none;\n    }\n\n    .game-hud {\n      position: absolute;\n      top: 0.6rem;\n      left: 0.6rem;\n      display: flex;\n      flex-wrap: wrap;\n      gap: 0.4rem;\n      pointer-events: none;\n    }\n\n    .hud-cell {\n      display: inline-flex;\n      align-items: baseline;\n      gap: 0.4rem;\n      padding: 0.3rem 0.6rem;\n      border-radius: 999px;\n      border: 1px solid var(--line);\n      background: rgba(14, 14, 14, 0.72);\n      font-size: 0.6rem;\n      text-transform: uppercase;\n      letter-spacing: 0.14rem;\n      color: var(--muted);\n    }\n\n    .hud-cell b {\n      font-size: 0.85rem;\n      font-weight: 700;\n      color: var(--accent);\n    }\n\n    .game-overlay {\n      position: absolute;\n      inset: 0;\n      display: grid;\n      align-content: center;\n      justify-items: center;\n      gap: 0.85rem;\n      padding: 1.25rem;\n      text-align: center;\n      background: radial-gradient(circle at center, rgba(24, 24, 24, 0.84), rgba(6, 6, 6, 0.96));\n    }\n\n    .game-kicker {\n      color: var(--accent);\n      font-size: 0.64rem;\n      text-transform: uppercase;\n      letter-spacing: 0.3rem;\n    }\n\n    .game-overlay h2 {\n      font-family: \"New Rocker\", system-ui;\n      font-size: clamp(2rem, 7vw, 4rem);\n      line-height: 1;\n      text-transform: uppercase;\n    }\n\n    .game-lead {\n      max-width: 46ch;\n      color: var(--muted);\n      font-size: 0.9rem;\n    }\n\n    .game-keys {\n      max-width: 54ch;\n      color: var(--muted);\n      font-size: 0.68rem;\n    }\n\n    .game-keys b {\n      color: var(--accent);\n      font-weight: 500;\n    }\n\n    .game-touch {\n      position: absolute;\n      inset: 0;\n      pointer-events: none;\n    }\n\n    .game-fire {\n      position: absolute;\n      right: 1rem;\n      bottom: 1rem;\n      width: 78px;\n      height: 78px;\n      border-radius: 50%;\n      border: 1px solid rgba(255, 255, 255, 0.6);\n      background: rgba(255, 255, 255, 0.2);\n      color: var(--text);\n      font-family: inherit;\n      font-size: 0.66rem;\n      letter-spacing: 0.16rem;\n      pointer-events: auto;\n      cursor: pointer;\n    }\n\n    .game-bar {\n      position: absolute;\n      top: 0.6rem;\n      right: 0.6rem;\n      display: flex;\n      gap: 0.4rem;\n    }\n\n    .game-chip {\n      padding: 0.35rem 0.7rem;\n      border-radius: 999px;\n      border: 1px solid var(--line-strong);\n      background: rgba(14, 14, 14, 0.82);\n      color: var(--text);\n      font-family: inherit;\n      font-size: 0.6rem;\n      text-transform: uppercase;\n      letter-spacing: 0.14rem;\n      cursor: pointer;\n    }\n\n    @media (pointer: fine) {\n      .game-fire {\n        display: none;\n      }\n    }\n\n    /*\n      Both .pv-body overlays are fixed, full-viewport and masked/blended, so the\n      compositor re-blends them on every canvas repaint - measured at a 23fps\n      cost while the game runs. Drop them for the duration.\n    */\n    .pv-body.game-active::before,\n    .pv-body.game-active::after {\n      display: none;\n    }\n\n    .pv-body.game-active .cursor,\n    .pv-body.game-active .cursor-dot {\n      opacity: 0;\n    }\n    .pv-body.game-active .to-top {\n      display: none;\n    }\n\n    /* The bar is fixed over everything, including the game viewport. */\n    .pv-body.game-active .sticky-cta {\n      display: none;\n    }\n\n    @media (max-width: 820px) {\n      .game-stage {\n        width: 100%;\n        aspect-ratio: auto;\n        height: 68vh;\n        height: 68dvh;\n        border-radius: 0;\n        border-left: 0;\n        border-right: 0;\n      }\n\n      /* Top-right collides with the HUD on a phone. */\n      .game-bar {\n        top: auto;\n        right: auto;\n        bottom: 0.6rem;\n        left: 0.6rem;\n      }\n    }\n\n    /* =====================================================================\n       Roster — ABRAXAS + Stretty slide-down splits\n       ===================================================================== */\n    .splits {\n      display: grid;\n      gap: 1rem;\n    }\n\n    .split {\n      border: 1px solid var(--line);\n      border-radius: var(--radius);\n      background: var(--panel);\n      box-shadow: var(--shadow);\n      overflow: hidden;\n    }\n\n    .split-toggle {\n      display: flex;\n      align-items: center;\n      gap: 1rem;\n      width: 100%;\n      padding: 1.2rem 1.4rem;\n      border: 0;\n      background: none;\n      color: var(--text);\n      cursor: pointer;\n      text-align: left;\n    }\n\n    .split-index {\n      font-family: \"New Rocker\", system-ui;\n      color: var(--accent);\n      font-size: 1.1rem;\n      letter-spacing: 0.1rem;\n    }\n\n    .split-name {\n      font-family: \"New Rocker\", system-ui;\n      font-size: clamp(1.6rem, 4vw, 2.4rem);\n      letter-spacing: 0.08rem;\n      text-transform: uppercase;\n      line-height: 1;\n    }\n\n    .split-tag {\n      padding: 0.28rem 0.7rem;\n      border-radius: 999px;\n      border: 1px solid var(--line-strong);\n      background: rgba(255, 255, 255, 0.06);\n      color: var(--muted);\n      font-size: 0.64rem;\n      letter-spacing: 0.18rem;\n      text-transform: uppercase;\n    }\n\n    .split-icon {\n      margin-left: auto;\n      flex: 0 0 auto;\n      width: 34px;\n      height: 34px;\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      border-radius: 50%;\n      border: 1px solid var(--line-strong);\n      color: var(--accent);\n      font-size: 1.25rem;\n      line-height: 1;\n      transition: transform var(--transition), background var(--transition);\n    }\n\n    .split.open .split-icon {\n      transform: rotate(45deg);\n      background: rgba(255, 255, 255, 0.08);\n    }\n\n    .split-toggle:hover .split-icon,\n    .split-toggle:focus-visible .split-icon {\n      background: rgba(255, 255, 255, 0.1);\n    }\n\n    /* Slide-down: animate the grid row 0fr -> 1fr (height, animatable). */\n    .split-body {\n      display: grid;\n      grid-template-rows: 0fr;\n      transition: grid-template-rows 340ms ease;\n    }\n\n    .split.open .split-body {\n      grid-template-rows: 1fr;\n    }\n\n    .split-inner {\n      overflow: hidden;\n      min-height: 0;\n    }\n\n    .split-content {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 1.5rem;\n      align-items: start;\n      padding: 0 1.4rem 1.5rem;\n      border-top: 1px solid var(--line-neutral);\n    }\n\n    .split-content > * {\n      padding-top: 1.4rem;\n    }\n\n    .split-copy p {\n      color: var(--muted);\n    }\n\n    .split-copy p + p {\n      margin-top: 0.9rem;\n    }\n\n    .split-copy .pill-links {\n      margin-top: 1.2rem;\n    }\n\n    .split-media iframe {\n      display: block;\n      width: 100%;\n      border: 0;\n      border-radius: var(--radius-sm);\n    }\n\n    .split-vault {\n      margin-top: 1.1rem;\n      display: inline-flex;\n      align-items: center;\n      gap: 0.5rem;\n      padding: 0.6rem 0.9rem;\n      border: 1px dashed var(--line-strong);\n      border-radius: var(--radius-sm);\n      color: var(--muted);\n      font-size: 0.7rem;\n      letter-spacing: 0.14rem;\n      text-transform: uppercase;\n      transition: color var(--transition), border-color var(--transition), background var(--transition);\n    }\n\n    .split-vault:hover,\n    .split-vault:focus-visible {\n      color: var(--accent);\n      border-color: var(--accent);\n      background: rgba(255, 255, 255, 0.04);\n    }\n\n    /* Hidden portal — a low-key glyph out to the off-grid signal. */\n    .ghost-portal {\n      display: inline-block;\n      margin-left: 0.5rem;\n      opacity: 0.12;\n      transition: opacity var(--transition), color var(--transition);\n    }\n\n    .ghost-portal:hover,\n    .ghost-portal:focus-visible {\n      opacity: 1;\n      color: var(--accent);\n    }\n\n    @media (max-width: 720px) {\n      .split-content {\n        grid-template-columns: 1fr;\n      }\n      .split-content > * {\n        padding-top: 1.2rem;\n      }\n      .split-name {\n        font-size: clamp(1.4rem, 8vw, 2rem);\n      }\n    }\n    /* ---- Legal footer block --------------------------------------------- */\n    .legal-footer {\n      margin-top: 2.5rem;\n      padding-top: 1.5rem;\n      border-top: 1px solid rgba(255, 255, 255, 0.25);\n      font-family: \"IBM Plex Mono\", monospace;\n    }\n    .legal-footer-links {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 0.4rem 1.25rem;\n      margin-bottom: 1rem;\n      font-size: 0.78rem;\n      letter-spacing: 0.08em;\n      text-transform: uppercase;\n    }\n    .legal-footer-links a {\n      color: var(--accent);\n      text-decoration: underline;\n      text-underline-offset: 3px;\n    }\n    .legal-footer-links a:hover,\n    .legal-footer-links a:focus-visible {\n      color: #ffffff;\n    }\n    .legal-footer-copy {\n      font-size: 0.78rem;\n      line-height: 1.65;\n      color: var(--muted);\n      margin: 0 0 0.7rem;\n    }\n    .legal-footer-copy:last-child { margin-bottom: 0; }\n","pages":{"index.html":{"label":"Landing (HTG)","css":"\n    /* HTG-only chrome: the masthead wordmark and the artist doors.\n       Everything else on this page comes from style.css. */\n    :host { --abx: #b478ff; --str: #16c85a; --jus: #ff9b3d; --cig: #2fd4e0; }\n\n    /* No hero aside on HTG — collapse style.css's two-column hero to one. */\n    .hero-content { grid-template-columns: 1fr; }\n    .mast { text-align: center; max-width: 52rem; margin: 0 auto; }\n    .mast .curse {\n      font-size: clamp(0.62rem, 1.6vw, 0.8rem);\n      letter-spacing: 0.42em;\n      text-transform: uppercase;\n      color: var(--muted);\n      margin-bottom: 1.4rem;\n    }\n    .mast .wordmark {\n      font-family: \"New Rocker\", \"IBM Plex Mono\", serif;\n      font-weight: 400;\n      line-height: 0.9;\n      font-size: clamp(3.4rem, 15vw, 9rem);\n      letter-spacing: 0.02em;\n    }\n    .mast .expand {\n      margin-top: 0.85rem;\n      font-size: clamp(0.72rem, 2.2vw, 1rem);\n      letter-spacing: 0.5em;\n      text-transform: uppercase;\n      padding-left: 0.5em; /* optical: absorb the trailing letter-spacing */\n    }\n    .mast .manifesto {\n      margin: 1.9rem auto 0;\n      font-size: clamp(0.9rem, 2.3vw, 1.08rem);\n      line-height: 1.65;\n      color: #cfcfcf;\n    }\n    .mast .manifesto b { color: var(--text); font-weight: 700; }\n    .mast .hero-cta { justify-content: center; margin-top: 2rem; }\n\n    /* ---- The artist doors ------------------------------------------------ */\n    .doors {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 1px;\n      background: var(--line);\n      border: 1px solid var(--line);\n      border-radius: var(--radius);\n      overflow: hidden;\n    }\n    .door {\n      position: relative;\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      justify-content: center;\n      /* Basis >1/3 forces exactly two per row; the row height lives here rather\n         than on .doors so both rows stay full-height once the list wraps. */\n      flex: 1 1 40%;\n      min-height: clamp(15rem, 28vh, 21rem);\n      padding: 2rem 1.25rem;\n      overflow: hidden;\n      text-align: center;\n      text-decoration: none;\n      color: var(--text);\n      background: rgba(10, 10, 10, 0.62);\n      transition: flex-grow 0.5s ease, background 0.4s ease, filter 0.4s ease;\n    }\n    /* ABRAXAS is the lit, dominant door; the rest sit recessed and dimmer. */\n    .door--abx { flex-grow: 1.35; }\n    .door--str, .door--jus, .door--cig { filter: brightness(0.72) saturate(0.6); }\n    .door:hover, .door:focus-visible { flex-grow: 2; filter: none; background: rgba(10, 10, 10, 0.25); }\n    .door--abx:hover, .door--abx:focus-visible { box-shadow: inset 0 0 140px rgba(180, 120, 255, 0.28); }\n    .door--str:hover, .door--str:focus-visible { box-shadow: inset 0 0 140px rgba(22, 200, 90, 0.24); }\n    .door--jus:hover, .door--jus:focus-visible { box-shadow: inset 0 0 140px rgba(255, 155, 61, 0.24); }\n    .door--cig:hover, .door--cig:focus-visible { box-shadow: inset 0 0 140px rgba(47, 212, 224, 0.24); }\n\n    .door-name {\n      font-family: \"New Rocker\", serif;\n      font-size: clamp(2rem, 6vw, 4rem);\n      line-height: 1;\n      max-width: 100%;\n      overflow-wrap: anywhere;\n      transition: color 0.4s ease, text-shadow 0.4s ease;\n    }\n    /* Handles run ~12 characters against ABRAXAS's 7 — they need their own step\n       down or New Rocker overruns the door at every width. */\n    .door-name--long { font-size: clamp(1.3rem, 3.4vw, 2.2rem); }\n    .door--abx:hover .door-name, .door--abx:focus-visible .door-name {\n      color: var(--abx); text-shadow: 0 0 30px rgba(180, 120, 255, 0.55);\n    }\n    .door--str:hover .door-name, .door--str:focus-visible .door-name {\n      color: var(--str); text-shadow: 0 0 30px rgba(22, 200, 90, 0.5);\n    }\n    .door--jus:hover .door-name, .door--jus:focus-visible .door-name {\n      color: var(--jus); text-shadow: 0 0 30px rgba(255, 155, 61, 0.5);\n    }\n    .door--cig:hover .door-name, .door--cig:focus-visible .door-name {\n      color: var(--cig); text-shadow: 0 0 30px rgba(47, 212, 224, 0.5);\n    }\n    .door-role {\n      margin-top: 0.7rem;\n      font-size: 0.72rem;\n      letter-spacing: 0.32em;\n      text-transform: uppercase;\n      color: var(--muted);\n    }\n    /* Reveal slides down under the name on hover/focus (always shown on touch). */\n    .door-reveal {\n      max-height: 0;\n      opacity: 0;\n      overflow: hidden;\n      margin-top: 0;\n      transition: max-height 0.5s ease, opacity 0.4s ease, margin 0.5s ease;\n    }\n    .door:hover .door-reveal, .door:focus-visible .door-reveal { max-height: 12rem; opacity: 1; margin-top: 1.4rem; }\n    .door-line { max-width: 22rem; margin: 0 auto 1rem; font-size: 0.82rem; line-height: 1.55; color: #cbcbcb; }\n    .board-btn {\n      display: inline-block;\n      padding: 0.6rem 1.6rem;\n      border: 1px solid var(--text);\n      font-size: 0.72rem;\n      letter-spacing: 0.28em;\n      text-transform: uppercase;\n    }\n    .door--abx .board-btn { border-color: var(--abx); color: var(--abx); }\n    .door--str .board-btn { border-color: var(--str); color: var(--str); }\n    .door--jus .board-btn { border-color: var(--jus); color: var(--jus); }\n    .door--cig .board-btn { border-color: var(--cig); color: var(--cig); }\n\n    .nod { display: block; margin-top: 1.2rem; font-size: 0.64rem; letter-spacing: 0.4em; text-transform: uppercase; color: #5a5a5a; }\n\n    @media (max-width: 760px) {\n      .doors { flex-direction: column; flex-wrap: nowrap; }\n      /* Stacked, four deep — drop the row height so the list stays scannable. */\n      .door { flex: 1 1 auto; min-height: 0; }\n      .door--str, .door--jus, .door--cig { filter: brightness(0.8) saturate(0.7); }\n      /* No hover on touch — show the reveal so the CTA is always reachable. */\n      .door-reveal { max-height: 12rem; opacity: 1; margin-top: 1.2rem; }\n    }\n    @media (prefers-reduced-motion: reduce) {\n      .door, .door-name, .door-reveal { transition: none; }\n    }\n  ","html":"\n  \n  <a class=\"skip-link\" href=\"#home\"><span class=\"tslot\" data-slot=\"index.html:3\">Skip to content<\/span><\/a>\n  <div class=\"cursor\" aria-hidden=\"true\"><\/div>\n  <div class=\"cursor-dot\" aria-hidden=\"true\"><\/div>\n\n  <div class=\"site-shell\">\n    <header class=\"topbar\" id=\"topbar\">\n      <div class=\"topbar-inner\">\n        <div class=\"brand\">\n          <div class=\"brand-mark\">\n            <span class=\"brand-title\"><span class=\"tslot\" data-slot=\"index.html:4\">HTG<\/span><\/span>\n          <\/div>\n          <p class=\"brand-subtitle\"><span class=\"tslot\" data-slot=\"index.html:5\">Hex The Government // the vessel // ABRAXAS &amp; Stretty<\/span><\/p>\n        <\/div>\n\n        <div class=\"nav-wrap\">\n          <button class=\"menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"site-nav\" id=\"menuToggle\">\n            <span aria-hidden=\"true\">☰<\/span>\n            <span><span class=\"tslot\" data-slot=\"index.html:7\">Open Menu<\/span><\/span>\n          <\/button>\n\n          <nav class=\"nav\" id=\"site-nav\" aria-label=\"Primary navigation\">\n            <ul class=\"nav-list\">\n              <li><a href=\"#home\"><span class=\"tslot\" data-slot=\"index.html:8\">Home<\/span><\/a><\/li>\n              <li><a href=\"#roster\"><span class=\"tslot\" data-slot=\"index.html:9\">The Roster<\/span><\/a><\/li>\n              <li><a href=\"#story\"><span class=\"tslot\" data-slot=\"index.html:10\">Story<\/span><\/a><\/li>\n              <li><a href=\"#out-now\"><span class=\"tslot\" data-slot=\"index.html:11\">Out Now<\/span><\/a><\/li>\n              <li><a href=\"sequence.html\"><span class=\"tslot\" data-slot=\"index.html:12\">The Sequence<\/span><\/a><\/li>\n              <li><a href=\"#releases\"><span class=\"tslot\" data-slot=\"index.html:13\">New Releases<\/span><\/a><\/li>\n              <li><a href=\"#coming-soon\"><span class=\"tslot\" data-slot=\"index.html:14\">Coming Soon<\/span><\/a><\/li>\n              <li><a data-shop-link href=\"https://strettys-merch.myshopify.com\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"tslot\" data-slot=\"index.html:15\">Merchandise<\/span><\/a><\/li>\n              <li><a href=\"#tours\"><span class=\"tslot\" data-slot=\"index.html:16\">Upcoming Tours<\/span><\/a><\/li>\n              <li><a href=\"#gallery\"><span class=\"tslot\" data-slot=\"index.html:17\">Gallery<\/span><\/a><\/li>\n              <li><a href=\"#contact\"><span class=\"tslot\" data-slot=\"index.html:18\">Contact<\/span><\/a><\/li>\n            <\/ul>\n          <\/nav>\n        <\/div>\n      <\/div>\n    <\/header>\n\n    <main>\n      <section class=\"hero\" id=\"home\">\n        <div class=\"hero-overlay\"><\/div>\n        <div class=\"hero-grid parallax-layer\" data-speed=\"0.08\"><\/div>\n        <div class=\"hero-noise parallax-layer\" data-speed=\"0.05\"><\/div>\n\n        <div class=\"hero-content\">\n          <div class=\"mast fade-in visible\">\n            <p class=\"curse\"><span class=\"tslot\" data-slot=\"index.html:19\">Fuck the government · fuck the rich · fuck what they built on us<\/span><\/p>\n            <h1 class=\"wordmark\"><span class=\"tslot\" data-slot=\"index.html:20\">HTG<\/span><\/h1>\n            <p class=\"expand\"><span class=\"tslot\" data-slot=\"index.html:21\">Hex The Government<\/span><\/p>\n            <p class=\"manifesto\">\n              <b><span class=\"tslot\" data-slot=\"index.html:22\">H.T.G. is a vessel.<\/span><\/b> <span class=\"tslot\" data-slot=\"index.html:23\">A private ark on corporate waters, built to stay afloat while\n              governments and billionaires sink everything else.<\/span>\n              <br><br>\n              <b><span class=\"tslot\" data-slot=\"index.html:24\">ABRAXAS is Noah<\/span><\/b> <span class=\"tslot\" data-slot=\"index.html:25\">— out front.<\/span> <b><span class=\"tslot\" data-slot=\"index.html:26\">Stretty is the Ark<\/span><\/b> <span class=\"tslot\" data-slot=\"index.html:27\">— the hull. Four names aboard,\n              more being pulled out of the water.<\/span>\n            <\/p>\n            <div class=\"hero-cta\">\n              <a class=\"btn btn-primary\" href=\"#out-now\"><span class=\"tslot\" data-slot=\"index.html:28\">Listen<\/span><\/a>\n              <a class=\"btn\" href=\"#roster\"><span class=\"tslot\" data-slot=\"index.html:29\">The Roster<\/span><\/a>\n              <a class=\"btn\" href=\"#contact\"><span class=\"tslot\" data-slot=\"index.html:30\">Bookings<\/span><\/a>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      <section class=\"section\" id=\"roster\">\n        <div class=\"container\">\n          <div class=\"section-head fade-in\">\n            <span class=\"section-kicker\"><span class=\"tslot\" data-slot=\"index.html:31\">The Roster<\/span><\/span>\n            <h2 class=\"section-title\"><span class=\"tslot\" data-slot=\"index.html:32\">Pick a deck.<\/span><\/h2>\n            <p class=\"section-copy\"><span class=\"tslot\" data-slot=\"index.html:33\">Four names aboard. Each one has its own boarding card — the catalog, the links, the way in.<\/span><\/p>\n          <\/div>\n\n          <nav class=\"doors fade-in\" aria-label=\"Choose an artist\">\n            <a class=\"door door--abx\" href=\"abraxas.html\">\n              <span class=\"door-name\"><span class=\"tslot\" data-slot=\"index.html:34\">ABRAXAS<\/span><\/span>\n              <span class=\"door-role\"><span class=\"tslot\" data-slot=\"index.html:35\">Noah · out front · the face<\/span><\/span>\n              <span class=\"door-reveal\">\n                <span class=\"door-line\"><span class=\"tslot\" data-slot=\"index.html:36\">Noah stepping off the vessel. HEXCORE, purple static, all teeth.<\/span><\/span>\n                <span class=\"board-btn\"><span class=\"tslot\" data-slot=\"index.html:37\">Board ABRAXAS →<\/span><\/span>\n              <\/span>\n            <\/a>\n\n            <a class=\"door door--str\" href=\"stretty.html\">\n              <span class=\"door-name\"><span class=\"tslot\" data-slot=\"index.html:38\">STRETTY<\/span><\/span>\n              <span class=\"door-role\"><span class=\"tslot\" data-slot=\"index.html:39\">The Ark · the hull · keeping it afloat<\/span><\/span>\n              <span class=\"door-reveal\">\n                <span class=\"door-line\"><span class=\"tslot\" data-slot=\"index.html:40\">The Ark itself — older brother, working the back. Depressions running deep.<\/span><\/span>\n                <span class=\"board-btn\"><span class=\"tslot\" data-slot=\"index.html:41\">Board STRETTY →<\/span><\/span>\n              <\/span>\n            <\/a>\n\n            <a class=\"door door--jus\" href=\"justin.html\">\n              <span class=\"door-name door-name--long\"><span class=\"tslot\" data-slot=\"index.html:42\">JUSTINN.CLOUT<\/span><\/span>\n              <span class=\"door-role\"><span class=\"tslot\" data-slot=\"index.html:43\">Video · photo · aboard<\/span><\/span>\n              <span class=\"door-reveal\">\n                <span class=\"door-line\"><span class=\"tslot\" data-slot=\"index.html:44\">Behind the camera and behind the edit. Profile and contact live on YTJobs.<\/span><\/span>\n                <span class=\"board-btn\"><span class=\"tslot\" data-slot=\"index.html:45\">Board JUSTINN.CLOUT →<\/span><\/span>\n              <\/span>\n            <\/a>\n\n            <a class=\"door door--cig\" href=\"ciggie.html\">\n              <span class=\"door-name door-name--long\"><span class=\"tslot\" data-slot=\"index.html:46\">CIGGYHOLSTER<\/span><\/span>\n              <span class=\"door-role\"><span class=\"tslot\" data-slot=\"index.html:47\">Artist · aboard<\/span><\/span>\n              <span class=\"door-reveal\">\n                <span class=\"door-line\"><span class=\"tslot\" data-slot=\"index.html:48\">Pulled out of the water, writing and releasing. Everything else runs off the Linktree.<\/span><\/span>\n                <span class=\"board-btn\"><span class=\"tslot\" data-slot=\"index.html:49\">Board CIGGYHOLSTER →<\/span><\/span>\n              <\/span>\n            <\/a>\n          <\/nav>\n        <\/div>\n      <\/section>\n\n      <section class=\"section\" id=\"game\" hidden>\n        <div class=\"container\">\n          <div class=\"section-head fade-in\">\n            <span class=\"section-kicker\"><span class=\"tslot\" data-slot=\"index.html:50\">Playable // Suit Purge<\/span><\/span>\n            <h2 class=\"section-title\"><span class=\"tslot\" data-slot=\"index.html:51\">Politicians, billionaires, trillionaires.<\/span><\/h2>\n            <p class=\"section-copy\"><span class=\"tslot\" data-slot=\"index.html:52\">A first-person shooter running in this page. No downloads, no plugins.<\/span><\/p>\n            <p class=\"section-copy game-disclaimer\" style=\"font-size:0.8rem; opacity:0.75; margin-top:0.6rem;\"><strong><span class=\"tslot\" data-slot=\"index.html:53\">Fiction:<\/span><\/strong> <span class=\"tslot\" data-slot=\"index.html:54\">all characters in<\/span> <em><span class=\"tslot\" data-slot=\"index.html:55\">Suit Purge<\/span><\/em> <span class=\"tslot\" data-slot=\"index.html:56\">are invented class archetypes. No real person, name, or likeness is depicted. See the<\/span> <a href=\"legal.html#satire\" style=\"color:var(--accent);text-decoration:underline;\"><span class=\"tslot\" data-slot=\"index.html:57\">satire &amp; fiction notice<\/span><\/a>.<\/p>\n          <\/div>\n        <\/div>\n\n        <div class=\"game-stage\">\n          \n\n          <div class=\"game-hud\" id=\"gameHud\" aria-hidden=\"true\">\n            <div class=\"hud-cell\"><span><span class=\"tslot\" data-slot=\"index.html:59\">HP<\/span><\/span><b id=\"hudHealth\">100<\/b><\/div>\n            <div class=\"hud-cell\"><span><span class=\"tslot\" data-slot=\"index.html:61\">Ammo<\/span><\/span><b id=\"hudAmmo\">60<\/b><\/div>\n            <div class=\"hud-cell\"><span><span class=\"tslot\" data-slot=\"index.html:63\">Wave<\/span><\/span><b id=\"hudWave\">1<\/b><\/div>\n            <div class=\"hud-cell\"><span><span class=\"tslot\" data-slot=\"index.html:65\">Cleared<\/span><\/span><b id=\"hudKills\">0<\/b><\/div>\n          <\/div>\n\n          <div class=\"game-overlay\" id=\"gameOverlay\">\n            <p class=\"game-kicker\"><span class=\"tslot\" data-slot=\"index.html:67\">HTG // Hex The Government<\/span><\/p>\n            <h2 id=\"gameOverlayTitle\"><span class=\"tslot\" data-slot=\"index.html:68\">SUIT PURGE<\/span><\/h2>\n            <p class=\"game-lead\" id=\"gameOverlayText\"><span class=\"tslot\" data-slot=\"index.html:69\">Politicians, billionaires, trillionaires and high command are loose in the maze. Clear the floor, wave after wave, until they clear you.<\/span><\/p>\n            <button class=\"btn btn-primary\" type=\"button\" id=\"gamePlay\"><span class=\"tslot\" data-slot=\"index.html:70\">Enter the maze<\/span><\/button>\n            <p class=\"game-keys\"><b><span class=\"tslot\" data-slot=\"index.html:71\">Desktop<\/span><\/b> <span class=\"tslot\" data-slot=\"index.html:72\">WASD move &middot; mouse aim &middot; click fire &middot; Esc pause.<\/span> <b><span class=\"tslot\" data-slot=\"index.html:73\">Phone<\/span><\/b> <span class=\"tslot\" data-slot=\"index.html:74\">left thumb moves &middot; right thumb aims &middot; FIRE shoots.<\/span><\/p>\n          <\/div>\n\n          <div class=\"game-touch\" id=\"gameTouch\" hidden>\n            <button class=\"game-fire\" id=\"gameFire\" type=\"button\" aria-label=\"Fire weapon\"><span class=\"tslot\" data-slot=\"index.html:75\">FIRE<\/span><\/button>\n          <\/div>\n\n          <div class=\"game-bar\">\n            <button class=\"game-chip\" type=\"button\" id=\"gameExit\" hidden><span class=\"tslot\" data-slot=\"index.html:76\">Exit to music<\/span><\/button>\n            <button class=\"game-chip\" type=\"button\" id=\"gameMute\" aria-pressed=\"false\"><span class=\"tslot\" data-slot=\"index.html:77\">Sound on<\/span><\/button>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      <section class=\"section\" id=\"story\">\n        <div class=\"container\">\n          <div class=\"section-head fade-in\">\n            <span class=\"section-kicker\"><span class=\"tslot\" data-slot=\"index.html:78\">The Story<\/span><\/span>\n            <h2 class=\"section-title\"><span class=\"tslot\" data-slot=\"index.html:79\">Built in the flood. Sent up as signal.<\/span><\/h2>\n            <p class=\"section-copy\">\n              <span class=\"tslot\" data-slot=\"index.html:80\">HTG is what we made instead of asking permission. No label suits — one vessel carrying the people on it, and everything they release, off a single deck.<\/span>\n            <\/p>\n          <\/div>\n\n          <div class=\"story-layout\">\n            <div class=\"story-panel info-card fade-in\">\n              <h3><span class=\"tslot\" data-slot=\"index.html:81\">About HTG<\/span><\/h3>\n              <p>\n                <span class=\"tslot\" data-slot=\"index.html:82\">Hex The Government is a vessel, not a brand exercise. Heavy without turning into empty noise, honest without going soft. Music for the ones treading water while the people who flooded the room count the takings.<\/span>\n              <\/p>\n              <p>\n                <span class=\"tslot\" data-slot=\"index.html:83\">Singles, visuals, merch and live all run off one deck instead of rotting across a hundred dead links. Four names aboard so far — ABRAXAS out front, Stretty holding the hull, Justinn.clout and ciggyholster pulled up alongside.<\/span>\n              <\/p>\n              <div class=\"label-badge\"><span class=\"tslot\" data-slot=\"index.html:84\">HTG / Hex The Government<\/span><\/div>\n            <\/div>\n\n            <div class=\"story-timeline\">\n              <article class=\"timeline-card fade-in\">\n                <div class=\"timeline-step\"><span class=\"tslot\" data-slot=\"index.html:85\">01 / raw files<\/span><\/div>\n                <h3><span class=\"tslot\" data-slot=\"index.html:86\">Cut alone, in the dark<\/span><\/h3>\n                <p><span class=\"tslot\" data-slot=\"index.html:87\">Started as damaged demos — stripped beats, layered distortion, melodies dragged out of bad nights and left honest.<\/span><\/p>\n              <\/article>\n              <article class=\"timeline-card fade-in\">\n                <div class=\"timeline-step\"><span class=\"tslot\" data-slot=\"index.html:88\">02 / the vessel<\/span><\/div>\n                <h3><span class=\"tslot\" data-slot=\"index.html:89\">HTG built to carry it<\/span><\/h3>\n                <p><span class=\"tslot\" data-slot=\"index.html:90\">No label suits. We built the ark ourselves — code UI, one deck where the sound lives without asking anyone.<\/span><\/p>\n              <\/article>\n              <article class=\"timeline-card fade-in\">\n                <div class=\"timeline-step\"><span class=\"tslot\" data-slot=\"index.html:91\">03 / off the ark<\/span><\/div>\n                <h3><span class=\"tslot\" data-slot=\"index.html:92\">Releases hit the water<\/span><\/h3>\n                <p><span class=\"tslot\" data-slot=\"index.html:93\">Streaming links, players, the Sequence — every track gets somewhere solid to land instead of drowning in drafts.<\/span><\/p>\n              <\/article>\n              <article class=\"timeline-card fade-in\">\n                <div class=\"timeline-step\"><span class=\"tslot\" data-slot=\"index.html:94\">04 / the rising<\/span><\/div>\n                <h3><span class=\"tslot\" data-slot=\"index.html:95\">Louder, harder, more aboard<\/span><\/h3>\n                <p><span class=\"tslot\" data-slot=\"index.html:96\">Next: heavier releases, more visuals, limited merch, live sets — and more names pulled out of the water under HTG.<\/span><\/p>\n              <\/article>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      <section class=\"section\" id=\"stats\">\n        <div class=\"conta  save it, put it on repeat and let it bleed into the rest of your week.<\/span><\/p>\n              <div class=\"pill-links\">\n                <a class=\"inline-link\" data-platform=\"spotify\" href=\"https://open.spotify.com/\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"tslot\" data-slot=\"index.html:109\">Open Spotify<\/span><\/a>\n              <\/div>\n            <\/article>\n            <article class=\"info-card fade-in\">\n              <h3><span class=\"tslot\" data-slot=\"index.html:110\">Apple Music<\/span><\/h3>\n              <p><span class=\"tslot\" data-slot=\"index.html:111\">For the ones who keep their libraries clean and their damage private. Lossless, no clutter, all teeth.<\/span><\/p>\n              <div class=\"pill-links\">\n                <a class=\"inline-link\" data-platform=\"appleMusic\" href=\"https://music.apple.com/\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"tslot\" data-slot=\"index.html:112\">Open Apple Music<\/span><\/a>\n              <\/div>\n            <\/article>\n            <article class=\"info-card fade-in\">\n              <h3><span class=\"tslot\" data-slot=\"index.html:113\">YouTube Music<\/span><\/h3>\n              <p><span class=\"tslot\" data-slot=\"index.html:114\">Official uploads, lyric cuts, visualisers. Where the sound comes with something to stare at while it drowns you.<\/span><\/p>\n              <div class=\"pill-links\">\n                <a class=\"inline-link\" data-platform=\"youtubeMusic\" href=\"https://music.youtube.com/\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"tslot\" data-slot=\"index.html:115\">Open YouTube Music<\/span><\/a>\n              <\/div>\n            <\/article>\n            <article class=\"info-card fade-in\">\n              <h3><span class=\"tslot\" data-slot=\"index.html:116\">SoundCloud<\/span><\/h3>\n              <p><span class=\"tslot\" data-slot=\"index.html:117\">The rough deck. Demos, alt mixes, the cuts still bleeding — the ones that should feel a little unfinished and a little dangerous.<\/span><\/p>\n              <div class=\"pill-links\">\n                <a class=\"inline-link\" data-platform=\"soundcloud\" href=\"https://soundcloud.com/\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"tslot\" data-slot=\"index.html:118\">Open SoundCloud<\/span><\/a>\n              <\/div>\n            <\/article>\n          <\/div>\n\n          <!-- Second name aboard with a catalog of his own. The platform cards\n               above are the label's main line; this is ciggyholster straight\n               off his artist profile, so the landing page carries his music and\n               not only a door to it. -->\n          <div class=\"section-head subsection-head fade-in\">\n            <span class=\"section-kicker\"><span class=\"tslot\" data-slot=\"index.html:119\">Also aboard // ciggyholster<\/span><\/span>\n            <h3 class=\"section-title\" style=\"font-size: clamp(1.5rem, 3vw, 2.4rem);\"><span class=\"tslot\" data-slot=\"index.html:120\">Ciggie's catalog, straight off his profile.<\/span><\/h3>\n            <p class=\"section-copy\"><span class=\"tslot\" data-slot=\"index.html:121\">Second name aboard with music out. Whatever he's released is what plays here.<\/span><\/p>\n          <\/div>\n\n          <div class=\"solo-embed embed-card fade-in\">\n            <iframe\n              title=\"ciggyholster on Spotify\"\n              src=\"https://open.spotify.com/embed/artist/0xMdknHv3WOTL2AeK1uHpo?utm_source=generator&amp;theme=0\"\n              height=\"352\"\n              loading=\"lazy\"\n              frameborder=\"0\"\n              allow=\"autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture\"><\/iframe>\n          <\/div>\n\n          <div class=\"pill-links fade-in\" style=\"margin-top: 1rem;\">\n            <a class=\"inline-link\" href=\"ciggie.html\"><span class=\"tslot\" data-slot=\"index.html:122\">Board ciggyholster →<\/span><\ slot=\"index.html:150\">Image Gallery<\/span><\/span>\n            <h2 class=\"section-title\"><span class=\"tslot\" data-slot=\"index.html:151\">Visuals, sessions, terminal-lit frames.<\/span><\/h2>\n            <p class=\"section-copy\"><span class=\"tslot\" data-slot=\"index.html:152\">Click any frame to open it.<\/span><\/p>\n          <\/div>\n\n          <div class=\"gallery-grid\">\n            <button class=\"gallery-item fade-in\" type=\"button\" data-gallery-index=\"0\" data-full=\"https://picsum.photos/seed/abraxasgallery1/1600/1200?grayscale\" data-caption=\"Night session / terminal room\">\n              <img class=\"gallery-thumb\" loading=\"lazy\" decoding=\"async\" width=\"900\" height=\"900\" src=\"https://picsum.photos/seed/abraxasgallery1/900/900?grayscale\" alt=\"Placeholder dark studio gallery image 1\" />\n              <span class=\"gallery-caption\"><span class=\"tslot\" data-slot=\"index.html:154\">Night session / terminal room<\/span><\/span>\n            <\/button>\n            <button class=\"gallery-item fade-in\" type=\"button\" data-gallery-index=\"1\" data-full=\"assets/placeholders/gallery-2.svg\" data-caption=\"Backstage static / blackout wash\">\n              <img class=\"gallery-thumb\" loading=\"lazy\" decoding=\"async\" width=\"900\" height=\"900\" src=\"assets/placeholders/gallery-2.svg\" alt=\"Placeholder dark performance gallery image 2\" />\n              <span class=\"gallery-caption\"><span class=\"tslot\" data-slot=\"index.html:156\">Backstage static / blackout wash<\/span><\/span>\n            <\/button>\n            <button class=\"gallery-item fade-in\" type=\"button\" data-gallery-index=\"2\" data-full=\"assets/placeholders/gallery-3.svg\" data-caption=\"Cover shoot / corrupted glow\">\n              <img class=\"gallery-thumb\" loading=\"lazy\" decoding=\"async\" width=\"900\" height=\"900\" src=\"assets/placeholders/gallery-3.svg\" alt=\"Placeholder cover shoot gallery image 3\" />\n              <span class=\"gall
