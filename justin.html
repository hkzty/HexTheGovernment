  <!-- New Rocker loads with display=block so headings paint once, in the gothic
       face — never the serif fallback morphing mid-load. Plex Mono keeps swap:
       its fallback is another monospace, so that swap is invisible. -->
  <link href="https://fonts.googleapis.com/css2?family=New+Rocker&display=block" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --ink: #f2f2f2;
      --dim: #8a8a8a;
      --line: rgba(242, 242, 242, 0.14);
      --jus: #ff9b3d;   /* Justinn.clout orange */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      line-height: 1.6;
    }
    #matrix-rain { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.45; pointer-events: none; }
    .veil {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(120% 90% at 50% 20%, rgba(10,10,10,0) 0%, rgba(10,10,10,0.74) 66%, rgba(10,10,10,0.94) 100%);
    }
    .shell { position: relative; z-index: 2; width: min(72rem, 92vw); margin: 0 auto; padding: 1.4rem 0 3rem; }

    .topline { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0 2rem; font-size: 0.72rem; letter-spacing: 0.14em; }
    .topline a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
    .topline a:hover { border-color: var(--jus); color: var(--jus); }
    .topline .tag { color: var(--dim); letter-spacing: 0.3em; text-transform: uppercase; }

    /* ---- Deck sigil ------------------------------------------------------ */
    /* Huge watermark initial behind the content, under the veil so the
       gradient tames it. Decoration only. */
    .sigil {
      position: fixed; z-index: 1; right: -4vw; top: 2vh; line-height: 1;
      font-family: "New Rocker", serif; font-size: min(78vh, 68vw);
      color: var(--jus); opacity: 0.05; pointer-events: none; user-select: none;
    }

    /* ---- Hero ------------------------------------------------------------ */
    .hero { padding: clamp(1.5rem, 6vh, 4rem) 0 2.5rem; }
    /* Staggered rise on load (html.js only, so no-JS readers see everything
       instantly), a slow breathing glow on the name, and a scanline sweeping
       under the hero. All stilled under prefers-reduced-motion below. */
    @keyframes deck-rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes name-breathe {
      0%, 100% { text-shadow: 0 0 34px rgba(255, 155, 61, 0.28); }
      50% { text-shadow: 0 0 58px rgba(255, 155, 61, 0.5); }
    }
    html.js .hero > * { animation: deck-rise 0.65s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    html.js .hero > *:nth-child(2) { animation-delay: 0.07s; }
    html.js .hero > *:nth-child(3) { animation-delay: 0.14s; }
    html.js .hero > *:nth-child(4) { animation-delay: 0.21s; }
    html.js .hero > *:nth-child(5) { animation-delay: 0.28s; }
    html.js .name { animation: deck-rise 0.65s cubic-bezier(0.2, 0.7, 0.2, 1) 0.07s both, name-breathe 7s ease-in-out 1.2s infinite; }
    .hero::after {
      content: ""; display: block; height: 1px; margin-top: 2.4rem; opacity: 0.55;
      background: linear-gradient(90deg, transparent, var(--jus), transparent);
      background-size: 220% 100%;
      animation: hero-scan 6s linear infinite;
    }
    @keyframes hero-scan { from { background-position: 220% 0; } to { background-position: -220% 0; } }
    .eyebrow { font-size: 0.68rem; letter-spacing: 0.4em; text-transform: uppercase; color: var(--jus); margin-bottom: 1rem; }
    .name {
      font-family: "New Rocker", "IBM Plex Mono", serif;
      font-weight: 400; line-height: 0.9;
      /* Thirteen characters against STRETTY's seven — the clamp ceiling drops
         or New Rocker overruns the viewport on narrow phones. */
      font-size: clamp(2.1rem, 8.5vw, 5.4rem);
      text-shadow: 0 0 34px rgba(255, 155, 61, 0.28);
      overflow-wrap: anywhere;
    }
    .name-logo {
      display: block; width: min(100%, 40rem); height: auto;
      margin: -1rem 0 -1.4rem;
      filter: drop-shadow(0 0 30px rgba(255, 155, 61, 0.28));
    }
    .tagline { margin-top: 0.6rem; font-size: clamp(1rem, 3vw, 1.5rem); color: var(--jus); letter-spacing: 0.04em; }
    .role { margin-top: 0.9rem; font-size: 0.74rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--dim); }

    /* ---- Work ------------------------------------------------------------ */
    .section { margin-top: 3rem; }
    .section-kicker { font-size: 0.68rem; letter-spacing: 0.34em; text-transform: uppercase; color: var(--dim); margin-bottom: 1rem; }
    .section-kicker b { color: var(--jus); font-weight: 500; }
    .embed-wrap { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: rgba(20, 20, 20, 0.5); }
    .embed-wrap iframe { display: block; width: 100%; border: 0; }

    /* ---- The reel — click-to-play YouTube cards -------------------------- */
    /* Each card is a plain link to the video carrying only YouTube's own
       thumbnail; a tiny script upgrades the click into an in-page player.
       Four real YouTube iframes up front would cost megabytes before anyone
       pressed play. Thumbs sit desaturated until hover so the wall reads as
       one deck, then ignite. */
    .yt {
      position: relative; display: block; aspect-ratio: 16 / 9;
      border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
      background: #141414;
    }
    .yt img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      /* hqdefault ships 4:3 with letterbox bars; cover crops them off */
      object-fit: cover;
      filter: grayscale(1) brightness(0.82) contrast(1.05);
      transition: filter 0.35s ease, transform 0.35s ease;
    }
    .yt::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, rgba(255, 155, 61, 0.10), rgba(10, 10, 10, 0.55) 82%);
      transition: opacity 0.35s ease;
    }
    .yt:hover img, .yt:focus-visible img { filter: none; transform: scale(1.03); }
    .yt:hover::after, .yt:focus-visible::after { opacity: 0.35; }
    .yt:focus-visible { outline: 2px solid var(--jus); outline-offset: 3px; }
    .yt-play {
      position: absolute; z-index: 1; top: 50%; left: 50%; width: 64px; height: 64px;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255, 155, 61, 0.8); border-radius: 999px;
      background: rgba(10, 10, 10, 0.62);
      transition: box-shadow 0.35s ease, background 0.35s ease;
    }
    .yt-play::before {
      content: ""; position: absolute; top: 50%; left: 50%;
      transform: translate(-38%, -50%);
      border-left: 18px solid var(--jus);
      border-top: 11px solid transparent; border-bottom: 11px solid transparent;
    }
    .yt:hover .yt-play, .yt:focus-visible .yt-play {
      box-shadow: 0 0 30px rgba(255, 155, 61, 0.45);
      background: rgba(10, 10, 10, 0.8);
    }
    .yt.playing iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .yt.playing::after, .yt.playing .yt-play { display: none; }
    .yt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.9rem; margin-top: 0.9rem; }
    .yt-grid .yt-play { width: 52px; height: 52px; }
    .yt-grid .yt-play::before { border-left-width: 14px; border-top-width: 9px; border-bottom-width: 9px; }
    @media (max-width: 700px) {
      .yt-grid { grid-template-columns: 1fr; }
    }

    /* ---- Links ----------------------------------------------------------- */
    .links { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-top: 1.6rem; }
    .links a {
      display: inline-block; padding: 0.6rem 1.4rem; border: 1px solid var(--line);
      border-radius: 999px; color: var(--ink); text-decoration: none;
      font-size: 0.76rem; letter-spacing: 0.12em;
      transition: color 0.25s ease, border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
    }
    .links a:hover, .links a:focus-visible {
      border-color: var(--jus); color: var(--jus);
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(255, 155, 61, 0.20);
    }

    /* ---- Footer ---------------------------------------------------------- */
    .foot { margin-top: 3.4rem; padding-top: 1.6rem; border-top: 1px solid var(--line); font-size: 0.74rem; color: var(--dim); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .foot a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
    .foot a:hover { border-color: var(--jus); color: var(--jus); }

    @media (max-width: 560px) {
      .foot { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto; }
      html.js .hero > *, html.js .name, .hero::after { animation: none !important; }
      .yt img, .yt::after, .yt-play, .links a { transition: none; }
      .yt:hover img, .yt:focus-visible img { transform: none; }
      .links a:hover, .links a:focus-visible { transform: none; }
    }
  </style>

  <script>
    (function () {
      /* Upgrade the reel cards from links into in-page players on click.
         Without JS every card stays an ordinary link to the video. */
      var cards = document.querySelectorAll('a[data-yt]');
      for (var i = 0; i < cards.length; i++) {
        (function (card) {
          card.addEventListener('click', function (e) {
            if (card.classList.contains('playing')) return;
            e.preventDefault();
            var frame = document.createElement('iframe');
            frame.src = 'https://www.youtube-nocookie.com/embed/' +
              card.getAttribute('data-yt') + '?autoplay=1&rel=0';
            frame.title = card.getAttribute('aria-label') || 'YouTube player';
            frame.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
            frame.setAttribute('allowfullscreen', '');
            card.classList.add('playing');
            card.removeAttribute('href');
            card.removeAttribute('target');
            card.innerHTML = '';
            card.appendChild(frame);
          });
        })(cards[i]);
      }

      /* The featured card deserves better than hqdefault's 480px. YouTube
         answers a missing maxresdefault with a 120px stub and HTTP 200, so
         probe and only swap in a real full-size frame. */
      var hero = document.querySelector('.yt-feature img');
      if (hero) {
        var probe = new Image();
        probe.onload = function () {
          if (probe.naturalWidth > 1000) hero.src = probe.src;
        };
        probe.src = 'https://i.ytimg.com/vi/pRW9l-BuEk4/maxresdefault.jpg';
      }
    })();
  </script>
