  <style>
    /* HTG-only chrome: the masthead wordmark and the artist doors.
       Everything else on this page comes from style.css. */
    :root { --abx: #b478ff; --str: #16c85a; --jus: #ff9b3d; --cig: #2fd4e0; }

    a.brand-title { color: inherit; text-decoration: none; }

    /* No hero aside on HTG — collapse style.css's two-column hero to one. */
    .hero-content { grid-template-columns: 1fr; }
    .mast { text-align: center; max-width: 52rem; margin: 0 auto; }
    .mast .curse {
      font-size: clamp(0.62rem, 1.6vw, 0.8rem);
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.4rem;
    }
    .mast .wordmark {
      font-family: "New Rocker", "IBM Plex Mono", serif;
      font-weight: 400;
      line-height: 0.9;
      font-size: clamp(3.4rem, 15vw, 9rem);
      letter-spacing: 0.02em;
    }
    /* Drawn logos — alpha-keyed webp cut from the supplied artwork
       (assets/logos/). The name stays in the DOM as alt / visually-hidden
       text for screen readers and search. */
    .wordmark-logo {
      display: block;
      width: min(100%, 44rem);
      height: auto;
      margin: -1.2rem auto -1.6rem;
      filter: drop-shadow(0 0 28px rgba(255, 255, 255, 0.18));
    }
    .door-logo {
      display: block;
      position: relative;
      z-index: 1;
      width: min(92%, 24rem);
      height: auto;
      margin: 0 auto 0.4rem;
      transition: transform 0.4s ease, filter 0.4s ease;
    }
    .door:hover .door-logo, .door:focus-visible .door-logo { transform: scale(1.04); }
    .door-name--logo { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .mast .expand {
      margin-top: 0.85rem;
      font-size: clamp(0.72rem, 2.2vw, 1rem);
      letter-spacing: 0.5em;
      text-transform: uppercase;
      padding-left: 0.5em; /* optical: absorb the trailing letter-spacing */
    }

    /* ---- The artist doors ------------------------------------------------ */
    .doors {
      display: flex;
      flex-wrap: wrap;
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .door {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* Basis >1/3 forces exactly two per row; the row height lives here rather
         than on .doors so both rows stay full-height once the list wraps. */
      flex: 1 1 40%;
      min-height: clamp(15rem, 28vh, 21rem);
      padding: 2rem 1.25rem;
      overflow: hidden;
      text-align: center;
      text-decoration: none;
      color: var(--text);
      background: rgba(10, 10, 10, 0.62);
      transition: flex-grow 0.5s ease, background 0.4s ease, filter 0.4s ease;
    }
    /* ABRAXAS is the lit, dominant door; the rest sit recessed and dimmer. */
    .door--abx { flex-grow: 1.35; --door-c: rgba(180, 120, 255, 0.5); }
    .door--str, .door--jus, .door--cig { filter: brightness(0.72) saturate(0.6); }
    .door--str { --door-c: rgba(22, 200, 90, 0.45); }
    .door--jus { --door-c: rgba(255, 155, 61, 0.45); }
    .door--cig { --door-c: rgba(47, 212, 224, 0.45); }
    .door:hover, .door:focus-visible { flex-grow: 2; filter: none; background: rgba(10, 10, 10, 0.25); }

    /* The wall of work behind each name: a collage of that artist's real
       cover art (resolved at runtime from Spotify's oEmbed — see the loader
       script by the doors) or video stills. Sits dim and desaturated under
       the typography, snaps to full colour with the deck glow on hover.
       If the art never resolves the imgs stay src-less and invisible, and
       the door is exactly the typography-only door it was before. */
    .door-art {
      position: absolute; inset: 0; z-index: 0;
      display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr;
      pointer-events: none;
    }
    .door-art img {
      width: 100%; height: 100%; object-fit: cover;
      opacity: 0;
      filter: grayscale(1) brightness(0.34) contrast(1.05);
      transition: opacity 0.6s ease, filter 0.45s ease;
    }
    .door-art img.ok { opacity: 0.85; }
    /* Three tiles: let the odd one out take the whole bottom row. */
    .door-art img.ok:last-child:nth-child(odd) { grid-column: 1 / -1; }
    .door-art::after {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(120% 100% at 50% 100%, var(--door-c, transparent), transparent 72%);
      opacity: 0; transition: opacity 0.45s ease;
    }
    .door:hover .door-art img, .door:focus-visible .door-art img {
      filter: grayscale(0) brightness(0.6) saturate(1.15);
    }
    .door:hover .door-art::after, .door:focus-visible .door-art::after { opacity: 0.5; }
    .door-name { position: relative; z-index: 1; }
    .door--abx:hover, .door--abx:focus-visible { box-shadow: inset 0 0 140px rgba(180, 120, 255, 0.28); }
    .door--str:hover, .door--str:focus-visible { box-shadow: inset 0 0 140px rgba(22, 200, 90, 0.24); }
    .door--jus:hover, .door--jus:focus-visible { box-shadow: inset 0 0 140px rgba(255, 155, 61, 0.24); }
    .door--cig:hover, .door--cig:focus-visible { box-shadow: inset 0 0 140px rgba(47, 212, 224, 0.24); }

    .door-name {
      font-family: "New Rocker", serif;
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 1;
      max-width: 100%;
      overflow-wrap: anywhere;
      transition: color 0.4s ease, text-shadow 0.4s ease;
    }
    .door--abx:hover .door-name, .door--abx:focus-visible .door-name {
      color: var(--abx); text-shadow: 0 0 30px rgba(180, 120, 255, 0.55);
    }
    .door--str:hover .door-name, .door--str:focus-visible .door-name {
      color: var(--str); text-shadow: 0 0 30px rgba(22, 200, 90, 0.5);
    }
    .door--jus:hover .door-name, .door--jus:focus-visible .door-name {
      color: var(--jus); text-shadow: 0 0 30px rgba(255, 155, 61, 0.5);
    }
    .door--cig:hover .door-name, .door--cig:focus-visible .door-name {
      color: var(--cig); text-shadow: 0 0 30px rgba(47, 212, 224, 0.5);
    }
    /* Lore watermark: sits between the cover art and the logo, barely there. */
    .door-lore {
      position: absolute; inset: 0; z-index: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: "New Rocker", serif;
      font-size: clamp(3rem, 9vw, 7rem);
      line-height: 1;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--text);
      opacity: 0.045;
      pointer-events: none;
      user-select: none;
      transition: opacity 0.45s ease;
    }
    .door:hover .door-lore, .door:focus-visible .door-lore { opacity: 0.09; }

    @media (max-width: 760px) {
      .doors { flex-direction: column; flex-wrap: nowrap; }
      /* Stacked, four deep — drop the row height so the list stays scannable. */
      .door { flex: 1 1 auto; min-height: 0; }
      .door--str, .door--jus, .door--cig { filter: brightness(0.8) saturate(0.7); }
    }
    @media (prefers-reduced-motion: reduce) {
      .door, .door-name, .door-lore, .door-art img, .door-art::after { transition: none; }
    }
  </style>

          <script>
            (function () {
              /* Door art loader. Spotify's oEmbed endpoint is CORS-open and
                 needs no key, so each data-cover URL resolves to its real
                 cover art in the visitor's browser. (Server-side this repo
                 has never managed that call — datacenter IPs get 403s, see
                 scripts/scraper.js — but browsers on normal connections are
                 fine.) Any failure just leaves that img src-less and
                 invisible: the door falls back to typography only.
                 data-thumb imgs are plain direct-src thumbnails. */
              var conn = navigator.connection;
              if (conn && (conn.saveData || /(^|-)2g$/.test(conn.effectiveType || ''))) return;

              document.querySelectorAll('.door-art img[data-thumb]').forEach(function (img) {
                img.addEventListener('load', function () { img.classList.add('ok'); }, { once: true });
                img.src = img.getAttribute('data-thumb');
              });

              var cacheGet = function (k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } };
              var cacheSet = function (k, v) { try { sessionStorage.setItem(k, v); } catch (e) { /* full/blocked */ } };
              document.querySelectorAll('.door-art img[data-cover]').forEach(function (img) {
                var url = img.getAttribute('data-cover');
                var key = 'htg-cover:' + url;
                img.addEventListener('load', function () { img.classList.add('ok'); }, { once: true });
                var cached = cacheGet(key);
                if (cached) { img.src = cached; return; }
                fetch('https://open.spotify.com/oembed?url=' + encodeURIComponent(url))
                  .then(function (res) { return res.ok ? res.json() : null; })
                  .then(function (data) {
                    if (data && data.thumbnail_url) {
                      cacheSet(key, data.thumbnail_url);
                      img.src = data.thumbnail_url;
                    }
                  })
                  .catch(function () { /* stays typography-only */ });
              });
            })();
          </script>
