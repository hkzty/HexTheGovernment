# Fails if mobile.html no longer matches index.html + style.css.
#
# mobile.html is generated (scripts/build-mobile.js). It has silently fallen
# behind index.html before — once for months, leaving phones on an older
# version of the site with none of the roster or vessel copy on it. This job
# is the tripwire: change a source, regenerate, commit both.
name: Mobile page in sync

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "mobile.html"
      - "scripts/build-mobile.js"
  pull_request:
    paths:
      - "index.html"
      - "style.css"
      - "mobile.html"
      - "scripts/build-mobile.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check mobile.html is up to date
        run: npm run check:mobile
