name: Content sync (auto-scraper)

# PAUSED. The 6-hourly schedule is commented out deliberately.
#
# Every one of the 83 runs to date failed, and the job has never once
# produced assets/data/content.json. All sources fail the same way:
#   403 Forbidden for https://open.spotify.com/oembed?url=...
# Spotify's oEmbed endpoint appears to reject datacenter IPs, and Actions
# runners are datacenter IPs, which fits a job that has never succeeded
# rather than one that broke. The scraper then hits its own guard,
# "No items resolved - refusing to overwrite content.json", and exits 1.
#
# Re-enable by uncommenting the schedule once the fetch path is fixed.
# workflow_dispatch is left on so it can still be run by hand to test.
on:
  # schedule:
  #   - cron: "0 */6 * * *" # every 6 hours, matching config.js albums.updateInterval
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: content-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run scraper
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node scripts/scraper.js

      - name: Commit and push if content changed
        run: |
          git config user.name "htg-content-sync[bot]"
          git config user.email "actions@github.com"
          git add assets/data/content.json assets/gallery/
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "Auto-sync: refresh content.json and gallery"
            git push
          fi
