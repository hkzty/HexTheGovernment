  <style>
    :root {
      --bg: #0a0a0a;
      --ink: #f5f5f3;
      --dim: #9a9a9a;
      --line: rgba(255, 255, 255, 0.18);
      --acc: #ffffff;   /* HTG white — matches the home page */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.08), transparent 30%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 18%),
        var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      line-height: 1.6;
    }
    /* Same fixed grid overlay as the home page (style.css body::before). */
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.15));
    }
    #matrix-rain { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.55; pointer-events: none; }
    .veil {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(120% 90% at 50% 20%, rgba(10,10,10,0) 0%, rgba(10,10,10,0.74) 66%, rgba(10,10,10,0.94) 100%);
    }
    .shell { position: relative; z-index: 2; width: min(72rem, 92vw); margin: 0 auto; padding: 1.4rem 0 3rem; }

    .topline { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0 2rem; font-size: 0.72rem; letter-spacing: 0.14em; }
    .topline a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
    .topline a:hover { border-color: var(--acc); color: var(--acc); }
    .topline .tag { color: var(--dim); letter-spacing: 0.3em; text-transform: uppercase; }

    .hero { padding: clamp(1.5rem, 6vh, 4rem) 0 2.5rem; }
    .eyebrow { font-size: 0.68rem; letter-spacing: 0.4em; text-transform: uppercase; color: var(--acc); margin-bottom: 1rem; }
    .name {
      font-family: "New Rocker", "IBM Plex Mono", serif;
      font-weight: 400; line-height: 0.9;
      font-size: clamp(2.4rem, 10vw, 6rem);
      text-shadow: 0 0 34px rgba(255, 255, 255, 0.25);
    }
    .tagline { margin-top: 0.6rem; font-size: clamp(1rem, 3vw, 1.5rem); color: var(--acc); letter-spacing: 0.04em; }

    .section { margin-top: 2.6rem; }
    .section-kicker { font-size: 0.68rem; letter-spacing: 0.34em; text-transform: uppercase; color: var(--dim); margin-bottom: 1rem; }
    .section-kicker b { color: var(--acc); font-weight: 500; }
    .embed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
    .embed-wrap { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: rgba(27, 30, 30, 0.82); }
    .embed-wrap iframe { display: block; width: 100%; border: 0; }
    .pin-tag { display: inline-block; font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--acc); border: 1px solid var(--line); border-radius: 999px; padding: 0.2rem 0.6rem; margin-bottom: 0.6rem; }

    .links { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-top: 1.6rem; }
    .links a {
      display: inline-block; padding: 0.6rem 1.4rem; border: 1px solid var(--line);
      border-radius: 999px; color: var(--ink); text-decoration: none;
      font-size: 0.76rem; letter-spacing: 0.12em;
    }
    .links a:hover { border-color: var(--acc); color: var(--acc); }

    .foot { margin-top: 3.4rem; padding-top: 1.6rem; border-top: 1px solid var(--line); font-size: 0.74rem; color: var(--dim); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .foot a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
    .foot a:hover { border-color: var(--acc); color: var(--acc); }

    @media (max-width: 560px) {
      .foot { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }

  <script src="config.js"></script>
  <script>
    (function () {
      var cfg = (window.ABRAXAS_CONFIG && window.ABRAXAS_CONFIG.sequence) || {};

      function spotifyEmbed(url) {
        var m = /open\.spotify\.com\/(track|album|artist)\/([A-Za-z0-9]+)/.exec(url || '');
        if (!m) return null;
        var kind = m[1];
        var id = m[2];
        var height = kind === 'track' ? 152 : 352;
        var wrap = document.createElement('div');
        wrap.className = 'embed-wrap';
        var iframe = document.createElement('iframe');
        iframe.loading = 'lazy';
        iframe.height = height;
        iframe.title = 'ABRAXAS on Spotify';
        iframe.src = 'https://open.spotify.com/embed/' + kind + '/' + id + '?utm_source=generator&theme=0';
        iframe.allow = 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';
        wrap.appendChild(iframe);
        return wrap;
      }

      function fill(gridId, urls, pinned) {
        var grid = document.getElementById(gridId);
        if (!grid) return;
        grid.innerHTML = '';
        if (!urls || !urls.length) {
          // Nothing configured: the section goes, no placeholder.
          var section = grid.closest('section');
          if (section) section.hidden = true;
          return;
        }
        urls.forEach(function (url) {
          var embed = spotifyEmbed(url);
          if (!embed) return;
          if (pinned) {
            var col = document.createElement('div');
            var tag = document.createElement('span');
            tag.className = 'pin-tag';
            tag.textContent = cfg.highlightTag || 'PINNED';
            col.appendChild(tag);
            col.appendChild(embed);
            grid.appendChild(col);
          } else {
            grid.appendChild(embed);
          }
        });
      }

      fill('highlightGrid', cfg.highlights, true);
      fill('albumGrid', cfg.albums, false);

      var openLink = document.getElementById('openSpotify');
      if (openLink && cfg.artist) openLink.href = cfg.artist;
    })();
  </script>
