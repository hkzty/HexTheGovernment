  <!-- New Rocker loads with display=block so headings paint once, in the gothic
       face — never the serif fallback morphing mid-load. Plex Mono keeps swap:
       its fallback is another monospace, so that swap is invisible. -->
  <link href="https://fonts.googleapis.com/css2?family=New+Rocker&display=block" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #03222a;
      --ink: #f2f2f2;
      --dim: #93b7bd;
      --line: rgba(47, 212, 224, 0.20);
      --cig: #2fd4e0;   /* ciggyholster cyan */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      line-height: 1.6;
    }
    #matrix-rain { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.45; pointer-events: none; }
    .veil {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(120% 90% at 50% 20%, rgba(3,34,42,0) 0%, rgba(1,18,23,0.74) 66%, rgba(1,18,23,0.94) 100%);
    }
    .shell { position: relative; z-index: 2; width: min(72rem, 92vw); margin: 0 auto; padding: 1.4rem 0 3rem; }

    .topline { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0 2rem; font-size: 0.72rem; letter-spacing: 0.14em; }
    .topline a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
    .topline a:hover { border-color: var(--cig); color: var(--cig); }
    .topline .tag { color: var(--dim); letter-spacing: 0.3em; text-transform: uppercase; }

    /* ---- Deck sigil ------------------------------------------------------ */
    /* Huge watermark initial behind the content, under the veil so the
       gradient tames it. Decoration only. */
    .sigil {
      position: fixed; z-index: 1; right: -4vw; top: 2vh; line-height: 1;
      font-family: "New Rocker", serif; font-size: min(78vh, 68vw);
      color: var(--cig); opacity: 0.05; pointer-events: none; user-select: none;
    }

    /* ---- Hero ------------------------------------------------------------ */
    .hero { padding: clamp(1.5rem, 6vh, 4rem) 0 2.5rem; }
    /* Staggered rise on load (html.js only, so no-JS readers see everything
       instantly), a slow breathing glow on the name, and a scanline sweeping
       under the hero. All stilled under prefers-reduced-motion below. */
    @keyframes deck-rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes name-breathe {
      0%, 100% { text-shadow: 0 0 34px rgba(47, 212, 224, 0.32); }
      50% { text-shadow: 0 0 58px rgba(47, 212, 224, 0.55); }
    }
    html.js .hero > * { animation: deck-rise 0.65s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    html.js .hero > *:nth-child(2) { animation-delay: 0.07s; }
    html.js .hero > *:nth-child(3) { animation-delay: 0.14s; }
    html.js .hero > *:nth-child(4) { animation-delay: 0.21s; }
    html.js .hero > *:nth-child(5) { animation-delay: 0.28s; }
    html.js .name { animation: deck-rise 0.65s cubic-bezier(0.2, 0.7, 0.2, 1) 0.07s both, name-breathe 7s ease-in-out 1.2s infinite; }
    .hero::after {
      content: ""; display: block; height: 1px; margin-top: 2.4rem; opacity: 0.55;
      background: linear-gradient(90deg, transparent, var(--cig), transparent);
      background-size: 220% 100%;
      animation: hero-scan 6s linear infinite;
    }
    @keyframes hero-scan { from { background-position: 220% 0; } to { background-position: -220% 0; } }
    .eyebrow { font-size: 0.68rem; letter-spacing: 0.4em; text-transform: uppercase; color: var(--cig); margin-bottom: 1rem; }
    .name {
      font-family: "New Rocker", "IBM Plex Mono", serif;
      font-weight: 400; line-height: 0.9;
      /* Twelve characters against ABRAXAS's seven — the clamp ceiling drops or
         New Rocker overruns the viewport on narrow phones. */
      font-size: clamp(2.1rem, 8.5vw, 5.4rem);
      text-shadow: 0 0 34px rgba(47, 212, 224, 0.32);
      overflow-wrap: anywhere;
    }
    .name-logo {
      display: block; width: min(100%, 40rem); height: auto;
      margin: -1rem 0 -1.4rem;
      filter: drop-shadow(0 0 30px rgba(47, 212, 224, 0.32));
    }
    .tagline { margin-top: 0.6rem; font-size: clamp(1rem, 3vw, 1.5rem); color: var(--cig); letter-spacing: 0.04em; }
    .role { margin-top: 0.9rem; font-size: 0.74rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--dim); }

    /* ---- Music ----------------------------------------------------------- */
    .section { margin-top: 3rem; }
    .section-kicker { font-size: 0.68rem; letter-spacing: 0.34em; text-transform: uppercase; color: var(--dim); margin-bottom: 1rem; }
    .section-kicker b { color: var(--cig); font-weight: 500; }
    .embed-wrap {
      border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: rgba(20, 20, 20, 0.5);
      transition: border-color 0.35s ease, box-shadow 0.35s ease;
    }
    .embed-wrap:hover, .embed-wrap:focus-within {
      border-color: rgba(47, 212, 224, 0.55);
      box-shadow: 0 0 36px rgba(47, 212, 224, 0.16);
    }
    .embed-wrap iframe { display: block; width: 100%; border: 0; }
    /* The cuts — same shape as Justin's reel: one featured player up top,
       compact players in a row beneath. */
    .cut-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 0.9rem; margin-top: 0.9rem; }

    /* ---- SoundCloud facade ------------------------------------------------ */
    /* A link to his real profile wearing an equalizer; the inline script at
       the bottom swaps a click into the actual SoundCloud player, so the page
       ships no player code until someone asks for it. */
    .sc-card {
      display: flex; align-items: center; gap: 1.3rem;
      padding: 1.4rem 1.5rem; border: 1px solid var(--line); border-radius: 14px;
      background: rgba(20, 20, 20, 0.5); color: var(--ink); text-decoration: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .sc-card:hover, .sc-card:focus-visible {
      border-color: var(--cig);
      box-shadow: 0 0 30px rgba(47, 212, 224, 0.18);
    }
    .sc-card b { color: var(--cig); }
    .sc-card .bars { display: flex; align-items: flex-end; gap: 4px; height: 36px; flex: none; }
    .sc-card .bars i {
      width: 4px; border-radius: 2px; background: var(--cig); transform-origin: bottom;
      animation: eq 1.2s ease-in-out infinite;
    }
    .sc-card .bars i:nth-child(1) { height: 45%; animation-delay: 0s; }
    .sc-card .bars i:nth-child(2) { height: 80%; animation-delay: 0.15s; }
    .sc-card .bars i:nth-child(3) { height: 60%; animation-delay: 0.3s; }
    .sc-card .bars i:nth-child(4) { height: 100%; animation-delay: 0.45s; }
    .sc-card .bars i:nth-child(5) { height: 55%; animation-delay: 0.6s; }
    .sc-card .bars i:nth-child(6) { height: 85%; animation-delay: 0.75s; }
    .sc-card .bars i:nth-child(7) { height: 40%; animation-delay: 0.9s; }
    @keyframes eq { 0%, 100% { transform: scaleY(0.45); } 50% { transform: scaleY(1); } }
    .sc-card.playing { display: block; padding: 0; overflow: hidden; }
    .sc-card.playing iframe { display: block; width: 100%; height: 450px; border: 0; }

    /* ---- Links ----------------------------------------------------------- */
    .links { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-top: 1.6rem; }
    .links a {
      display: inline-block; padding: 0.6rem 1.4rem; border: 1px solid var(--line);
      border-radius: 999px; color: var(--ink); text-decoration: none;
      font-size: 0.76rem; letter-spacing: 0.12em;
      transition: color 0.25s ease, border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
    }
    .links a:hover, .links a:focus-visible {
      border-color: var(--cig); color: var(--cig);
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(47, 212, 224, 0.20);
    }

    /* ---- Footer ---------------------------------------------------------- */
    .foot { margin-top: 3.4rem; padding-top: 1.6rem; border-top: 1px solid var(--line); font-size: 0.74rem; color: var(--dim); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .foot a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
    .foot a:hover { border-color: var(--cig); color: var(--cig); }

    @media (max-width: 560px) {
      .foot { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto; }
      html.js .hero > *, html.js .name, .hero::after, .sc-card .bars i { animation: none !important; }
      .links a, .embed-wrap, .sc-card { transition: none; }
      .links a:hover, .links a:focus-visible { transform: none; }
    }
  </style>
</head>

  <script>
    (function () {
      /* Upgrade the SoundCloud card from a profile link into the in-page
         player on click. Without JS it stays an ordinary link. */
      var card = document.querySelector('.sc-card');
      if (!card) return;
      card.addEventListener('click', function (e) {
        if (card.classList.contains('playing')) return;
        e.preventDefault();
        var frame = document.createElement('iframe');
        frame.src = 'https://w.soundcloud.com/player/?url=' +
          encodeURIComponent('https://soundcloud.com/user-945488980-12789874') +
          '&color=%232fd4e0&auto_play=true&show_user=true';
        frame.title = 'ciggyholster on SoundCloud';
        frame.allow = 'autoplay';
        card.classList.add('playing');
        card.removeAttribute('href');
        card.removeAttribute('target');
        card.innerHTML = '';
        card.appendChild(frame);
      });
    })();
  </script>
